const root=document.getElementById('gh-preview');let language='es',step=0,showResult=false;
try{language=localStorage.getItem('es-lang')==='en'?'en':'es';}catch(e){}
const L=(es,en)=>language==='es'?es:en,db=()=>DATA[language],A=()=>DATA.actions[language];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={scores:[],tasks:{},project:'',stage:'new'},services=[];
try{const s=JSON.parse(localStorage.getItem('gh-radar-v3')||'null');if(s&&Array.isArray(s.scores))state={...state,...s};const p=JSON.parse(localStorage.getItem('gh-services-v1')||'null');if(Array.isArray(p))services=p;}catch(e){}
const save=()=>{try{localStorage.setItem('gh-radar-v3',JSON.stringify(state));localStorage.setItem('gh-services-v1',JSON.stringify(services));}catch(e){const n=root.querySelector('#gh-save-note');if(n)n.textContent=L('No se pudo guardar. Descarga una copia antes de salir.','Unable to save. Download a copy before leaving.');}};
const status=i=>!Number.isInteger(state.scores[i])?'unknown':state.scores[i]<=2?'absent':state.scores[i]===3?'partial':'ready';
const rows=()=>db().pillars.map((p,i)=>({p,i,status:status(i)}));
function selection(){const r=rows(),g=r.filter(x=>['absent','partial'].includes(x.status)).sort((a,b)=>state.scores[a.i]-state.scores[b.i]||a.i-b.i),u=r.filter(x=>x.status==='unknown');if(status(0)==='unknown')return {row:r[0],reason:L('Primero verifica el mandato y los responsables. Sin información no significa una brecha, pero falta confirmar quién autoriza y sostiene el trabajo.','First verify the mandate and accountable owners. Missing information is not a deficit, but decision authority and continuity remain unconfirmed.')};if(state.scores[0]<=2)return {row:r[0],reason:L('El respaldo y el mandato habilitan el resto: acuerda estas condiciones antes de comprometer pilotos o inversiones.','Support and mandate enable the rest: agree these conditions before committing to pilots or investments.')};if(g[0]&&[5,6].includes(g[0].i)&&state.scores[2]<=2)return {row:r[2],reason:L('Acuerda equipo y recursos antes de probar o ampliar soluciones.','Agree team capacity and resources before testing or expanding solutions.')};return {row:g[0]||u[0]||r[0],reason:L(g.length?'Se propone la brecha con menor nivel declarado; los empates siguen el orden de condiciones. Confirma la prioridad con tu equipo.':u.length?'Confirma la información pendiente antes de concluir sobre el perfil.':'Mantén y comprueba las capacidades declaradas, comenzando por gobernanza.',g.length?'The lowest declared capability is suggested; ties follow the condition order. Confirm the priority with your team.':u.length?'Verify missing information before drawing conclusions about the profile.':'Maintain and verify declared capabilities, starting with governance.')};}
function radar(){const names=language==='es'?['Gobernanza','Desafíos','Equipo','Método','Colaboración','Pilotos','Adopción','Evaluación','Comunicación']:['Governance','Challenges','Team','Methods','Collaboration','Pilots','Adoption','Evaluation','Communication'];const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/9;return [270+Math.cos(a)*150*v/5,245+Math.sin(a)*150*v/5];};let s='<svg class="gh-radar-svg" viewBox="0 0 540 500" role="img" aria-label="'+L('Perfil de capacidades declaradas. Valores exactos en la tabla.','Declared capability profile. Exact values in the table.')+'">';for(let k=1;k<=5;k++)s+='<polygon points="'+names.map((_,i)=>pt(i,k).join(',')).join(' ')+'" fill="none" stroke="#cbd6cf"/><text x="278" y="'+(245-150*k/5+4)+'" fill="#536564" font-size="11">'+k+'</text>';names.forEach((n,i)=>{const [x,y]=pt(i,5),[lx,ly]=pt(i,6.35);s+='<line x1="270" y1="245" x2="'+x+'" y2="'+y+'" stroke="#cbd6cf"/><text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#142e32">'+n+(!Number.isInteger(state.scores[i])?' *':'')+'</text>';});if(names.every((_,i)=>Number.isInteger(state.scores[i])))s+='<polygon points="'+names.map((_,i)=>pt(i,state.scores[i]).join(',')).join(' ')+'" fill="#16786d" fill-opacity=".15" stroke="#16786d" stroke-width="3"/>';else names.forEach((_,i)=>{const j=(i+1)%9;if(Number.isInteger(state.scores[i])&&Number.isInteger(state.scores[j])){const a=pt(i,state.scores[i]),b=pt(j,state.scores[j]);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#16786d" stroke-width="3"/>';}});names.forEach((_,i)=>{if(Number.isInteger(state.scores[i])){const [x,y]=pt(i,state.scores[i]);s+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="#16786d"/>';}});return s+'</svg>';}
function paper(title,body){return '<!doctype html><html lang="'+language+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(title)+'</title><style>body{font:16px/1.6 Arial;color:#142e32;max-width:900px;margin:30px auto;padding:20px}h1{font-size:29px}h2{font-size:23px}h3{font-size:18px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #89958e;padding:10px;text-align:left;vertical-align:top}td[contenteditable]{height:90px}.example{padding:16px;background:#edf2e8}.gh-radar-svg{width:100%;max-width:450px}button{padding:10px;font:inherit}@media print{button,.screen-note{display:none}.action{break-before:page}tr{break-inside:avoid}body{margin:0;padding:0}*{print-color-adjust:exact}}</style></head><body><small>'+L('Gobierno Habilitador','Enabling Government')+' · Patricio Ovalle Wood · ES Digital</small><h1>'+esc(title)+'</h1><p class="screen-note">'+L('Edita los campos y usa Imprimir para guardar como PDF. Conserva una copia; los cambios no actualizan el sitio.','Edit the fields and use Print to save as PDF. Keep a copy; changes do not update the website.')+'</p><button onclick="window.print()">'+L('Imprimir / guardar PDF','Print / save PDF')+'</button>'+body+'</body></html>';}
function download(content,name,type='text/html;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function openPaper(content){const w=window.open('','_blank');if(w){w.document.open();w.document.write(content);w.document.close();}else{root.querySelector('#gh-save-note').textContent=L('El navegador bloqueó la vista. Usa Descargar o permite abrir la vista imprimible.','The browser blocked the view. Download a copy or allow the printable view to open.');}}
const tool=id=>db().tools.find(t=>t.id===id);
function toolPaper(id){const t=tool(id);return paper(t.name,'<p>'+esc(t.purpose)+'</p><p><b>'+L('Tiempo orientativo','Suggested time')+':</b> '+esc(t.duration)+'<br><b>'+L('Participantes','Participants')+':</b> '+esc(t.people)+'</p><h2>'+L('Cómo utilizarla','How to use it')+'</h2><ol>'+t.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><div class="example"><b>'+L('Ejemplo ilustrativo','Illustrative example')+'</b><p>'+esc(t.example)+'</p></div><h2>'+L('Ficha de trabajo','Worksheet')+'</h2><p contenteditable="true">'+L('Organización: [completar] · Fecha: [completar]','Organisation: [complete] · Date: [complete]')+'</p><table>'+t.fields.map(f=>'<tr><th>'+esc(f)+'</th><td contenteditable="true">'+L('[Completar]','[Complete]')+'</td></tr>').join('')+'</table><h2>'+L('Siguiente paso','Next step')+'</h2><p>'+esc(t.next)+'</p><small>'+L('Ficha original de la guía. Referencias metodológicas: NYC Civic Service Design Tools + Tactics y GOV.UK Service Manual.','Original worksheet. Method references: NYC Civic Service Design Tools + Tactics and GOV.UK Service Manual.')+'</small>');}
function toolCard(id){const t=tool(id);return '<details class="gh-tool-card"><summary>'+esc(t.name)+'</summary><p>'+esc(t.purpose)+'</p><p>'+esc(t.method)+' · '+esc(t.duration)+'</p><h4>'+L('Participantes','Participants')+'</h4><p>'+esc(t.people)+'</p><h4>'+L('Cómo utilizarla','How to use it')+'</h4><ol>'+t.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><h4>'+L('Ejemplo ilustrativo','Illustrative example')+'</h4><p>'+esc(t.example)+'</p><h4>'+L('Después','Next')+'</h4><p>'+esc(t.next)+'</p><div class="gh-output-tools"><button class="gh-btn" data-pdf="'+id+'">PDF A4 ↓</button><button class="gh-btn gh-secondary" data-edit="'+id+'">'+L('Ficha editable ↓','Editable worksheet ↓')+'</button></div></details>';}
function caseCard(id){const c=db().cases[id];return '<details class="gh-case-card"><summary>'+L('Referencia internacional','International reference')+' · '+esc(c.name)+'</summary><p>'+esc(c.place)+'</p><h4>'+L('Práctica documentada','Documented practice')+'</h4><p>'+esc(c.fact)+'</p><p>'+esc(c.learn)+'</p><h4>'+L('Límite de la referencia','Limit of the reference')+'</h4><p>'+esc(c.limit)+'</p><a target="_blank" rel="noopener" href="'+esc(c.url)+'">'+L('Leer fuente primaria ↗','Read primary source ↗')+'</a></details>';}
function actions(i){return A()[i].map(a=>{if(status(i)==='unknown')return {...a,title:L('Verificar: ','Verify: ')+a.title,how:L('Antes de hacer cambios, revisa con las áreas responsables si esta práctica existe y solicita evidencia de su aplicación. Registra lo disponible y lo pendiente; no interpretes falta de información como desempeño negativo. Si confirmas una brecha: ','Before making changes, ask accountable departments whether this practice exists and request evidence of its use. Record what is available and missing; missing information is not poor performance. If a gap is confirmed: ')+a.how,gate:L('La evidencia permite actualizar el diagnóstico y decidir si hace falta intervenir.','Evidence supports updating the assessment and deciding whether intervention is needed.')};if(status(i)==='ready')return {...a,title:L('Revisar y sostener: ','Review and sustain: ')+a.title,how:L('Aprovecha lo que ya funciona; revisa un proyecto real y ajusta solo lo necesario. ','Build on what works; review a real project and adjust only what is needed. ')+a.how};if(status(i)==='partial')return {...a,how:L('Identifica primero el componente incompleto y conserva lo que ya está acordado. ','First identify the incomplete component and retain what has already been agreed. ')+a.how};return a;});}
function actionCard(i,a,j){const task=state.tasks?.[i]?.[j]||{};return '<section class="gh-action-wrap"><details class="gh-action-card"><summary>0'+(j+1)+' · '+esc(a.dimension)+' · '+esc(a.title)+'</summary><h4>'+L('Qué hacer y cómo hacerlo','What to do and how')+'</h4><p>'+esc(a.how)+'</p><h4>'+L('Ejemplo ilustrativo','Illustrative example')+'</h4><p class="gh-example">'+esc(a.example)+'</p><h4>'+L('A quién involucrar','Who to involve')+'</h4><p>'+esc(a.owner)+'</p><h4>'+L('Qué debes obtener','Expected deliverable')+'</h4><p>'+esc(a.output)+'</p><h4>'+L('Criterio para avanzar','Criterion for moving forward')+'</h4><p>'+esc(a.gate)+'</p><div class="gh-task-fields">'+[['owner',L('Responsable acordado','Agreed owner')],['date',L('Fecha objetivo','Target date')],['evidence',L('Avance o evidencia','Progress or evidence')]].map(([k,label])=>'<label>'+label+'<input data-task="'+i+':'+j+':'+k+'" type="'+(k==='date'?'date':'text')+'" maxlength="300" value="'+esc(task[k]||'')+'"></label>').join('')+'</div>'+toolCard(a.tool)+'</details><p class="gh-action-intro">'+esc(a.how.split('. ')[0])+'.</p></section>';}
function planCard(i){return '<section class="gh-priority"><div class="gh-eyebrow">'+L('Tu plan de acción recomendado','Your recommended action plan')+'</div><h3>'+esc(db().pillars[i].name)+'</h3><p>'+esc(db().pillars[i].why)+'</p><p>'+L('Cuatro acciones complementarias. Abre cada una para encontrar instrucciones, ejemplo, herramienta y criterio de avance.','Four complementary actions. Open each for instructions, an example, a tool and an advancement criterion.')+'</p>'+actions(i).map((a,j)=>actionCard(i,a,j)).join('')+caseCard(db().pillars[i].case)+'</section>';}
function designPaper(){const sel=selection(),i=sel.row.i,c=db().cases[sel.row.p.case];return paper(L('Mi perfil y plan de acción','My profile and action plan'),'<p>'+esc(state.project)+'</p>'+radar()+'<ul>'+rows().map(r=>'<li>'+esc(r.p.name)+': '+(Number.isInteger(state.scores[r.i])?state.scores[r.i]+'/5':L('Sin información','Unknown'))+'</li>').join('')+'</ul><h2>'+esc(sel.row.p.name)+'</h2><p>'+esc(sel.reason)+'</p>'+actions(i).map((a,j)=>{const t=state.tasks?.[i]?.[j]||{};return '<section class="action"><h2>'+(j+1)+'. '+esc(a.title)+'</h2><p>'+esc(a.dimension)+'</p><h3>'+L('Cómo hacerlo','How to do it')+'</h3><p>'+esc(a.how)+'</p><div class="example"><b>'+L('Ejemplo ilustrativo','Illustrative example')+'</b><p>'+esc(a.example)+'</p></div><p><b>'+L('Responsable sugerido','Suggested owner')+':</b> '+esc(a.owner)+'</p><p><b>'+L('Entregable','Deliverable')+':</b> '+esc(a.output)+'</p><p><b>'+L('Criterio para avanzar','Advancement criterion')+':</b> '+esc(a.gate)+'</p><p>'+L('Herramienta','Tool')+': '+esc(tool(a.tool).name)+'</p><table>'+[['owner',L('Responsable acordado','Agreed owner')],['date',L('Fecha objetivo','Target date')],['evidence',L('Avance o evidencia','Progress or evidence')]].map(([k,label])=>'<tr><th>'+label+'</th><td contenteditable="true">'+esc(t[k]||L('[Completar]','[Complete]'))+'</td></tr>').join('')+'</table></section>';}).join('')+'<h2>'+L('Referencia internacional','International reference')+'</h2><p><a href="'+esc(c.url)+'">'+esc(c.name)+'</a></p><p>'+esc(c.fact)+'</p><p>'+esc(c.limit)+'</p><small>'+L('Autoevaluación orientativa, no una certificación ni un índice validado. Ejemplos ilustrativos; ajusta decisiones y autorizaciones a tu institución.','Indicative self-assessment, not certification or a validated index. Examples are illustrative; adapt decisions and authorisations to your institution.')+'</small>');}
function design(){let html='<h1>'+L('Diseña o fortalece tu espacio de innovación pública','Design or strengthen your public innovation space')+'</h1><p class="gh-lead">'+L('Institucionalidad, gobernanza y capacidad de implementación. Nueve condiciones, un perfil visual y un plan para actuar.','Institutional foundations, governance and implementation capacity. Nine conditions, a visual profile and an action plan.')+'</p><label>'+L('Institución o proyecto — opcional','Institution or project — optional')+'<input id="gh-project-new" value="'+esc(state.project)+'" maxlength="160"></label>';
if(showResult){const sel=selection();html+='<section id="gh-diagnostic-result"><h2>'+L('Tu perfil de innovación pública','Your public innovation profile')+'</h2><div class="gh-radar-layout"><div>'+radar()+'<p class="gh-note">'+L('* Sin evaluar: el tramo queda abierto para no inventar una puntuación.','* Not assessed: the segment remains open rather than inventing a score.')+'</p></div><table class="gh-radar-table"><caption>'+L('Capacidades declaradas · escala 1–5','Declared capabilities · scale 1–5')+'</caption>'+rows().map(r=>'<tr><td>'+esc(r.p.name)+'</td><td>'+(Number.isInteger(state.scores[r.i])?state.scores[r.i]+'/5':L('Sin información','Unknown'))+'</td></tr>').join('')+'</table></div><p class="gh-dependency">'+esc(sel.reason)+'</p>'+planCard(sel.row.i)+'<details class="gh-other"><summary>'+L('Ver las demás condiciones','Review other conditions')+'</summary>'+rows().filter(r=>r.i!==sel.row.i).map(r=>planCard(r.i)).join('')+'</details><div class="gh-output-tools"><button class="gh-btn" id="gh-view-plan">'+L('Ver plan imprimible ↗','View printable plan ↗')+'</button><button class="gh-btn gh-secondary" id="gh-download-plan">'+L('Descargar plan editable ↓','Download editable plan ↓')+'</button><button class="gh-btn gh-secondary" id="gh-review">'+L('Revisar respuestas','Review answers')+'</button></div><p class="gh-note">'+L('Reglas: verificar gobernanza desconocida o débil; asegurar recursos si bloquean pilotos o adopción; después, menor nivel declarado. Empates según el orden de condiciones. No mide impacto.','Rules: verify unknown or weak governance; secure resources if they block testing or adoption; otherwise select the lowest declared level. Ties follow condition order. This does not measure impact.')+'</p></section>';}else{html+='<div class="gh-mini-nav">'+db().pillars.map((p,i)=>'<button data-step="'+i+'" aria-current="'+(step===i)+'" aria-label="'+esc(p.name)+'">'+(i+1)+'</button>').join('')+'</div><section class="gh-question-screen"><div class="gh-eyebrow">'+L('Condición','Condition')+' '+(step+1)+' / 9</div><h2>'+esc(db().pillars[step].name)+'</h2><p>'+L('Elige el nivel que mejor describe lo que puedes comprobar.','Choose the level that best describes what you can verify.')+'</p>'+[...DATA.anchors[language][step],L('No tengo información suficiente.','I do not have enough information.')].map((txt,j)=>'<label class="gh-level"><input type="radio" name="gh-capability" value="'+(j===5?'unknown':j+1)+'" '+(state.scores[step]===(j===5?'unknown':j+1)?'checked':'')+'><span><strong>'+ (j===5?L('Sin información','Unknown'):L('Nivel ','Level ')+(j+1))+'</strong>'+esc(txt)+'</span></label>').join('')+'<div class="gh-output-tools"><button class="gh-btn gh-secondary" id="gh-prev" '+(step===0?'disabled':'')+'>'+L('← Anterior','← Previous')+'</button><button class="gh-btn" id="gh-next">'+(step===8?L('Ver mi diagnóstico ↗','View my assessment ↗'):L('Siguiente →','Next →'))+'</button></div><p id="gh-question-note" role="status"></p></section>';}
return html;}
function landing(){return '<div class="gh-eyebrow">'+L('Herramientas para la acción pública','Tools for public action')+'</div><h1>'+L('Gobierno Habilitador','Enabling Government')+'</h1><p class="gh-lead">'+L('Fortalece capacidades institucionales y toma mejores decisiones públicas. Elige lo que necesitas resolver.','Strengthen institutional capabilities and make better public decisions. Choose what you need to address.')+'</p><div class="gh-launch-grid"><a class="gh-launch-card" href="#gh-design"><span>01</span><h2>'+L('Diseña o fortalece tu espacio de innovación pública','Design or strengthen your public innovation space')+'</h2><p>'+L('Evalúa institucionalidad, gobernanza y operación de hubs, laboratorios y espacios GovTech. Recibe un radar y un plan de acción.','Assess institutional foundations, governance and operations for hubs, labs and GovTech spaces. Receive a radar profile and an action plan.')+'</p><strong>'+L('Evaluar mi institución →','Assess my institution →')+'</strong></a><a class="gh-launch-card" href="#gh-prioritize"><span>02</span><h2>'+L('Prioriza mejoras en tus servicios públicos','Prioritise improvements to public services')+'</h2><p>'+L('Compara necesidad ciudadana, capacidad técnica, respaldo político y condiciones normativas. Distingue uso, evaluación y visibilidad.','Compare citizen needs, technical capacity, political support and regulatory conditions. Keep usage, assessment and visibility distinct.')+'</p><strong>'+L('Comparar mis servicios →','Compare my services →')+'</strong></a></div><p class="gh-note">'+L('Método y herramientas de Patricio Ovalle Wood. Orientaciones para adaptar con tu equipo, no decisiones automáticas.','Methods and tools by Patricio Ovalle Wood. Guidance to adapt with your team, not automated decisions.')+'</p>';}
function blankService(){return {name:'',archetype:'',actors:'',source:'',need:'unknown',harm:'unknown',technical:'unknown',political:'unknown',norm:'unknown',normSource:'',deadline:'',usage:'unknown',evaluation:'unknown',visibility:'unknown'};}
const opts={need:()=>[['unknown',L('Sin información','Unknown')],['1',L('Necesidad baja','Low need')],['2',L('Necesidad acotada','Limited need')],['3',L('Necesidad relevante','Relevant need')],['4',L('Necesidad alta','High need')],['5',L('Necesidad esencial o urgente','Essential or urgent need')]],harm:()=>[['unknown',L('Por verificar','To verify')],['critical',L('Daño grave o pérdida de acceso esencial','Serious harm or loss of essential access')],['moderate',L('Dificultades relevantes','Significant difficulties')],['low',L('Consecuencias limitadas','Limited consequences')]],technical:()=>[['unknown',L('Por verificar','To verify')],['high',L('Capacidades y recursos disponibles','Capabilities and resources available')],['medium',L('Parcialmente disponibles','Partly available')],['low',L('Faltan capacidades o recursos','Capabilities or resources missing')]],political:()=>[['unknown',L('Por verificar','To verify')],['yes',L('Respaldo y responsable definidos','Support and owner defined')],['partial',L('Interés sin compromisos completos','Interest without full commitments')],['no',L('Sin respaldo acordado','No agreed support')]],norm:()=>[['unknown',L('Por revisar con el área competente','Review with the competent department')],['required',L('Obligación vigente y aplicable','Current applicable obligation')],['upcoming',L('Cambio próximo que requiere preparación','Upcoming change requiring preparation')],['restricted',L('Restricción o interpretación pendiente','Restriction or interpretation outstanding')],['allowed',L('Actuación permitida en las atribuciones','Action permitted within institutional powers')]],usage:()=>[['unknown',L('Sin información','Unknown')],['high',L('Uso alto','High usage')],['medium',L('Uso medio','Medium usage')],['low',L('Uso bajo','Low usage')]],evaluation:()=>[['unknown',L('Sin información','Unknown')],['poor',L('Mal evaluado','Poorly assessed')],['mixed',L('Evaluación mixta','Mixed assessment')],['good',L('Bien evaluado','Well assessed')]],visibility:()=>[['unknown',L('Sin información','Unknown')],['high',L('Alta exposición pública','High public exposure')],['medium',L('Exposición moderada','Moderate exposure')],['low',L('Poca exposición pública','Low public exposure')]]};
function selectField(i,key,label){return '<label>'+label+'<select data-service="'+i+':'+key+'">'+opts[key]().map(([v,t])=>'<option value="'+v+'" '+(services[i][key]===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label>';}
function inputField(i,key,label,type='text'){return '<label>'+label+'<input type="'+type+'" maxlength="400" data-service="'+i+':'+key+'" value="'+esc(services[i][key]||'')+'"></label>';}
let comparison=false;
function priority(s){if(s.norm==='required')return {level:0,title:L('Atender obligación y confirmar condiciones','Address obligation and confirm conditions'),reason:L('Declaras una obligación vigente. Confirma aplicabilidad, autoridad, plazo y respuesta necesaria con el área competente; no depende de su visibilidad.','You report a current obligation. Confirm applicability, authority, deadline and required response with the competent department; visibility does not determine compliance.')};if(s.harm==='critical')return {level:1,title:L('Atender riesgo o acceso esencial','Address risk or essential access'),reason:L('La gravedad declarada requiere revisar medidas de protección y atención, aunque el servicio sea poco usado o visible.','Declared severity calls for reviewing protection and access measures, even with low usage or visibility.')};if(s.norm==='upcoming')return {level:2,title:L('Preparar la transición normativa','Prepare the regulatory transition'),reason:L('Verifica fecha, competencias y medidas antes de la entrada en vigor.','Verify timing, powers and implementation measures before the change takes effect.')};if(Number(s.need)>=4||s.evaluation==='poor')return {level:3,title:L('Investigar y priorizar una mejora','Investigate and prioritise an improvement'),reason:L('La necesidad o evaluación declarada justifica investigar causas y alternativas; confirma la evidencia antes de comprometer una solución.','Declared need or assessment warrants investigating causes and alternatives; confirm evidence before committing to a solution.')};if(s.need==='unknown'&&s.evaluation==='unknown')return {level:5,title:L('Reunir información para decidir','Gather information to decide'),reason:L('Falta información para sostener una prioridad; silencio o pocas quejas no prueban satisfacción.','Information is insufficient to justify a priority; silence or few complaints does not establish satisfaction.')};return {level:4,title:L('Explorar oportunidades y revisar','Explore opportunities and review'),reason:L('No se identifican por estas respuestas una obligación o gravedad alta. Revisa necesidades y barreras antes de ampliar o descartar mejoras.','These responses do not identify an obligation or high severity. Review needs and barriers before expanding or dismissing improvements.')};}
function serviceActions(s){const name=s.name||L('este servicio','this service');return [
{dimension:L('Política e institucional','Political and institutional'),title:L('Acordar la decisión y la vía normativa','Agree the decision and regulatory route'),how:L('Reúne a la jefatura de '+name+' y a las áreas jurídica y presupuestaria pertinentes. Confirma la obligación o restricción declarada, su fuente, autoridad competente y plazo. Acuerda qué puede decidirse hoy y qué requiere autorización; el cumplimiento puede necesitar información, operación o fiscalización, sin implicar necesariamente una innovación.','Meet the '+name+' lead and relevant legal and budget teams. Confirm the reported obligation or restriction, its source, competent authority and deadline. Agree what can be decided now and what needs authorisation; compliance may require information, operations or enforcement rather than innovation.'),example:L('Ante un cambio de reglas de un servicio, el equipo verifica a quién se aplica, quién informa y qué ajuste operativo debe autorizarse antes de anunciarlo.','When service rules change, the team checks who is affected, who communicates and which operational changes must be authorised before announcing them.'),output:L('Acuerdo de decisión, responsables, revisión normativa y pendientes.','Decision agreement, accountable owners, regulatory review and outstanding issues.'),tool:'raci'},
{dimension:L('Evidencia','Evidence'),title:L('Contrastar necesidad, uso y evaluación','Cross-check need, usage and assessment'),how:L('Revisa registros del servicio y escucha a los arquetipos identificados, incluyendo personas con barreras de acceso. Define periodo y fuente de uso, quién evaluó y con qué método. Distingue quejas públicas de experiencias de usuarios; incorpora a quienes no participan en redes y revisa gravedad y equidad.','Review service records and listen to the identified user profiles, including people facing access barriers. Define the period and source for usage, who assessed the service and how. Separate public complaints from user experience; include people who do not use social media and review severity and equity.'),example:L('Un servicio muy usado, mal evaluado y poco visible se investiga con registros, entrevistas y atención presencial, en vez de esperar denuncias en redes.','A heavily used, poorly assessed but low-visibility service is investigated through records, interviews and in-person contact rather than waiting for social-media complaints.'),output:L('Ficha con fuentes, perfiles, causas posibles y vacíos de información.','Evidence brief with sources, profiles, possible causes and information gaps.'),tool:'entrevistas'},
{dimension:L('Técnica','Technical'),title:L('Diseñar una respuesta viable y proporcional','Design a feasible and proportionate response'),how:L('Mapea el recorrido y las causas confirmadas. Compara opciones de información, procesos, acceso, operación o tecnología, según el problema. Si faltan recursos, acota el alcance y acuerda capacidades compartidas. Define responsable, entregable e indicadores; una prueba solo procede si sus condiciones están habilitadas.','Map the journey and confirmed causes. Compare information, process, access, operational or technology options according to the problem. If resources are missing, narrow the scope and agree shared capabilities. Define an owner, deliverable and indicators; testing requires enabled conditions.'),example:L('Si el problema son requisitos confusos, se compara orientación y simplificación del proceso antes de contratar una plataforma.','If the problem is confusing requirements, compare guidance and process simplification before commissioning a platform.'),output:L('Alternativa justificada, recursos requeridos y criterios de prueba o implementación.','Justified option, required resources and testing or implementation criteria.'),tool:'desafio'},
{dimension:L('Comunicación','Communication'),title:L('Adaptar mensajes a públicos y visibilidad','Adapt messages to audiences and visibility'),how:s.visibility==='low'?L('Busca activamente a usuarios poco representados mediante atención, teléfono y organizaciones pertinentes. Explica cómo participar y devuelve los hallazgos. No interpretes poca exposición como poca necesidad. Coordina información interna y pública con evidencia disponible.','Actively reach underrepresented users through frontline channels, telephone and relevant organisations. Explain participation and return findings. Low exposure does not mean low need. Coordinate internal and public information using available evidence.'):L('Distingue usuarios del servicio y actores organizados; observa su incidencia sin asumir comportamientos por pertenecer a un grupo. Define vocería, mensajes, canales de respuesta y evidencia. Ante alta exposición, informa acciones y límites con claridad sin permitir que el volumen de publicaciones sustituya la necesidad ciudadana.','Distinguish service users from organised actors; observe their influence without assuming behaviour from group membership. Define spokespersons, messages, response channels and evidence. With high exposure, explain actions and limits without treating post volume as a substitute for citizen need.'),example:L('Un servicio visible recibe mensajes claros y un canal de respuesta. En uno poco visible, la institución convoca y escucha a quienes no hacen públicas sus dificultades.','A visible service receives clear messages and a response channel. For a low-visibility service, the institution actively reaches people who do not publicise their difficulties.'),output:L('Plan de públicos, mensajes, canales, responsables y devolución.','Audience, message, channel, owner and feedback plan.'),tool:'comunicacion'}];}
function serviceResult(s,i){const p=priority(s);return '<section class="gh-priority"><div class="gh-eyebrow">'+esc(p.title)+'</div><h2>'+esc(s.name||L('Servicio ','Service ')+(i+1))+'</h2><p>'+esc(p.reason)+'</p><p>'+L('Perfil: ','Profile: ')+['usage','evaluation','visibility'].map(k=>esc(opts[k]().find(x=>x[0]===s[k])?.[1])).join(' · ')+'</p>'+(s.norm==='required'&&!s.normSource?'<p class="gh-dependency">'+L('Falta registrar la fuente normativa: confirma esta obligación antes de darla por establecida.','Regulatory source missing: confirm the obligation before treating it as established.')+'</p>':'')+'<details><summary>'+L('Ver ruta de acción','View action route')+'</summary>'+serviceActions(s).map((a,j)=>'<details class="gh-action-card"><summary>0'+(j+1)+' · '+esc(a.dimension)+' · '+esc(a.title)+'</summary><p>'+esc(a.how)+'</p><h4>'+L('Ejemplo ilustrativo','Illustrative example')+'</h4><p class="gh-example">'+esc(a.example)+'</p><h4>'+L('Entregable','Deliverable')+'</h4><p>'+esc(a.output)+'</p>'+toolCard(a.tool)+'</details>').join('')+'</details></section>';}
function comparisonPaper(){return paper(L('Comparación y plan de servicios públicos','Public service comparison and action plan'),'<p>'+L('Reglas orientativas: obligaciones declaradas, gravedad, cambios próximos, necesidad y evaluación. Uso y visibilidad caracterizan el servicio, no se suman como una nota. Confirma decisiones con las áreas competentes.','Indicative rules: reported obligations, severity, upcoming changes, need and assessment. Usage and visibility describe the service rather than adding to a score. Confirm decisions with competent departments.')+'</p>'+services.map((s,i)=>'<section><h2>'+esc(s.name||L('Servicio ','Service ')+(i+1))+'</h2><p>'+esc(priority(s).reason)+'</p><p>'+L('Arquetipo','User profile')+': '+esc(s.archetype)+'<br>'+L('Actores organizados','Organised actors')+': '+esc(s.actors)+'<br>'+L('Fuente / periodo','Source / period')+': '+esc(s.source)+'<br>'+L('Fuente normativa / plazo','Regulatory source / deadline')+': '+esc(s.normSource)+' / '+esc(s.deadline)+'</p><ul>'+Object.keys(opts).map(k=>'<li>'+esc(fieldLabel(k))+': '+esc(opts[k]().find(x=>x[0]===s[k])?.[1])+'</li>').join('')+'</ul>'+serviceActions(s).map(a=>'<div class="action"><h3>'+esc(a.dimension)+' · '+esc(a.title)+'</h3><p>'+esc(a.how)+'</p><div class="example"><b>'+L('Ejemplo ilustrativo','Illustrative example')+'</b><p>'+esc(a.example)+'</p></div><p>'+L('Entregable','Deliverable')+': '+esc(a.output)+'</p><p>'+L('Herramienta','Tool')+': '+esc(tool(a.tool).name)+'</p><p contenteditable="true">'+L('Responsable: [completar] · Fecha: [acordar] · Evidencia: [completar]','Owner: [complete] · Date: [agree] · Evidence: [complete]')+'</p></div>').join('')+'</section>').join(''));}
function fieldLabel(k){return ({need:L('Ciudadana: importancia de la necesidad','Citizen perspective: importance of the need'),harm:L('Ciudadana: gravedad y acceso','Citizen perspective: severity and access'),technical:L('Técnica: capacidad para actuar','Technical: delivery capacity'),political:L('Política: respaldo y responsable','Political: support and ownership'),norm:L('Normativa/regulatoria: situación','Legal/regulatory: status'),usage:L('Nivel de uso','Usage level'),evaluation:L('Evaluación del servicio','Service assessment'),visibility:L('Visibilidad del problema','Problem visibility')})[k];}

function chooseExperiment(p){let id,reason;const extras=[];
if(p.ready!=='yes'){id='mandato';reason=L('Primero confirma quién puede autorizar la prueba y qué condiciones faltan. Puedes preparar prototipos o simulaciones, pero no tratar esta recomendación como autorización para intervenir el servicio.','First confirm who can authorise testing and what conditions are missing. You can prepare prototypes or simulations, but this recommendation does not authorise a service intervention.');extras.push('simulacion','supuestos');}
else if(p.goal==='need'){id=p.time==='workshop'?'supuestos':'entrevistas';reason=L('La incertidumbre está en comprender la necesidad. Empieza por explicitar supuestos o escuchar experiencias concretas antes de seleccionar una solución.','The uncertainty concerns understanding needs. Start by making assumptions explicit or hearing concrete experiences before selecting a solution.');extras.push('recorrido','desafio');}
else if(p.evidence==='none'){id='supuestos';reason=L('El supuesto aún depende de opiniones. Delimita qué debe ser cierto y qué evidencia te haría cambiar la decisión antes de elegir una prueba más costosa.','The assumption still relies on opinions. Define what must hold true and what evidence would change the decision before choosing a more costly test.');extras.push('entrevistas','indicadores');}
else if(p.goal==='usability'){id=p.stage==='idea'?'alternativas':'usabilidad';reason=L(p.stage==='idea'?'Primero representa una alternativa como prototipo; luego podrás observar tareas reales sin construir toda la solución.':'Ya existe una solución representable. Observa tareas, bloqueos y ayuda requerida con perfiles relevantes.',p.stage==='idea'?'First represent an alternative as a prototype; you can then observe realistic tasks without building the whole solution.':'A representable solution exists. Observe tasks, obstacles and required assistance with relevant user profiles.');extras.push(p.stage==='idea'?'usabilidad':'recorrido','piloto');}
else if(p.goal==='technical'){id=p.time==='workshop'?'supuestos':'factibilidad';reason=L(p.time==='workshop'?'Una sesión permite definir el protocolo y umbrales; no basta para dar por validada una integración técnica.':'La pregunta es técnica. Una prueba acotada en entorno separado permite medir la incertidumbre antes de comprometer el servicio.',p.time==='workshop'?'One session allows you to define a protocol and thresholds, not validate a technical integration.':'The question is technical. A bounded test in a separate environment measures uncertainty before committing the service.');extras.push('capacidades','piloto');}
else if(p.goal==='operation'){id='simulacion';reason=L('La incertidumbre se concentra en coordinación y operación. Ensaya casos normales y excepcionales para descubrir bloqueos antes de aumentar exposición.','Uncertainty concerns coordination and operations. Rehearse normal and exceptional cases to find blockers before increasing exposure.');extras.push('raci','capacidades');}
else if(p.goal==='impact'){id=['live','completed'].includes(p.stage)&&p.time==='weeks'?'comparacion':'indicadores';reason=L(id==='comparacion'?'Quieres examinar resultados en una intervención existente. Diseña con especialistas una comparación adecuada y registra sus límites.':'Primero define resultado, línea de base y fuentes. La etapa o el plazo declarado no permiten asumir que ya puedes estimar un efecto causal.',id==='comparacion'?'You want to examine outcomes for an existing intervention. Design a suitable comparison with specialists and record its limitations.':'First define outcomes, baseline and sources. The declared stage or timeframe does not justify assuming you can already estimate a causal effect.');extras.push('cambio','evaluacion');}
else{id=p.stage==='completed'?'evaluacion':'adopcion';reason=L(p.stage==='completed'?'Revisa resultados, aprendizaje y continuidad antes de proponer expansión. Un piloto satisfactorio no asegura sostenibilidad.':'Define quién operará la solución, con qué recursos y bajo qué condiciones. Actualiza el plan con evidencia del piloto.',p.stage==='completed'?'Review results, learning and continuity before proposing expansion. A satisfactory pilot does not ensure sustainability.':'Define who will operate the solution, with which resources and under what conditions. Update the plan with pilot evidence.');extras.push('capacidades','portafolio');}
return {id,reason,extras:[...new Set(extras)].filter(x=>x!==id).slice(0,2)};}
function pickerSummary(){const r=chooseExperiment(picks),t=tool(r.id);return '<section class="gh-recommendation"><div class="gh-eyebrow">'+L('Tu siguiente paso recomendado','Your recommended next step')+'</div><h2>'+esc(t.name)+'</h2><p class="gh-lead">'+esc(r.reason)+'</p><p>'+esc(t.purpose)+'</p>'+toolLink(t.id,L('Abrir y completar herramienta','Open and complete tool'))+'</section><h3>'+L('Para complementar','To complement it')+'</h3><div class="gh-output-tools">'+r.extras.map(id=>toolLink(id)).join('')+'</div><details class="gh-optional"><summary>'+L('Por qué llegamos a esta recomendación','Why this recommendation was made')+'</summary><ul>'+pickerQuestions().map(q=>'<li><b>'+q.title+'</b>: '+esc(q.options.find(o=>o[0]===picks[q.key])?.[1]||'')+'</li>').join('')+'</ul><p>'+L('Reglas orientativas: primero habilitación institucional; después claridad del supuesto; luego objetivo, etapa y tiempo. No es una certificación ni sustituye el juicio del equipo.','Indicative rules: institutional readiness first; then assumption clarity; then objective, stage and time. This is not certification or a substitute for team judgement.')+'</p></details><div class="gh-output-tools"><button class="gh-btn gh-secondary" id="gh-picker-edit">'+L('Revisar respuestas','Review answers')+'</button><button class="gh-btn" id="gh-picker-export">'+L('Descargar recomendación','Download recommendation')+' ↓</button></div>';}
function experimentPicker(){if(pickerDone)return '<a href="#gh-pilots">← '+L('Pilotos','Pilots')+'</a><h1>'+L('Una prueba que responde a tu reto','A test that fits your challenge')+'</h1>'+pickerSummary();const q=pickerQuestions()[pickerStep];return '<a href="#gh-pilots">← '+L('Pilotos','Pilots')+'</a><div class="gh-eyebrow">'+L('Selector de pruebas','Experiment selector')+'</div><h1>'+L('¿Qué conviene probar primero?','What should you test first?')+'</h1><p>'+L('Cinco preguntas para elegir una herramienta y saber cómo empezar.','Five questions to choose a tool and know how to start.')+'</p><section class="gh-question-screen gh-picker-screen"><p class="gh-step-count">'+L('Pregunta','Question')+' '+(pickerStep+1)+' / 5</p><progress value="'+(pickerStep+1)+'" max="5" aria-label="'+L('Avance del selector','Selector progress')+'"></progress><h2>'+q.title+'</h2><p>'+q.hint+'</p><fieldset class="gh-choice-list"><legend class="gh-sr-only">'+q.title+'</legend>'+q.options.map(([v,label])=>'<label><input type="radio" name="gh-picker-choice" value="'+v+'" '+(picks[q.key]===v?'checked':'')+'><span>'+label+'</span></label>').join('')+'</fieldset><div class="gh-output-tools"><button class="gh-btn gh-secondary" id="gh-picker-prev" '+(pickerStep===0?'disabled':'')+'>← '+L('Anterior','Previous')+'</button><button class="gh-btn" id="gh-picker-next">'+(pickerStep===4?L('Ver recomendación','View recommendation'):L('Siguiente','Next'))+' →</button></div><p id="gh-picker-note" role="status"></p></section>';}
function evalCriteria(){return [
{name:L('Pertinencia','Relevance'),question:L('¿El piloto responde a una necesidad pública comprobada?','Does the pilot address an evidenced public need?'),guide:L('Revisa alineación con prioridades, participación de usuarios y valor diferencial frente a las alternativas. Cita datos o hallazgos que justifiquen el problema.','Review alignment with priorities, user participation and value relative to alternatives. Cite data or findings supporting the problem.'),example:L('Ejemplo: registros de visitas repetidas y entrevistas muestran que el problema es comprender requisitos, no la ausencia de una aplicación.','Example: repeat-visit records and interviews show the problem is understanding requirements, not the absence of an app.')},
{name:L('Eficacia','Effectiveness'),question:L('¿Se alcanzaron los objetivos y se aprendió sobre la hipótesis?','Were objectives achieved and the hypothesis examined?'),guide:L('Contrasta metas, resultados, calidad técnica y apropiación local. Explica si la hipótesis se confirmó, se refutó o necesita ajuste; aprender que no funciona también puede ser útil.','Compare targets, results, technical quality and local ownership. Explain whether the hypothesis was supported, refuted or needs revision; learning that something does not work can also be useful.'),example:L('Ejemplo: el formulario reduce errores, pero requiere apoyo presencial. Registra ambos hallazgos y qué decisión cambian.','Example: a form reduces errors but still needs in-person support. Record both findings and which decision they change.')},
{name:L('Eficiencia','Efficiency'),question:L('¿Los resultados y aprendizajes justifican los recursos utilizados?','Do results and learning justify the resources used?'),guide:L('Revisa costes, tiempo del equipo, plazos y barreras administrativas. Compara recursos con resultados; ejecutar el presupuesto no demuestra eficiencia.','Review costs, staff time, schedule and administrative barriers. Compare resources with results; spending the budget does not demonstrate efficiency.'),example:L('Ejemplo: calcula coste por caso resuelto incluyendo horas del equipo y contrástalo con el servicio previo, explicitando diferencias de complejidad.','Example: calculate cost per resolved case including staff time and compare it with the previous service, noting differences in complexity.')},
{name:L('Sostenibilidad','Sustainability'),question:L('¿La institución puede sostener y adoptar lo aprendido?','Can the institution sustain and adopt what was learned?'),guide:L('Comprueba responsable institucional, capacidades transferidas, recursos de operación y condiciones para replicar. Distingue compromisos verbales de acuerdos confirmados.','Check institutional ownership, transferred capabilities, operating resources and replication conditions. Distinguish verbal support from confirmed commitments.'),example:L('Ejemplo: la solución funciona, pero el proveedor retiene el conocimiento y no hay presupuesto de operación. Esa condición debe resolverse antes de ampliar.','Example: the solution works, but the supplier holds the knowledge and there is no operating budget. Resolve this before expansion.')},
{name:L('Señales tempranas de impacto','Early impact signals'),question:L('¿Qué cambios se observan para usuarios y para la institución?','What changes are observed for users and the institution?'),guide:L('Revisa beneficios, datos nuevos, aprendizaje y efectos no previstos. Distingue señales tempranas de efectos causales demostrados; documenta otras explicaciones posibles.','Review benefits, new data, learning and unintended effects. Distinguish early signals from demonstrated causal effects; document alternative explanations.'),example:L('Ejemplo: bajó la espera durante el piloto, pero también cayó la demanda. Informa ambas variaciones antes de atribuir el cambio a la solución.','Example: waiting times fell during the pilot, but demand also decreased. Report both before attributing change to the solution.')}
];}
function evalOptions(){return [['unknown',L('Sin evidencia suficiente para valorar','Insufficient evidence to assess')],['na',L('No aplica en esta etapa — explicar','Not applicable at this stage — explain')],['1',L('1 · No cumple; hay evidencia de fallas importantes','1 · Not met; evidence of major failures')],['2',L('2 · Cumplimiento limitado y brechas relevantes','2 · Limited achievement and significant gaps')],['3',L('3 · Cumplimiento parcial; requiere ajustes','3 · Partial achievement; adjustments needed')],['4',L('4 · Cumple con evidencia suficiente','4 · Met with sufficient evidence')],['5',L('5 · Cumple de forma consistente y documentada','5 · Consistently met and documented')]];}
function pilotDecision(p){const known=p.scores.filter((v,i)=>/^[1-5]$/.test(String(v))&&String(p.evidence[i]||'').trim().length>0).length;let key;
if(p.risk==='yes')key='pause';else if(known<5||p.risk==='unknown'||p.hypothesis==='unknown'||p.hypothesis==='unknown')key='evidence';else if(p.scores.some(v=>Number(v)<=2)||p.hypothesis==='refuted')key='adjust';else if(p.owner!=='yes'||p.resources!=='yes'||Number(p.scores[3])<4)key='conditions';else if(p.scores.every(v=>Number(v)>=4)&&p.hypothesis==='supported'&&p.hypothesis==='supported')key='adopt';else key='continue';
const text={pause:[L('Revisar riesgos antes de continuar','Review risks before continuing'),L('Reportaste efectos adversos relevantes. Activa una revisión con el responsable competente y define medidas de protección antes de continuar la parte afectada.','You reported significant adverse effects. Initiate review with the competent owner and define protective measures before continuing the affected activity.')],evidence:[L('Completar evidencia y verificaciones','Complete evidence and checks'),L('Faltan criterios respaldados o una revisión de riesgos. No hay base suficiente para recomendar ampliación. Justifica los criterios que no aplican y reúne la información necesaria para la decisión de esta etapa.','Some criteria lack support or risks have not been reviewed. There is insufficient basis to recommend expansion. Explain inapplicable criteria and gather the information required for this stage’s decision.')],adjust:[L('Ajustar el diseño y revisar la continuidad','Adjust the design and review continuation'),L('Hay brechas importantes o una hipótesis refutada. Usa el aprendizaje para reformular la intervención o proponer su cierre, antes de comprometer más recursos.','There are significant gaps or a refuted hypothesis. Use the learning to redesign the intervention or propose closure before committing more resources.')],conditions:[L('Resolver condiciones de adopción','Resolve adoption conditions'),L('Aclara responsable, capacidades y recursos de operación. Los resultados del piloto no bastan para sostener el servicio sin esas condiciones.','Clarify ownership, capabilities and operating resources. Pilot results alone cannot sustain the service without these conditions.')],adopt:[L('Preparar una propuesta de adopción','Prepare an adoption proposal'),L('Las valoraciones declaradas y su respaldo permiten preparar una propuesta. La autoridad responsable debe revisar calidad de evidencia, costes, atribuciones y riesgos antes de aprobar una ampliación gradual.','Declared assessments and supporting notes allow preparation of a proposal. The accountable authority must review evidence quality, costs, institutional powers and risks before approving gradual expansion.')],continue:[L('Continuar aprendiendo con ajustes','Continue learning with adjustments'),L('Hay resultados parciales que requieren una nueva comprobación. Acota la siguiente prueba, acuerda un plazo y define qué evidencia permitirá decidir.','Partial results require further checking. Bound the next test, agree a timeframe and define what evidence will support a decision.')]};return {key,known,title:text[key][0],reason:text[key][1]};}
function pilotRadar(){const c=evalCriteria(),pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [250+Math.cos(a)*125*v/5,210+Math.sin(a)*125*v/5];},valid=i=>/^[1-5]$/.test(String(pilot.scores[i]));let svg='<svg viewBox="0 0 500 430" class="gh-radar-svg" role="img" aria-label="'+L('Perfil declarado; valores y respaldo en la tabla','Declared profile; values and support in the table')+'">';for(let k=1;k<=5;k++)svg+='<polygon points="'+c.map((_,i)=>pt(i,k).join(',')).join(' ')+'" fill="none" stroke="#cbd6cf"/>';c.forEach((x,i)=>{const [a,b]=pt(i,6.15);svg+='<text x="'+a+'" y="'+b+'" text-anchor="middle" font-size="12" fill="#183c38">'+(i===4?L('Impacto temprano','Early impact'):x.name)+(valid(i)?'':' *')+'</text>';});if(c.every((_,i)=>valid(i)))svg+='<polygon points="'+c.map((_,i)=>pt(i,Number(pilot.scores[i])).join(',')).join(' ')+'" fill="#23786d" fill-opacity=".14" stroke="#23786d" stroke-width="3"/>';else c.forEach((_,i)=>{let j=(i+1)%5;if(valid(i)&&valid(j)){const a=pt(i,Number(pilot.scores[i])),b=pt(j,Number(pilot.scores[j]));svg+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#23786d" stroke-width="3"/>';}});c.forEach((_,i)=>{if(valid(i)){const [a,b]=pt(i,Number(pilot.scores[i]));svg+='<circle cx="'+a+'" cy="'+b+'" r="5" fill="#23786d"/>';}});return svg+'</svg>';}
function pilotActions(){const d=pilotDecision(pilot);return [
[L('Política e institucional','Political and institutional'),L('Convoca al responsable del servicio, patrocinador y áreas que autorizan. Presenta la recomendación y acuerda quién decide, qué falta y cuándo se revisará. Por ejemplo, deja en acta que la ampliación depende de un responsable de operación y presupuesto confirmado. Entregable: acta con decisión, condiciones y fecha.','Convene the service owner, sponsor and authorising departments. Present the recommendation and agree who decides, what is missing and when it will be reviewed. For example, record that expansion depends on an operating owner and confirmed budget. Deliverable: a decision record with conditions and date.'),'mandato'],
[L('Evidencia','Evidence'),L('Reúne las fuentes detrás de cada valoración: registros, entrevistas, costes y bitácora. Contrasta hallazgos con usuarios y documenta explicaciones alternativas. Por ejemplo, comprueba si una reducción de espera coincide con menor demanda. Entregable: tabla de hallazgos, fuentes y límites.','Gather sources behind each assessment: records, interviews, costs and learning logs. Cross-check findings with users and document alternative explanations. For example, check whether lower waiting times coincide with lower demand. Deliverable: a table of findings, sources and limitations.'),'indicadores'],
[L('Técnica','Technical'),d.key==='adopt'?L('Prepara una adopción gradual: operación, soporte, formación, costes recurrentes e indicadores. Define criterios de pausa y revisión antes de extender cobertura. Por ejemplo, incorpora una nueva unidad y verifica su capacidad de atención antes de incorporar otras. Entregable: plan de adopción con responsables.','Prepare gradual adoption: operations, support, training, recurring costs and indicators. Define pause and review criteria before expanding coverage. For example, add one unit and check its service capacity before adding others. Deliverable: an adoption plan with owners.'):L('Selecciona el bloqueo principal y diseña una comprobación acotada. Si hay riesgos, acuerda primero medidas de protección y la revisión de la actividad afectada. Por ejemplo, simula los casos que generaron errores antes de volver a probar con usuarios. Entregable: protocolo ajustado y criterio de avance.','Select the main blocker and design a bounded check. If risks exist, first agree protective measures and review the affected activity. For example, simulate error-producing cases before testing again with users. Deliverable: an updated protocol and advancement criterion.'),d.key==='adopt'?'adopcion':'piloto'],
[L('Comunicación','Communication'),L('Prepara una devolución diferenciada para usuarios, equipos y autoridades: qué se probó, qué se observó, qué sigue y qué aún no se sabe. Usa canales accesibles a los perfiles menos visibles. Por ejemplo, combina una reunión con usuarios y una ficha de resultados sin afirmar impactos no demostrados. Entregable: mensaje, públicos, canales y fecha de devolución.','Prepare feedback for users, teams and leaders: what was tested, what was observed, what follows and what remains unknown. Use channels accessible to less visible groups. For example, combine a user meeting with a results brief without claiming unproven impacts. Deliverable: messages, audiences, channels and feedback date.'),'comunicacion']
];}
function pilotResults(){const d=pilotDecision(pilot);return '<section class="gh-recommendation"><div class="gh-eyebrow">'+L('Orientación para la decisión','Decision guidance')+'</div><h2>'+d.title+'</h2><p>'+d.reason+'</p><p>'+d.known+'/5 '+L('criterios con puntuación y evidencia declarada. La calidad de esa evidencia debe revisarse con el equipo.','criteria with a score and declared evidence. The quality of that evidence must be reviewed with your team.')+'</p></section><div class="gh-eval-profile">'+pilotRadar()+'<div><h3>'+L('Perfil declarado','Declared profile')+'</h3><table class="gh-lab-table"><thead><tr><th>'+L('Criterio','Criterion')+'</th><th>'+L('Valoración','Assessment')+'</th></tr></thead><tbody>'+evalCriteria().map((c,i)=>'<tr><td>'+c.name+'</td><td>'+esc(evalOptions().find(x=>x[0]===String(pilot.scores[i]))?.[1]||L('Sin evaluar','Not assessed'))+'</td></tr>').join('')+'</tbody></table><p class="gh-note">'+L('El gráfico no es una medida de impacto. Los criterios desconocidos o no aplicables quedan abiertos. Una puntuación sin fuente escrita requiere verificación.','The chart is not an impact measure. Unknown or inapplicable criteria remain open. A score without a written source needs verification.')+'</p></div></div><h2>'+L('Cuatro acciones para tu equipo','Four actions for your team')+'</h2>'+pilotActions().map(([title,body,id])=>'<details class="gh-action-card"><summary>'+title+'</summary><p>'+body+'</p>'+toolLink(id)+'</details>').join('')+'<div class="gh-output-tools"><button class="gh-btn" id="gh-pilot-print">'+L('Ver informe / guardar PDF','View report / save PDF')+' ↗</button><button class="gh-btn gh-secondary" id="gh-pilot-export">'+L('Descargar informe editable','Download editable report')+' ↓</button><button class="gh-btn gh-secondary" id="gh-pilot-edit">'+L('Revisar evaluación','Review assessment')+'</button></div>';}
function pilotPaper(){const d=pilotDecision(pilot);return paper(L('Evaluación y próximos pasos del piloto','Pilot review and next steps'),'<h2>'+esc(pilot.name||L('Piloto sin nombre','Unnamed pilot'))+'</h2><h2>'+d.title+'</h2><p>'+d.reason+'</p>'+pilotRadar()+'<p>'+L('Perfil declarado; no mide impacto causal.','Declared profile; does not measure causal impact.')+'</p>'+evalCriteria().map((c,i)=>'<h3>'+c.name+'</h3><p>'+esc(evalOptions().find(x=>x[0]===String(pilot.scores[i]))?.[1]||L('Sin evaluar','Not assessed'))+'</p><p style="white-space:pre-wrap">'+esc(pilot.evidence[i]||L('Sin evidencia escrita','No written evidence'))+'</p>').join('')+'<h2>'+L('Condiciones declaradas','Declared conditions')+'</h2>'+pilotConditions().map(q=>'<p><b>'+q.label+'</b>: '+esc(q.options.find(x=>x[0]===pilot[q.key])?.[1]||'')+'</p>').join('')+'<h2>'+L('Plan de acción','Action plan')+'</h2>'+pilotActions().map(([title,body])=>'<section class="action"><h3>'+title+'</h3><p>'+body+'</p><p contenteditable="true">'+L('Responsable: [acordar] · Fecha: [acordar] · Evidencia: [completar]','Owner: [agree] · Date: [agree] · Evidence: [complete]')+'</p></section>').join('')+'<p>'+L('Instrumento orientativo de Gobierno Habilitador basado en los cinco criterios de la guía de pilotos de Patricio Ovalle Wood. No constituye una evaluación independiente ni autorización para escalar.','An indicative Gobierno Habilitador instrument based on the five criteria in Patricio Ovalle Wood’s pilot guide. It is not an independent evaluation or authorisation to scale.')+'</p>');}
function pilotConditions(){return [{key:'owner',label:L('¿Hay responsable confirmado para la operación?','Is an operating owner confirmed?'),options:[['unknown',L('Por verificar','To verify')],['yes',L('Sí','Yes')],['no',L('No','No')]]},{key:'resources',label:L('¿Están confirmados recursos y capacidades de operación?','Are operating resources and capabilities confirmed?'),options:[['unknown',L('Por verificar','To verify')],['yes',L('Sí','Yes')],['no',L('No','No')]]},{key:'risk',label:L('¿Hay efectos adversos relevantes sin resolver?','Are significant adverse effects unresolved?'),options:[['unknown',L('Aún no se ha revisado','Not yet reviewed')],['yes',L('Sí, requieren revisión','Yes, review is needed')],['no',L('No identificados en la revisión realizada','None identified in the review conducted')]]},{key:'hypothesis',label:L('¿Qué ocurrió con la hipótesis principal?','What happened to the main hypothesis?'),options:[['unknown',L('No concluyente o no evaluada','Inconclusive or not assessed')],['supported',L('La evidencia la respalda en este contexto','Evidence supports it in this context')],['refuted',L('La evidencia la refuta','Evidence refutes it')],['revised',L('Requiere reformulación','It needs revision')]]}];}
function evaluatePilot(){if(evalDone)return '<a href="#gh-pilots">← '+L('Pilotos','Pilots')+'</a><h1>'+L('Resultados y próximos pasos','Results and next steps')+'</h1><p>'+esc(pilot.name)+'</p>'+pilotResults();const c=evalCriteria()[evalStep];return '<a href="#gh-pilots">← '+L('Pilotos','Pilots')+'</a><h1>'+L('Evalúa tu piloto con evidencia','Evaluate your pilot with evidence')+'</h1><p class="gh-lead">'+L('Cinco criterios y una revisión de condiciones para preparar la decisión de tu equipo.','Five criteria and a readiness review to prepare your team’s decision.')+'</p><label>'+L('Nombre del piloto — opcional','Pilot name — optional')+'<input id="gh-pilot-name" maxlength="180" value="'+esc(pilot.name)+'"></label><section class="gh-question-screen"><p class="gh-step-count">'+L('Paso','Step')+' '+(evalStep+1)+' / 6</p><progress max="6" value="'+(evalStep+1)+'" aria-label="'+L('Avance de la evaluación','Assessment progress')+'"></progress>'+(c?'<h2>'+c.name+'</h2><h3>'+c.question+'</h3><p>'+c.guide+'</p><details class="gh-optional"><summary>'+L('Ver un ejemplo','See an example')+'</summary><p>'+c.example+'</p></details><label>'+L('Valoración','Assessment')+'<select id="gh-eval-score">'+evalOptions().map(([v,label])=>'<option value="'+v+'" '+(String(pilot.scores[evalStep]||'unknown')===v?'selected':'')+'>'+label+'</option>').join('')+'</select></label><label>'+L('Evidencia, fuente y límites — o motivo de no aplicación','Evidence, source and limitations — or reason for non-applicability')+'<textarea id="gh-eval-evidence" rows="5" maxlength="5000" placeholder="'+L('¿Qué observaron, cuándo y con qué fuente?','What did you observe, when and from which source?')+'">'+esc(pilot.evidence[evalStep]||'')+'</textarea></label>':'<h2>'+L('Condiciones para decidir','Conditions for a decision')+'</h2><p>'+L('Una buena puntuación no reemplaza acuerdos de operación ni revisión de riesgos.','A good score does not replace operating commitments or risk review.')+'</p><div class="gh-worksheet-grid">'+pilotConditions().map(q=>'<label>'+q.label+'<select data-pilot-condition="'+q.key+'">'+q.options.map(([v,label])=>'<option value="'+v+'" '+(pilot[q.key]===v?'selected':'')+'>'+label+'</option>').join('')+'</select></label>').join('')+'</div>')+'<div class="gh-output-tools"><button id="gh-eval-prev" class="gh-btn gh-secondary" '+(evalStep===0?'disabled':'')+'>← '+L('Anterior','Previous')+'</button><button id="gh-eval-next" class="gh-btn">'+(evalStep===5?L('Ver orientación y plan','View guidance and plan'):L('Siguiente','Next'))+' →</button></div></section>';}
function bindLab(){
root.querySelectorAll('[data-pdf]').forEach(b=>{const id=b.dataset.pdf;const a=document.createElement('a');a.className=b.className;a.textContent=b.textContent;a.href='data:application/pdf;base64,'+PDFS[language][id];a.download='Gobierno-Habilitador-'+id+'-'+language+'.pdf';b.replaceWith(a);});

const qs=(s)=>root.querySelector(s);if(qs('#gh-catalog')){refreshCatalogue();qs('#gh-library-search').oninput=e=>{libraryQuery=e.target.value;refreshCatalogue();};qs('#gh-library-stage').onchange=e=>{libraryStage=e.target.value;refreshCatalogue();};}
root.querySelectorAll('[data-work]').forEach(input=>input.oninput=()=>{const [id,i]=input.dataset.work.split(':');workbook[id]=workbook[id]||{};workbook[id][i]=input.value;saveLab();});
root.querySelectorAll('[data-work-print]').forEach(b=>b.onclick=()=>openPaper(paper(tool(b.dataset.workPrint).name,worksheetBody(b.dataset.workPrint))));
root.querySelectorAll('[data-work-download]').forEach(b=>b.onclick=()=>download(paper(tool(b.dataset.workDownload).name,worksheetBody(b.dataset.workDownload)),'Gobierno-Habilitador-'+b.dataset.workDownload+'-'+language+'.html'));
const jump=qs('[data-work-jump]');if(jump)jump.onclick=e=>{e.preventDefault();qs('#gh-work-area').scrollIntoView({behavior:'smooth',block:'start'});qs('#gh-work-area textarea')?.focus({preventScroll:true});};

ck"><input type="checkbox" name="marketing_consent" '+(registrationDraft.marketing_consent?'checked':'')+'>'+L('Quiero recibir novedades, actividades y servicios de ES Digital (opcional).','I would like to receive updates, events and services from ES Digital (optional).')+'</label><button class="gh-btn" type="submit" '+(registrationBusy?'disabled':'')+'>'+ (registrationBusy?L('Enviando…','Submitting…'):L('Registrarme y acceder','Register and access'))+'</button><p id="gh-registration-status" role="status" aria-live="polite">'+esc(registrationError)+'</p></form></section></main>';}
function bindRegistration(){const form=root.querySelector('#gh-registration');if(!form)return;form.oninput=()=>{for(const el of form.elements){if(el.name)registrationDraft[el.name]=el.type==='checkbox'?el.checked:el.value;}};form.onsubmit=async e=>{e.preventDefault();if(registrationBusy||!form.reportValidity())return;form.oninput();registrationBusy=true;registrationError='';form.querySelector('button').disabled=true;form.querySelector('button').textContent=L('Enviando…','Submitting…');const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),20000);try{const payload={...registrationDraft,language,source:'Gobierno Habilitador · ES Digital',consent_version:'2026-10-05',_subject:'Nuevo registro · Gobierno Habilitador'};const response=await fetch(registrationEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload),signal:controller.signal});if(!response.ok)throw new Error('submission');const result=await response.json();if(result.ok!==true)throw new Error('submission');registered=true;registrationDraft={};try{localStorage.setItem('gh-access-v1','registered');}catch(e){}if(location.hash==='#gh-access')location.hash='#gobierno-habilitador';}catch(e){registrationError=L('No pudimos confirmar el registro. Tus datos siguen aquí; inténtalo nuevamente. Si el problema continúa, escribe a pato@esdigital.cl.','We could not confirm registration. Your details are still here; please try again. If the issue continues, email pato@esdigital.cl.');}finally{clearTimeout(timeout);registrationBusy=false;render();}};}

 Contact registration is sent to ES Digital through Formspree. Avoid personal or confidential information. Assessments and recommendations are indicative, not certifications or validated indices.')+'</p><p id="gh-save-note" role="status"></p><section class="gh-cta"><h2>'+L('¿Necesitas acompañamiento para tu equipo?','Need support for your team?')+'</h2><p>'+L('Adaptamos las herramientas al contexto y las capacidades de tu institución.','We adapt these tools to your institutional context and capabilities.')+'</p><a class="gh-btn" href="#contact">'+L('Conversemos ↗','Let’s talk ↗')+'</a></section><footer>'+L('Gobierno Habilitador','Enabling Government')+' · Patricio Ovalle Wood · ES / EN · v5.0</footer></main>';bind();bindLab();}

ignPaper(),'Gobierno-Habilitador-plan-'+language+'.html');root.querySelectorAll('[data-service]').forEach(input=>input.oninput=()=>{const [i,k]=input.dataset.service.split(':');services[i][k]=input.value;comparison=false;root.querySelector('#gh-comparison')?.remove();save();});root.querySelectorAll('[data-remove-service]').forEach(b=>b.onclick=()=>{services.splice(Number(b.dataset.removeService),1);comparison=false;save();render();});const add=root.querySelector('#gh-add-service');if(add)add.onclick=()=>{if(services.length>=8){root.querySelector('#gh-compare-note').textContent=L('Compara hasta ocho servicios por sesión.','Compare up to eight services per session.');return;}services.push(blankService());save();render();};const compare=root.querySelector('#gh-compare');if(compare)compare.onclick=()=>{if(!services.every(s=>s.name.trim())){root.querySelector('#gh-compare-note').textContent=L('Nombra cada servicio para distinguirlos. Las condiciones sin información pueden quedar por verificar.','Name each service to distinguish it. Unknown conditions may remain to be verified.');return;}comparison=true;render();root.querySelector('#gh-comparison').scrollIntoView({behavior:'smooth',block:'start'});};const vc=root.querySelector('#gh-view-comparison');if(vc)vc.onclick=()=>openPaper(comparisonPaper());const dc=root.querySelector('#gh-download-comparison');if(dc)dc.onclick=()=>download(comparisonPaper(),'Gobierno-Habilitador-servicios-'+language+'.html');}
