ios, causas, evidencia y preguntas pendientes.", "warning": "Tratar una ronda pequeña de entrevistas como una muestra estadísticamente representativa.", "tools": ["entrevistas", "recorrido", "desafio"], "case": "nyc"}, {"name": "Equipo y recursos", "questions": ["¿Hay personas con dedicación definida y capacidad para conducir el trabajo?", "¿Están disponibles las capacidades de diseño, datos, operación y soporte jurídico necesarias?", "¿Existe presupuesto para pruebas y continuidad, además de actividades de lanzamiento?"], "why": "La falta de dedicación o de capacidades críticas limita la implementación incluso cuando existe respaldo.", "owner": "Dirección operativa, personas y presupuesto", "actions": ["Lista las capacidades requeridas por la cartera inicial y distingue disponibilidad real de participación nominal.", "Acuerda dedicación semanal, capacidades compartidas y apoyos externos; comienza con un alcance que puedas sostener.", "Presupuesta operación, pruebas, evaluación y mantenimiento; identifica qué recursos aún requieren aprobación."], "evidence": "Matriz de capacidades, dedicaciones acordadas y presupuesto inicial con fuente identificada.", "warning": "Copiar un equipo grande sin considerar la capacidad financiera de la institución.", "tools": ["capacidades", "raci"], "case": "team"}, {"name": "Método y procesos", "questions": ["¿Existen etapas claras desde el problema hasta la adopción?", "¿Hay criterios para priorizar proyectos y decidir si continuar, modificar o detenerlos?", "¿El equipo documenta decisiones y aprendizajes de forma reutilizable?"], "why": "Sin un proceso compartido, cada proyecto depende de personas y decisiones improvisadas.", "owner": "Responsable de innovación y líderes de proyectos", "actions": ["Dibuja el proceso actual e identifica dónde se traban decisiones, datos o recursos.", "Acuerda etapas simples con entregable, responsable y criterio de revisión; prueba el proceso en un proyecto.", "Mantén un registro de decisiones y aprendizajes; ajusta el método con el equipo al cerrar cada etapa."], "evidence": "Proceso probado con un proyecto y criterios de avance documentados.", "warning": "Añadir controles que consumen más esfuerzo que el aprendizaje que generan.", "tools": ["priorizacion", "desafio", "piloto"], "case": "nyc"}, {"name": "Redes y colaboración", "questions": ["¿Se identificaron actores según las capacidades que necesita el desafío?", "¿Cada aliado tiene una contribución y un responsable definidos?", "¿Hay una agenda compartida con proyectos y reglas de coordinación?"], "why": "Una lista de contactos o eventos no asegura colaboración ni resultados compartidos.", "owner": "Coordinador del ecosistema y responsables de aliados", "actions": ["Mapea actores con sus intereses, capacidades y contribuciones potenciales; identifica quién falta.", "Convoca una sesión de trabajo sobre un desafío concreto y acuerda una primera contribución por actor.", "Formaliza una agenda manejable, responsables y revisión periódica de compromisos."], "evidence": "Mapa de actores y primer proyecto con contribuciones y responsables acordados.", "warning": "Confundir adhesión a una red con recursos o participación efectiva.", "tools": ["actores", "raci"], "case": "helsinki"}, {"name": "Experimentación y pilotos", "questions": ["¿Cada piloto tiene una hipótesis y una incertidumbre concreta que resolver?", "¿Se definieron usuarios, duración, riesgos y datos antes de probar?", "¿Hay criterios previos para continuar, modificar o detener la prueba?"], "why": "Probar sin criterios genera actividades, pero poca evidencia útil para decidir.", "owner": "Líder del piloto, área responsable y evaluador", "actions": ["Selecciona la incertidumbre más importante y diseña la prueba más pequeña que permita aprender sobre ella.", "Prepara un prototipo y protocolo con usuarios, datos, riesgos y responsables; revisa las condiciones aplicables con el equipo competente.", "Acuerda una revisión al finalizar: qué aprendimos, qué cambió y qué decisión permite la evidencia."], "evidence": "Protocolo de prueba y registro de aprendizajes con una decisión justificada.", "warning": "Interpretar el entusiasmo inicial como evidencia suficiente de efectividad.", "tools": ["piloto", "indicadores"], "case": "piloting"}, {"name": "Adopción y escalamiento", "questions": ["¿Hay un área que asumirá la operación si la solución funciona?", "¿Se previeron mantenimiento, formación, financiamiento y la vía institucional de adopción?", "¿Se documentó qué debe adaptarse antes de ampliar o replicar la solución?"], "why": "La continuidad depende de capacidades y responsabilidades que un piloto por sí solo no crea.", "owner": "Responsable del servicio, operación y presupuesto", "actions": ["Involucra desde el inicio al área que operará la solución y acuerda sus condiciones de aceptación.", "Estima costos recurrentes, mantenimiento, capacitación y dependencias; revisa con las áreas competentes la vía de adopción.", "Prueba una ampliación gradual y documenta qué cambia entre contextos antes de replicar."], "evidence": "Plan de adopción con responsable, costos recurrentes y decisión institucional pendiente o acordada.", "warning": "Prometer compra o expansión automática por el solo hecho de concluir un piloto.", "tools": ["adopcion", "capacidades"], "case": "boston"}, {"name": "Evaluación y valor público", "questions": ["¿Existe una línea de base y un resultado esperado para las personas?", "¿Los indicadores tienen fuente, frecuencia y responsable definidos?", "¿Se distinguió actividad, resultado e impacto y se revisaron otras causas posibles del cambio?"], "why": "Medir eventos o prototipos no permite saber si mejoró un servicio o si vale la pena ampliarlo.", "owner": "Responsable de evaluación, datos y servicio", "actions": ["Explica la relación entre intervención y resultado; identifica supuestos y efectos no deseados.", "Reúne la línea de base y define pocos indicadores relevantes, combinando datos y experiencia de usuarios.", "Elige una evaluación proporcional al riesgo y costo; documenta límites y conecta resultados con decisiones."], "evidence": "Teoría de cambio y ficha de indicadores con línea de base o un plan para obtenerla.", "warning": "Atribuir una mejora al proyecto sin revisar cambios externos o diferencias entre usuarios.", "tools": ["cambio", "indicadores"], "case": "evaluation"}, {"name": "Comunicación y legitimidad", "questions": ["¿Están definidos públicos, mensajes y acciones esperadas de cada uno?", "¿Existe un calendario con canales, responsables y devolución a participantes?", "¿Los mensajes se respaldan en evidencia e incluyen dificultades y aprendizajes?"], "why": "La comunicación ayuda a comprender, participar y sostener el trabajo cuando muestra resultados verificables.", "owner": "Comunicaciones, líder de proyecto y participación", "actions": ["Identifica qué necesitan saber y hacer autoridades, funcionarios, usuarios y aliados; diferencia sus mensajes.", "Diseña un calendario que combine canales internos, redes sociales, prensa local y medios masivos cuando sean pertinentes.", "Publica avances con evidencia y devuelve a participantes qué se incorporó, qué no y por qué."], "evidence": "Plan de comunicación y primera devolución publicada con resultados y pendientes verificables.", "warning": "Prometer impacto antes de evaluarlo o medir legitimidad únicamente por alcance en redes.", "tools": ["comunicacion", "actores"], "case": "madrid"}], "tools": [{"id": "mandato", "name": "Ficha de propósito, mandato y patrocinio", "method": "Diseño institucional", "duration": "60-90 minutos", "people": "Autoridad patrocinadora, responsable operativo y área del servicio", "purpose": "Preparar una decisión institucional sobre propósito, alcance, responsabilidades y recursos.", "steps": ["Delimita la necesidad pública y aporta evidencia.", "Define el resultado esperado y el alcance inicial.", "Identifica patrocinador y responsables de decisión y adopción.", "Acuerda recursos y la decisión solicitada; registra pendientes."], "fields": ["Problema, personas afectadas y evidencia", "Resultado esperado y alcance", "Patrocinador, decisiones y responsables", "Recursos, compromisos y decisión solicitada"], "example": "Servicio: permisos comerciales. Propósito: reducir visitas repetidas. Solicitud: dedicar un equipo compartido y designar al área de permisos como responsable de adopción.", "next": "Presenta la ficha a la autoridad y registra los compromisos acordados.", "stage": "govern"}, {"id": "raci", "name": "Matriz de responsabilidades y decisiones", "method": "Gestión de proyectos", "duration": "45-60 minutos", "people": "Responsables de innovación, servicio y unidades de soporte", "purpose": "Clarificar quién ejecuta, quién responde por una decisión y quién debe ser consultado o informado.", "steps": ["Enumera decisiones y entregables críticos.", "Asigna quien ejecuta (R) y quien responde por la decisión (A).", "Identifica consultados (C) e informados (I).", "Comprueba que no haya vacíos y acuerda cómo resolver bloqueos."], "fields": ["Decisión o entregable", "R: ejecuta / A: responde por la decisión", "C: consultados / I: informados", "Bloqueos, mecanismo de resolución y revisión"], "example": "Piloto de atención: R, equipo del proyecto; A, dirección del servicio; C, jurídico y tecnología; I, autoridad patrocinadora.", "next": "Valida las responsabilidades con las personas designadas; la matriz no sustituye sus atribuciones formales.", "stage": "govern"}, {"id": "entrevistas", "name": "Guía de entrevistas exploratorias", "method": "Diseño centrado en las personas", "duration": "30-45 minutos por entrevista", "people": "Facilitador y usuarios o personal de atención", "purpose": "Comprender situaciones reales, obstáculos y necesidades sin inducir una respuesta.", "steps": ["Selecciona perfiles diversos y explica el propósito y uso de la información.", "Pregunta por la última experiencia concreta: qué intentó hacer y qué ocurrió.", "Profundiza en dificultades, apoyos y consecuencias.", "Separa observaciones de interpretaciones y revisa patrones y diferencias."], "fields": ["Perfil y contexto, sin identificadores innecesarios", "Última experiencia: pasos y dificultades", "Necesidades, apoyos y consecuencias", "Hallazgos, diferencias y preguntas pendientes"], "example": "Pregunta: cuéntame la última vez que solicitaste este permiso. Evita: ¿te gustaría una aplicación para resolverlo?", "next": "Amplía la exploración si faltan perfiles y usa los hallazgos en el mapa de recorrido.", "stage": "understand"}, {"id": "recorrido", "name": "Mapa del recorrido del usuario", "method": "Diseño de servicios", "duration": "60-90 minutos", "people": "Usuarios, personal de atención y responsable del servicio", "purpose": "Localizar obstáculos a lo largo del servicio, incluyendo canales presenciales y digitales.", "steps": ["Define un perfil y una situación concreta.", "Ordena lo que hace antes, durante y después del servicio.", "Registra canales, esperas, dificultades y evidencia.", "Selecciona oportunidades de mejora y valida el mapa con usuarios."], "fields": ["Usuario, objetivo y situación", "Antes: pasos, canales y obstáculos", "Durante: pasos, canales y obstáculos", "Después: resultado, dificultades y oportunidades"], "example": "Una persona consulta requisitos en línea, llega a oficina y descubre un documento faltante. El obstáculo puede estar en la información previa.", "next": "Formula el desafío a partir de obstáculos respaldados por evidencia.", "stage": "understand"}, {"id": "desafio", "name": "Ficha del desafío y preguntas de diseño", "method": "Design thinking y análisis de problemas", "duration": "60 minutos", "people": "Equipo del proyecto, usuarios y responsable del servicio", "purpose": "Convertir observaciones en un problema delimitado y una pregunta abierta a distintas soluciones.", "steps": ["Resume evidencia y población afectada.", "Distingue causas, síntomas y supuestos.", "Redacta una pregunta: ¿cómo podríamos facilitar X para Y considerando Z?", "Define alcance, restricciones y qué aún necesitas investigar."], "fields": ["Problema, usuarios y evidencia", "Causas, síntomas y supuestos", "Pregunta: ¿cómo podríamos...?", "Alcance, restricciones y evidencia pendiente"], "example": "¿Cómo podríamos ayudar a nuevos emprendedores a comprender los requisitos del permiso antes de su primera visita?", "next": "Explora alternativas y evita que la pregunta obligue a elegir una tecnología.", "stage": "understand"}, {"id": "capacidades", "name": "Matriz de capacidades y recursos", "method": "Planificación operativa", "duration": "60-90 minutos", "people": "Dirección operativa, personas, presupuesto y unidades de soporte", "purpose": "Ajustar el alcance a las capacidades realmente disponibles y planificar brechas.", "steps": ["Lista tareas de la cartera inicial y capacidades requeridas.", "Registra disponibilidad y dedicación efectiva.", "Distingue recursos propios, compartidos y externos.", "Acuerda acciones, costos y aprobaciones necesarias."], "fields": ["Tarea y capacidad requerida", "Persona o área disponible y dedicación", "Brecha y forma de cubrirla", "Costo, fuente, aprobación y responsable"], "example": "Diseño: capacidad interna, dedicación parcial. Jurídico: apoyo compartido. Evaluación: apoyo universitario por acordar.", "next": "Reduce la cartera si hay brechas críticas sin responsable ni recursos.", "stage": "govern"}, {"id": "priorizacion", "name": "Matriz de priorización de desafíos", "method": "Gestión de cartera", "duration": "60 minutos", "people": "Responsable de innovación, áreas de servicios y patrocinador", "purpose": "Elegir una cartera manejable con criterios explícitos y decisiones justificadas.", "steps": ["Acuerda criterios antes de comparar proyectos.", "Revisa relevancia, evidencia, viabilidad, riesgos y responsable de adopción.", "Compara alternativas con notas justificadas; registra desacuerdos.", "Selecciona según capacidad y revisa la cartera al obtener nueva evidencia."], "fields": ["Desafío y evidencia disponible", "Relevancia para usuarios y resultado esperado", "Viabilidad, riesgos y responsable de adopción", "Decisión, justificación y condiciones para revisar"], "example": "Un trámite frecuente con responsable comprometido puede ser un mejor inicio que una tecnología visible sin problema claro.", "next": "Convierte los desafíos elegidos en fichas y asigna un responsable por proyecto.", "stage": "design"}, {"id": "actores", "name": "Mapa de actores y contribuciones", "method": "Articulación de ecosistemas", "duration": "60-90 minutos", "people": "Gobierno, empresas, universidades y sociedad civil pertinentes", "purpose": "Conectar intereses y capacidades con compromisos concretos para un desafío.", "steps": ["Define el desafío o propósito compartido.", "Identifica actores, intereses y capacidades, incluidos los ausentes.", "Registra contribuciones posibles y dependencias.", "Acuerda una primera acción y un responsable por actor."], "fields": ["Actor, interés y relación con el desafío", "Capacidad o contribución potencial", "Compromiso, responsable y próximo paso", "Actores ausentes, conflictos y coordinación"], "example": "Universidad: evaluación; municipio: acceso al servicio; empresa: prototipo; vecinos: experiencia y prueba. Cada contribución requiere acuerdo.", "next": "Usa el mapa para acordar una agenda y revisar contribuciones efectivas.", "stage": "govern"}, {"id": "piloto", "name": "Prototipo y protocolo de experimentación", "method": "Prototipado y experimentación pública", "duration": "90 minutos de preparación", "people": "Equipo, usuarios, área responsable y soportes pertinentes", "purpose": "Diseñar una prueba limitada que responda una incertidumbre y permita decidir.", "steps": ["Define hipótesis y qué podría demostrar que es incorrecta.", "Elige un prototipo simple: guion, formulario, maqueta o simulación.", "Acuerda usuarios, datos, duración, riesgos y condiciones de la prueba.", "Establece criterios para continuar, modificar o detener y documenta aprendizajes."], "fields": ["Hipótesis e incertidumbre", "Prototipo, usuarios y procedimiento", "Datos, duración, riesgos y responsables", "Criterios de decisión y aprendizajes"], "example": "Probar un guion de orientación y un formulario en papel puede revelar problemas antes de desarrollar una plataforma.", "next": "Revisa evidencia y resguardos; no conviertas una prueba en expansión automática.", "stage": "test"}, {"id": "adopcion", "name": "Plan de adopción y continuidad", "method": "Implementación y sostenibilidad", "duration": "90 minutos", "people": "Responsable del servicio, operación, presupuesto y soporte", "purpose": "Preparar la transición de una solución probada a la operación habitual.", "steps": ["Revisa evidencia y condiciones de aceptación.", "Asigna quién operará, mantendrá y financiará la solución.", "Planifica capacitación, transición y dependencias institucionales.", "Define una ampliación gradual y revisión de resultados."], "fields": ["Resultado del piloto y condiciones de aceptación", "Operación, mantenimiento y responsables", "Costos recurrentes, recursos y decisiones pendientes", "Transición, capacitación y revisión"], "example": "La unidad del servicio incorpora el procedimiento, capacita al personal y asume una revisión mensual de resultados.", "next": "Valida recursos y vía de adopción antes de comprometer fechas de expansión.", "stage": "adopt"}, {"id": "cambio", "name": "Teoría de cambio práctica", "method": "Evaluación y planificación", "duration": "60-90 minutos", "people": "Equipo, responsable del servicio y evaluación", "purpose": "Explicar cómo la intervención podría generar valor y qué supuestos deben cumplirse.", "steps": ["Define el cambio esperado para las personas.", "Relaciona recursos, actividades, productos y resultados.", "Explicita supuestos y efectos no deseados.", "Identifica qué evidencia permitiría revisar la explicación."], "fields": ["Problema y cambio esperado para las personas", "Recursos, actividades y productos", "Resultados y supuestos de la relación causal", "Efectos no deseados y evidencia necesaria"], "example": "Información clara puede reducir visitas repetidas si los requisitos son estables y los usuarios pueden acceder a esa información.", "next": "Convierte los resultados en indicadores y evalúa los supuestos.", "stage": "design"}, {"id": "indicadores", "name": "Ficha de indicadores y línea de base", "method": "Medición y aprendizaje", "duration": "60 minutos", "people": "Servicio, datos y evaluación", "purpose": "Medir cambios relevantes y definir quién obtendrá y utilizará la evidencia.", "steps": ["Elige resultados relevantes, incluyendo accesibilidad y posibles efectos adversos.", "Define indicador, cálculo, fuente, frecuencia y responsable.", "Obtén la línea de base o documenta cómo la reunirás.", "Define decisiones y límites de atribución; combina datos con experiencia de usuarios."], "fields": ["Resultado, indicador y forma de cálculo", "Fuente, frecuencia y responsable", "Línea de base, fecha y calidad del dato", "Decisión, otras causas posibles y límites"], "example": "Visitas repetidas por solicitud: comparar registros de períodos equivalentes y revisar cambios en requisitos o composición de usuarios.", "next": "Revisa los indicadores en cada decisión del proyecto; evita medir solo actividad.", "stage": "evaluate"}, {"id": "comunicacion", "name": "Plan de comunicación y devolución", "method": "Comunicación estratégica y participación", "duration": "60-90 minutos", "people": "Comunicaciones, proyecto, participación y servicio", "purpose": "Definir qué deben comprender y hacer los públicos y cómo informar resultados verificables.", "steps": ["Identifica públicos y la acción esperada de cada uno.", "Redacta mensajes respaldados por evidencia, sin prometer resultados no evaluados.", "Elige canales: internos, medios locales o masivos, redes y encuentros según acceso.", "Acuerda hitos, responsables y devolución de lo aprendido a participantes."], "fields": ["Público, necesidad de información y acción esperada", "Mensaje, evidencia y límites", "Canal, hito, fecha y responsable", "Devolución, comprensión y participación a observar"], "example": "Vecinos: cómo participar y qué cambió. Funcionarios: qué decisión se tomó y cómo aplicarla. Autoridades: resultados, pendientes y recursos necesarios.", "next": "Publica una devolución y comprueba comprensión y participación, además del alcance.", "stage": "adopt"}, {"id": "supuestos", "stage": "understand", "method": "Gobierno Habilitador", "name": "Mapa de supuestos críticos", "purpose": "Identifica qué debe ser cierto para que una propuesta funcione y qué afirmaciones aún no tienen respaldo.", "duration": "45–60 min", "people": "Responsable del servicio, equipo técnico y atención ciudadana.", "steps": ["Escriban afirmaciones verificables sobre usuarios, operación, recursos y autorizaciones. Eviten formular deseos como hechos.", "Para cada afirmación, anoten su evidencia y qué ocurriría si resultara falsa. Clasifiquen por consecuencia y respaldo disponible.", "Elijan un supuesto de alta consecuencia y poca evidencia. Redáctenlo con población, conducta observable y contexto.", "Definan qué observación les haría cambiar de opinión y lleven ese supuesto al selector de pruebas."], "example": "Un municipio supone que las personas mayores podrán solicitar una cita por teléfono sin ayuda. Antes de contratar una plataforma, identifica barreras de audición, acceso y comprensión que necesita observar.", "fields": ["Supuesto y población afectada", "Evidencia disponible y fuente", "Consecuencia de estar equivocados", "Qué observar y qué decisión cambiaría"], "next": "Prueba primero el supuesto cuya incertidumbre puede alterar la decisión; una opinión del equipo no equivale a evidencia ciudadana."}, {"id": "alternativas", "stage": "design", "method": "Gobierno Habilitador", "name": "Taller de alternativas de solución", "purpose": "Genera respuestas diferentes antes de comprometerse con una tecnología o proveedor.", "duration": "60–90 min", "people": "Equipo del servicio, usuarios invitados y áreas que implementarán.", "steps": ["Presenten un problema delimitado y la evidencia que lo respalda. Identifiquen una práctica que el equipo considera inamovible.", "Propongan individualmente opciones en cuatro frentes: eliminar pasos, cambiar la coordinación, mejorar la información y emplear tecnología.", "Contrasten cada opción con necesidades de usuarios, atribuciones y esfuerzo. Incluyan mantener el servicio actual como referencia.", "Elijan dos alternativas para explorar y escriban qué necesitan aprender antes de preferir una."], "example": "Para reducir visitas repetidas a un municipio, el equipo compara una lista de requisitos clara, revisión previa por teléfono y un formulario digital. No presupone que una aplicación sea la mejor opción.", "fields": ["Problema y evidencia", "Alternativas consideradas", "Ventajas, restricciones y personas excluidas", "Alternativas a probar y pregunta de aprendizaje"], "next": "Transforma las opciones seleccionadas en prototipos simples y observa su uso antes de invertir."}, {"id": "usabilidad", "stage": "test", "method": "Gobierno Habilitador", "name": "Prueba de usabilidad de un prototipo", "purpose": "Observa si las personas comprenden una propuesta y pueden completar tareas concretas.", "duration": "Preparación: medio día; sesiones: 30–45 min", "people": "Facilitador, observador y participantes con distintos contextos de uso.", "steps": ["Prepare un prototipo de papel o digital y dos tareas realistas. Reclute perfiles relevantes, incluyendo necesidades de accesibilidad.", "Explique que se evalúa el diseño y solicite consentimiento. Use datos ficticios. No presente la prueba como un servicio disponible.", "Pida completar las tareas sin enseñar el camino. Registre bloqueos, ayuda requerida y pasos completados, distinguiendo hechos de interpretación.", "Agrupe dificultades y su gravedad. Ajuste el prototipo y realice otra ronda; una muestra exploratoria no representa a toda la población."], "example": "Una oficina prueba un formulario de permiso comercial con emprendedores de distinta experiencia digital. Observa dónde interpretan mal un requisito y revisa el texto antes de programarlo.", "fields": ["Perfil, contexto y tareas", "Observaciones: tarea, bloqueo y ayuda", "Cambios propuestos y responsable", "Qué volver a probar y criterio de avance"], "next": "Continúa cuando las barreras relevantes estén resueltas en nuevas observaciones; no deduzcas impacto del servicio solo por satisfacción."}, {"id": "simulacion", "stage": "test", "method": "Gobierno Habilitador", "name": "Simulación del servicio", "purpose": "Ensaya la coordinación interna y los casos excepcionales antes de atender personas en un piloto real.", "duration": "90–120 min", "people": "Atención, operación, tecnología, responsable del servicio y asesoría pertinente.", "steps": ["Dibujen los pasos visibles para el usuario y las tareas internas que los hacen posibles. Asignen quién decide y quién ejecuta.", "Recorran un caso normal con expedientes ficticios, anotando entregas entre áreas y esperas.", "Repitan con casos difíciles: información incompleta, caída de sistema, necesidad de apoyo o ausencia del responsable.", "Registren fallas, medidas de continuidad y una persona responsable de resolver cada bloqueo antes de probar en terreno."], "example": "Un municipio simula una solicitud por WhatsApp que requiere inspección y pago. Descubre que ninguna unidad confirma al vecino el cierre del caso y asigna ese paso.", "fields": ["Pasos y responsables", "Casos normales y excepcionales", "Fallas y medidas de continuidad", "Acuerdos, responsables y fecha de nueva prueba"], "next": "Ensaya nuevamente los puntos críticos. La simulación comprueba coordinación, pero no sustituye observar a usuarios reales."}, {"id": "factibilidad", "stage": "test", "method": "Gobierno Habilitador", "name": "Prueba técnica de factibilidad", "purpose": "Comprueba una incertidumbre técnica acotada antes de integrar una solución al servicio.", "duration": "1–5 días según la prueba", "people": "Responsable técnico, operación y responsables de datos y seguridad.", "steps": ["Definan una sola incertidumbre: precisión, integración, estabilidad o capacidad. Especifiquen el entorno y el umbral aceptable antes de medir.", "Preparen datos sintéticos o autorizados y un entorno separado de producción. Acuerden permisos, acceso y eliminación de datos.", "Ejecuten casos normales y extremos; registren errores, tiempos, configuración y condiciones para reproducir la prueba.", "Documenten si se cumplió el umbral, qué quedó fuera y los costes de resolver limitaciones. Revisen con operación antes de avanzar."], "example": "Un equipo evalúa si un clasificador puede derivar solicitudes municipales. Usa casos desidentificados autorizados y revisa especialmente errores que podrían retrasar atenciones prioritarias.", "fields": ["Incertidumbre y umbral acordado", "Entorno, datos y autorizaciones", "Resultados, errores y límites", "Decisión técnica y siguiente prueba"], "next": "Un resultado de laboratorio no demuestra capacidad operativa, aceptación ciudadana ni autorización para desplegar."}, {"id": "comparacion", "stage": "evaluate", "method": "Gobierno Habilitador", "name": "Diseño de comparación de resultados", "purpose": "Planifica cómo distinguir cambios observados de efectos atribuibles a una intervención.", "duration": "Taller inicial: 90 min; estudio según diseño", "people": "Responsable de evaluación, servicio, datos y asesoría ética cuando corresponda.", "steps": ["Definan resultado principal, unidad de análisis, población, periodo y línea de base. Describan qué decisión requiere evidencia causal.", "Con apoyo especializado, estudien un grupo comparable o una asignación aleatoria cuando sea pertinente y admisible. Eviten retirar prestaciones esenciales.", "Estimen tamaño y duración necesarios, contaminación, pérdidas de seguimiento y factores externos; registren el plan antes de observar resultados.", "Compare resultados e incertidumbre. Si solo dispone de antes/después, describa el cambio y sus explicaciones alternativas sin atribuir causalidad."], "example": "Una oficina quiere saber si recordatorios reducen inasistencias. El equipo de evaluación diseña una comparación admisible y considera estacionalidad y diferencias entre usuarios antes de interpretar el resultado.", "fields": ["Resultado, población y línea de base", "Comparación propuesta y supuestos", "Tamaño, duración, riesgos y autorizaciones", "Análisis y límites de las conclusiones"], "next": "Solicita revisión de evaluación antes de ejecutar; esta ficha estructura la conversación y no calcula validez estadística."}, {"id": "aprendizaje", "stage": "evaluate", "method": "Gobierno Habilitador", "name": "Bitácora de aprendizaje del piloto", "purpose": "Convierte observaciones y ajustes en decisiones trazables durante la ejecución.", "duration": "20 min por revisión semanal", "people": "Responsable del piloto, operación y quien recoge la evidencia.", "steps": ["Registre lo que se esperaba observar esta semana y la hipótesis relacionada.", "Anote el resultado con fecha, fuente y limitaciones. Separe una anécdota de un patrón repetido.", "Explique qué cambió en la interpretación y acuerde mantener, modificar o detener una parte de la prueba.", "Asigne responsable, fecha y señal que comprobará si el ajuste ayuda. Conserve la versión previa del protocolo."], "example": "En un piloto de citas, bajan las llamadas pero aumentan las consultas presenciales. El equipo evita celebrar una reducción aislada y revisa si trasladó la carga a otro canal.", "fields": ["Expectativa e hipótesis", "Observación, fuente y limitaciones", "Aprendizaje y ajuste acordado", "Responsable, fecha y próxima comprobación"], "next": "Lleva la bitácora al cierre para explicar por qué cambió el piloto y qué aprendió la institución."}, {"id": "evaluacion", "stage": "evaluate", "method": "Gobierno Habilitador", "name": "Revisión de cierre del piloto", "purpose": "Evalúa pertinencia, eficacia, eficiencia, sostenibilidad y señales tempranas de impacto con evidencia explícita.", "duration": "90–120 min con evidencia preparada", "people": "Responsable del piloto, operación, evaluación, finanzas y autoridad patrocinadora.", "steps": ["Reúna objetivos, hipótesis, protocolo, indicadores, costes y bitácora. Declare datos faltantes antes de valorar desempeño.", "Revise los cinco criterios. Para cada juicio, cite una evidencia, su alcance y una explicación alternativa. No convierta ausencia de datos en fracaso.", "Distinga resultados del servicio y aprendizaje institucional. Una hipótesis refutada puede aportar una decisión útil; gastar el presupuesto no prueba eficiencia.", "Acuerde continuar, ajustar, detener o preparar adopción. Documente quién decide, condiciones pendientes y cómo se informará a usuarios y autoridades."], "example": "Un piloto mejora la atención, pero depende de una persona sin reemplazo ni presupuesto de operación. El equipo propone resolver continuidad antes de ampliar cobertura.", "fields": ["Criterios: juicio, evidencia y limitaciones", "Aprendizajes, costes y efectos no previstos", "Decisión propuesta y condiciones pendientes", "Responsable, plazo y devolución pública"], "next": "Usa la evaluación guiada del sitio para estructurar el cierre; la adopción requiere una decisión institucional y recursos confirmados."}, {"id": "portafolio", "stage": "adopt", "method": "Gobierno Habilitador", "name": "Mapa del portafolio de innovación pública", "purpose": "Ordena iniciativas por objetivo público, etapa, evidencia y demanda de recursos para decidir dónde concentrar esfuerzos.", "duration": "90 min", "people": "Dirección, responsables de proyectos, planificación y presupuesto.", "steps": ["Liste las iniciativas activas y vincule cada una a un resultado público y una unidad responsable.", "Anote etapa, gasto comprometido, capacidad necesaria, evidencia y próxima decisión. Señale obligaciones y dependencias.", "Busque duplicidades, proyectos sin responsable y demasiadas pruebas sin ruta de adopción. Compare compromisos con la capacidad real.", "Acuerde qué sostener, unir, reformular o cerrar, documentando razones y próxima revisión. No use popularidad como sustituto de valor público."], "example": "Un gobierno descubre cinco pilotos digitales que compiten por el mismo equipo de datos. Secuencia su ejecución y une dos que responden al mismo problema ciudadano.", "fields": ["Iniciativas y resultados públicos", "Etapa, responsable, evidencia y recursos", "Dependencias y conflictos de capacidad", "Decisiones y fecha de revisión"], "next": "Actualiza el mapa en cada revisión de gestión; las decisiones deben considerar obligaciones, equidad y capacidad de operación."}], "cases": {"boston": {"name": "Boston: Mayor’s Office of New Urban Mechanics", "place": "Estados Unidos", "url": "https://www.boston.gov/departments/new-urban-mechanics", "fact": "MONUM trabaja desde la oficina del alcalde con departamentos y comunidades. Su selección de proyectos considera problema, viabilidad, impacto y adopción por un departamento.", "learn": "Para adaptar: conecta patrocinio político con un área que asumirá la solución.", "limit": "La fuente describe organización y criterios; no demuestra que ese modelo sea adecuado para cualquier municipio."}, "nyc": {"name": "Nueva York: Service Design Studio", "place": "Estados Unidos", "url": "https://www.nyc.gov/site/opportunity/portfolio/service-design-studio.page", "fact": "El Studio colabora con agencias para comprender a usuarios y personal y probar prototipos antes de ampliarlos. Ofrece consultas breves y apoyo a proyectos.", "learn": "Para adaptar: comenzar por investigación y prototipos; compartir capacidades entre áreas.", "limit": "La fuente documenta el servicio y su enfoque; no ofrece una estimación causal de impacto para toda su actividad."}, "team": {"name": "Reino Unido: equipos del Service Standard", "place": "Reino Unido", "url": "https://www.gov.uk/service-manual/service-standard/point-6-have-a-multidisciplinary-team", "fact": "El estándar exige equipos con capacidades diversas, participación de quienes deciden y acceso a especialidades como análisis jurídico o de políticas.", "learn": "Para adaptar: definir capacidades según la fase y compartir especialistas cuando sea viable.", "limit": "Es una práctica institucional documentada; debe adaptarse a recursos y atribuciones locales."}, "helsinki": {"name": "Helsinki: Smart Kalasatama", "place": "Finlandia · experiencia 2013-2021", "url": "https://forumvirium.fi/en/publication/smartkalasatama-final-report/", "fact": "Kalasatama desarrolló experimentación urbana y colaboración entre operadores, instituciones y residentes. Su informe final documenta aprendizajes trasladados al programa Helsinki Innovation Districts.", "learn": "Para adaptar: articular socios alrededor de pruebas concretas y transferir aprendizajes entre territorios.", "limit": "La fuente relata la experiencia; no implica que todas las soluciones se replicaran ni prueba su efectividad en otro contexto."}, "piloting": {"name": "Helsinki: pilotos de economía compartida", "place": "Finlandia · convocatoria 2022", "url": "https://forumvirium.fi/en/sustainable-sharing-looking-for-solutions-for-housing-companies/", "fact": "Forum Virium propuso pruebas con usuarios reales y co-creación entre ciudad, empresas, residentes e investigación para aprender sobre nuevas soluciones.", "learn": "Para adaptar: definir una pregunta de aprendizaje y compartir resultados con los socios.", "limit": "Esta fuente es una convocatoria y descripción del modelo, no una evaluación de resultados de esos pilotos."}, "evaluation": {"name": "Reino Unido: medición de servicios públicos", "place": "Reino Unido", "url": "https://www.gov.uk/service-manual/measuring-success/measuring-the-success-of-your-service", "fact": "El Service Manual combina métricas con investigación de usuarios y distintas fuentes de datos para revisar el desempeño de un servicio.", "learn": "Para adaptar: seleccionar indicadores según el resultado esperado e incorporar evaluación desde el diseño.", "limit": "Es una guía de práctica gubernamental, no una prueba causal de que un servicio específico haya mejorado."}, "madrid": {"name": "Madrid: seguimiento de presupuestos participativos", "place": "España", "url": "https://decide.madrid.es/mas-informacion/dm/presupuestos", "fact": "Decide Madrid explica fases, evaluación y selección de propuestas, y ofrece seguimiento de proyectos mediante hitos y actualizaciones.", "learn": "Para adaptar: comunicar decisiones y devolver a participantes el avance y estado de sus propuestas.", "limit": "La transparencia del proceso no garantiza ejecución ni satisfacción; esta referencia no acredita los resultados de cada proyecto."}}}, "en": {"pillars": [{"name": "Political support and governance", "questions": ["¿Existe una autoridad patrocinadora que participa en decisiones y desbloquea obstáculos?", "¿Está acordado el mandato, el alcance y quién toma las decisiones?", "¿Hay un área responsable de adoptar las soluciones y recursos comprometidos?"], "why": "Without a mandate and accountable owners, proposals may have no route to adoption.", "owner": "Political sponsor and innovation lead", "actions": ["Relaciona el espacio con una prioridad pública y prepara una propuesta breve con evidencia, alcance y decisión solicitada.", "Reúne a la autoridad y al área responsable; acuerda qué decisiones puede tomar el equipo y cómo escalar bloqueos.", "Documenta responsables, dedicación y recursos iniciales; revisa la forma de formalizarlos con las áreas competentes."], "evidence": "Mandato acordado, patrocinador identificado y responsable de adopción con compromisos explícitos.", "warning": "Inaugurar el espacio antes de asegurar responsabilidades y recursos.", "tools": ["mandato", "raci"], "case": "boston"}, {"name": "Challenge identification", "questions": ["¿El problema está delimitado y respaldado por registros o datos?", "¿Se escuchó a usuarios y personal que presta el servicio?", "¿Se distinguieron las causas del problema de sus síntomas y de una solución preconcebida?"], "why": "Choosing technology before understanding the problem can divert resources to an unsuitable solution.", "owner": "Service owner and research facilitator", "actions": ["Revisa reclamos, tiempos, errores y registros; identifica perfiles de usuarios que podrían estar quedando fuera.", "Realiza una primera ronda exploratoria de entrevistas a usuarios y personal; amplíala si aparecen diferencias relevantes.", "Mapea el recorrido y redacta el desafío: quién enfrenta qué dificultad, dónde ocurre y qué evidencia lo respalda."], "evidence": "Ficha del desafío con usuarios, causas, evidencia y preguntas pendientes.", "warning": "Tratar una ronda pequeña de entrevistas como una muestra estadísticamente representativa.", "tools": ["entrevistas", "recorrido", "desafio"], "case": "nyc"}, {"name": "Team and resources", "questions": ["¿Hay personas con dedicación definida y capacidad para conducir el trabajo?", "¿Están disponibles las capacidades de diseño, datos, operación y soporte jurídico necesarias?", "¿Existe presupuesto para pruebas y continuidad, además de actividades de lanzamiento?"], "why": "Missing allocated time or critical skills limits delivery even when political support exists.", "owner": "Operations, people and budget teams", "actions": ["Lista las capacidades requeridas por la cartera inicial y distingue disponibilidad real de participación nominal.", "Acuerda dedicación semanal, capacidades compartidas y apoyos externos; comienza con un alcance que puedas sostener.", "Presupuesta operación, pruebas, evaluación y mantenimiento; identifica qué recursos aún requieren aprobación."], "evidence": "Matriz de capacidades, dedicaciones acordadas y presupuesto inicial con fuente identificada.", "warning": "Copiar un equipo grande sin considerar la capacidad financiera de la institución.", "tools": ["capacidades", "raci"], "case": "team"}, {"name": "Methods and processes", "questions": ["¿Existen etapas claras desde el problema hasta la adopción?", "¿Hay criterios para priorizar proyectos y decidir si continuar, modificar o detenerlos?", "¿El equipo documenta decisiones y aprendizajes de forma reutilizable?"], "why": "Without a shared process, projects depend on individuals and improvised decisions.", "owner": "Innovation lead and project owners", "actions": ["Dibuja el proceso actual e identifica dónde se traban decisiones, datos o recursos.", "Acuerda etapas simples con entregable, responsable y criterio de revisión; prueba el proceso en un proyecto.", "Mantén un registro de decisiones y aprendizajes; ajusta el método con el equipo al cerrar cada etapa."], "evidence": "Proceso probado con un proyecto y criterios de avance documentados.", "warning": "Añadir controles que consumen más esfuerzo que el aprendizaje que generan.", "tools": ["priorizacion", "desafio", "piloto"], "case": "nyc"}, {"name": "Networks and collaboration", "questions": ["¿Se identificaron actores según las capacidades que necesita el desafío?", "¿Cada aliado tiene una contribución y un responsable definidos?", "¿Hay una agenda compartida con proyectos y reglas de coordinación?"], "why": "Contacts and events do not guarantee collaboration or shared outcomes.", "owner": "Ecosystem coordinator and partner contacts", "actions": ["Mapea actores con sus intereses, capacidades y contribuciones potenciales; identifica quién falta.", "Convoca una sesión de trabajo sobre un desafío concreto y acuerda una primera contribución por actor.", "Formaliza una agenda manejable, responsables y revisión periódica de compromisos."], "evidence": "Mapa de actores y primer proyecto con contribuciones y responsables acordados.", "warning": "Confundir adhesión a una red con recursos o participación efectiva.", "tools": ["actores", "raci"], "case": "helsinki"}, {"name": "Experimentation and pilots", "questions": ["¿Cada piloto tiene una hipótesis y una incertidumbre concreta que resolver?", "¿Se definieron usuarios, duración, riesgos y datos antes de probar?", "¿Hay criterios previos para continuar, modificar o detener la prueba?"], "why": "Testing without criteria generates activity but little evidence for decisions.", "owner": "Pilot lead, service owner and evaluator", "actions": ["Selecciona la incertidumbre más importante y diseña la prueba más pequeña que permita aprender sobre ella.", "Prepara un prototipo y protocolo con usuarios, datos, riesgos y responsables; revisa las condiciones aplicables con el equipo competente.", "Acuerda una revisión al finalizar: qué aprendimos, qué cambió y qué decisión permite la evidencia."], "evidence": "Protocolo de prueba y registro de aprendizajes con una decisión justificada.", "warning": "Interpretar el entusiasmo inicial como evidencia suficiente de efectividad.", "tools": ["piloto", "indicadores"], "case": "piloting"}, {"name": "Adoption and scaling", "questions": ["¿Hay un área que asumirá la operación si la solución funciona?", "¿Se previeron mantenimiento, formación, financiamiento y la vía institucional de adopción?", "¿Se documentó qué debe adaptarse antes de ampliar o replicar la solución?"], "why": "Continuity depends on capabilities and responsibilities that a pilot alone does not create.", "owner": "Service owner, operations and budget teams", "actions": ["Involucra desde el inicio al área que operará la solución y acuerda sus condiciones de aceptación.", "Estima costos recurrentes, mantenimiento, capacitación y dependencias; revisa con las áreas competentes la vía de adopción.", "Prueba una ampliación gradual y documenta qué cambia entre contextos antes de replicar."], "evidence": "Plan de adopción con responsable, costos recurrentes y decisión institucional pendiente o acordada.", "warning": "Prometer compra o expansión automática por el solo hecho de concluir un piloto.", "tools": ["adopcion", "capacidades"], "case": "boston"}, {"name": "Evaluation and public value", "questions": ["¿Existe una línea de base y un resultado esperado para las personas?", "¿Los indicadores tienen fuente, frecuencia y responsable definidos?", "¿Se distinguió actividad, resultado e impacto y se revisaron otras causas posibles del cambio?"], "why": "Counting events or prototypes does not establish whether a service improved.", "owner": "Evaluation, data and service teams", "actions": ["Explica la relación entre intervención y resultado; identifica supuestos y efectos no deseados.", "Reúne la línea de base y define pocos indicadores relevantes, combinando datos y experiencia de usuarios.", "Elige una evaluación proporcional al riesgo y costo; documenta límites y conecta resultados con decisiones."], "evidence": "Teoría de cambio y ficha de indicadores con línea de base o un plan para obtenerla.", "warning": "Atribuir una mejora al proyecto sin revisar cambios externos o diferencias entre usuarios.", "tools": ["cambio", "indicadores"], "case": "evaluation"}, {"name": "Communication and legitimacy", "questions": ["¿Están definidos públicos, mensajes y acciones esperadas de cada uno?", "¿Existe un calendario con canales, responsables y devolución a participantes?", "¿Los mensajes se respaldan en evidencia e incluyen dificultades y aprendizajes?"], "why": "Communication supports understanding, participation and continuity when claims are backed by evidence.", "owner": "Communications, project lead and participation team", "actions": ["Identifica qué necesitan saber y hacer autoridades, funcionarios, usuarios y aliados; diferencia sus mensajes.", "Diseña un calendario que combine canales internos, redes sociales, prensa local y medios masivos cuando sean pertinentes.", "Publica avances con evidencia y devuelve a participantes qué se incorporó, qué no y por qué."], "evidence": "Plan de comunicación y primera devolución publicada con resultados y pendientes verificables.", "warning": "Prometer impacto antes de evaluarlo o medir legitimidad únicamente por alcance en redes.", "tools": ["comunicacion", "actores"], "case": "madrid"}], "tools": [{"id": "mandato", "name": "Purpose, mandate and sponsorship worksheet", "method": "Institutional design", "duration": "60-90 minutes", "people": "Political sponsor, operational lead and service owner", "purpose": "Prepare an institutional decision on purpose, scope, responsibilities and resources.", "steps": ["Define the public need and provide evidence.", "Agree the intended outcome and initial scope.", "Identify the sponsor and those accountable for decisions and adoption.", "Agree resources and the requested decision; record unresolved issues."], "fields": ["Problem, affected people and evidence", "Intended outcome and scope", "Sponsor, decisions and responsibilities", "Resources, commitments and requested decision"], "example": "Business permits: reduce repeat visits. Request: allocate a shared team and designate the permits department as the adoption owner.", "next": "Present the worksheet to the sponsor and record agreed commitments.", "stage": "govern"}, {"id": "raci", "name": "Responsibilities and decisions matrix", "method": "Project management", "duration": "45-60 minutes", "people": "Innovation lead, service owner and support departments", "purpose": "Clarify who does the work, who is accountable for decisions, and who must be consulted or informed.", "steps": ["List critical decisions and deliverables.", "Assign who performs the work (R) and who is accountable (A).", "Identify those consulted (C) and informed (I).", "Check for gaps and agree how to resolve blockers."], "fields": ["Decision or deliverable", "R: responsible / A: accountable", "C: consulted / I: informed", "Blockers, resolution mechanism and review"], "example": "Service pilot: R, project team; A, service director; C, legal and technology teams; I, political sponsor.", "next": "Confirm responsibilities with the named people. The matrix does not replace their formal powers.", "stage": "govern"}, {"id": "entrevistas", "name": "Exploratory interview guide", "method": "Human-centred design", "duration": "30-45 minutes per interview", "people": "Facilitator and service users or frontline staff", "purpose": "Understand real situations, obstacles and needs without leading the interviewee.", "steps": ["Include diverse profiles and explain the purpose and use of information.", "Ask about the last specific experience: what they tried to do and what happened.", "Explore difficulties, support and consequences.", "Separate observations from interpretations; review patterns and differences."], "fields": ["Profile and context, without unnecessary identifiers", "Last experience: steps and difficulties", "Needs, support and consequences", "Findings, differences and unanswered questions"], "example": "Ask: tell me about the last time you applied for this permit. Avoid: would you like an app to solve this?", "next": "Include missing profiles and use the findings to build a user journey map.", "stage": "understand"}, {"id": "recorrido", "name": "User journey map", "method": "Service design", "duration": "60-90 minutes", "people": "Users, frontline staff and service owner", "purpose": "Locate obstacles throughout a service, across physical and digital channels.", "steps": ["Define a user profile and a specific situation.", "Map what happens before, during and after the service.", "Record channels, waiting, difficulties and evidence.", "Select improvement opportunities and validate the map with users."], "fields": ["User, objective and situation", "Before: steps, channels and obstacles", "During: steps, channels and obstacles", "After: outcome, difficulties and opportunities"], "example": "Someone checks requirements online, visits the office and learns a document is missing. The obstacle may lie in the information provided beforehand.", "next": "Frame the challenge around obstacles supported by evidence.", "stage": "understand"}, {"id": "desafio", "name": "Challenge framing and design questions", "method": "Design thinking and problem analysis", "duration": "60 minutes", "people": "Project team, users and service owner", "purpose": "Turn observations into a bounded problem and a question open to different solutions.", "steps": ["Summarise evidence and affected users.", "Distinguish causes, symptoms and assumptions.", "Write a question: how might we enable X for Y, considering Z?", "Define scope, constraints and remaining research needs."], "fields": ["Problem, users and evidence", "Causes, symptoms and assumptions", "How might we...?", "Scope, constraints and missing evidence"], "example": "How might we help new business owners understand permit requirements before their first office visit?", "next": "Explore alternatives without building a particular technology into the question.", "stage": "understand"}, {"id": "capacidades", "name": "Capabilities and resources matrix", "method": "Operational planning", "duration": "60-90 minutes", "people": "Operations, people, budget and support teams", "purpose": "Match scope to actual capacity and plan how to address gaps.", "steps": ["List initial portfolio tasks and required capabilities.", "Record real availability and allocated time.", "Distinguish internal, shared and external resources.", "Agree actions, costs and necessary approvals."], "fields": ["Task and required capability", "Available person or team and allocated time", "Gap and how to address it", "Cost, funding source, approval and owner"], "example": "Design: internal, part-time. Legal: shared support. Evaluation: university support still to be agreed.", "next": "Reduce the portfolio if critical gaps have neither an owner nor resources.", "stage": "govern"}, {"id": "priorizacion", "name": "Challenge prioritisation matrix", "method": "Portfolio management", "duration": "60 minutes", "people": "Innovation lead, service departments and sponsor", "purpose": "Select a manageable portfolio with explicit criteria and justified decisions.", "steps": ["Agree criteria before comparing projects.", "Review relevance, evidence, feasibility, risk and the adoption owner.", "Compare options with justified assessments and record disagreements.", "Select within available capacity and revisit decisions as evidence changes."], "fields": ["Challenge and available evidence", "Relevance to users and intended outcome", "Feasibility, risk and adoption owner", "Decision, rationale and review conditions"], "example": "A frequent procedure with a committed service owner may be a better starting point than a visible technology without a clearly defined problem.", "next": "Create challenge worksheets and assign an owner to each selected project.", "stage": "design"}, {"id": "actores", "name": "Stakeholder and contributions map", "method": "Innovation ecosystem development", "duration": "60-90 minutes", "people": "Relevant government, business, university and civil society actors", "purpose": "Connect interests and capabilities to concrete commitments around a challenge.", "steps": ["Define the shared challenge or purpose.", "Identify actors, interests and capabilities, including absent stakeholders.", "Record possible contributions and dependencies.", "Agree a first action and a contact responsible for each actor."], "fields": ["Actor, interest and relationship to the challenge", "Capability or potential contribution", "Commitment, owner and next step", "Missing actors, conflicts and coordination"], "example": "University: evaluation; municipality: access to the service; company: prototype; residents: lived experience and testing. Each contribution needs an agreement.", "next": "Agree a shared agenda and review actual contributions.", "stage": "govern"}, {"id": "piloto", "name": "Prototype and experimentation protocol", "method": "Public-sector prototyping and experimentation", "duration": "90 minutes of preparation", "people": "Team, users, service owner and relevant support staff", "purpose": "Design a limited test that addresses uncertainty and supports a decision.", "steps": ["Define the hypothesis and what could show it is wrong.", "Choose a simple prototype: script, form, mock-up or simulation.", "Agree users, data, duration, risks and testing conditions.", "Set criteria to continue, change or stop; document learning."], "fields": ["Hypothesis and uncertainty", "Prototype, users and procedure", "Data, duration, risks and responsibilities", "Decision criteria and learning"], "example": "Testing a guidance script and paper form can reveal problems before a platform is developed.", "next": "Review evidence and safeguards. A test does not automatically justify expansion.", "stage": "test"}, {"id": "adopcion", "name": "Adoption and continuity plan", "method": "Implementation and sustainability", "duration": "90 minutes", "people": "Service owner, operations, budget and support teams", "purpose": "Prepare the transition from a tested solution to normal service operation.", "steps": ["Review evidence and acceptance conditions.", "Assign who will operate, maintain and fund the solution.", "Plan training, transition and institutional dependencies.", "Define gradual expansion and an outcome review."], "fields": ["Pilot findings and acceptance conditions", "Operation, maintenance and responsibilities", "Recurring costs, resources and pending decisions", "Transition, training and review"], "example": "The service unit adopts the procedure, trains staff and takes responsibility for a monthly outcome review.", "next": "Confirm resources and the adoption route before committing to expansion dates.", "stage": "adopt"}, {"id": "cambio", "name": "Practical theory of change", "method": "Evaluation and planning", "duration": "60-90 minutes", "people": "Team, service owner and evaluation staff", "purpose": "Explain how an intervention could create public value and which assumptions must hold.", "steps": ["Define the intended change for people.", "Connect resources, activities, outputs and outcomes.", "Make assumptions and unintended effects explicit.", "Identify evidence that could challenge the explanation."], "fields": ["Problem and intended change for people", "Resources, activities and outputs", "Outcomes and causal assumptions", "Unintended effects and required evidence"], "example": "Clear information may reduce repeat visits if requirements remain stable and users can access the information.", "next": "Turn outcomes into indicators and evaluate assumptions.", "stage": "design"}, {"id": "indicadores", "name": "Indicators and baseline worksheet", "method": "Measurement and learning", "duration": "60 minutes", "people": "Service, data and evaluation teams", "purpose": "Measure relevant changes and identify who will obtain and use the evidence.", "steps": ["Select relevant outcomes, including accessibility and possible adverse effects.", "Define the indicator, calculation, source, frequency and owner.", "Obtain the baseline or document how it will be gathered.", "Define decisions and attribution limits; combine data with user experience."], "fields": ["Outcome, indicator and calculation", "Source, frequency and owner", "Baseline, date and data quality", "Decision, alternative explanations and limits"], "example": "Repeat visits per application: compare equivalent periods and check changes in requirements or user profiles.", "next": "Review indicators at each decision point; avoid measuring activity alone.", "stage": "evaluate"}, {"id": "comunicacion", "name": "Communication and feedback plan", "method": "Strategic communication and participation", "duration": "60-90 minutes", "people": "Communication, project, participation and service teams", "purpose": "Define what audiences need to understand and do, and how to communicate verified findings.", "steps": ["Identify audiences and the expected action for each.", "Write evidence-backed messages without promising unevaluated outcomes.", "Choose internal channels, local or mass media, social media and meetings according to access.", "Agree milestones, owners and feedback to participants."], "fields": ["Audience, information need and expected action", "Message, evidence and limits", "Channel, milestone, date and owner", "Feedback, understanding and participation to observe"], "example": "Residents: how to participate and what changed. Staff: what was decided and how to apply it. Authorities: findings, outstanding issues and resources needed.", "next": "Provide feedback and check understanding and participation as well as reach.", "stage": "adopt"}, {"id": "supuestos", "stage": "understand", "method": "Gobierno Habilitador", "name": "Critical assumptions map", "purpose": "Identify what must hold true for a proposal to work and which claims lack supporting evidence.", "duration": "45–60 min", "people": "Service owner, technical team and frontline staff.", "steps": ["Write testable claims about users, operations, resources and authorisations. Separate aspirations from facts.", "Record evidence and the consequence of each claim being false. Classify by consequence and available support.", "Select one high-consequence claim with limited evidence. Specify the population, observable behaviour and context.", "Define what observation would change your mind and take that assumption to the experiment selector."], "example": "A municipality assumes older people can book an appointment by phone without help. Before buying a platform, it identifies hearing, access and comprehension barriers to investigate.", "fields": ["Assumption and affected population", "Available evidence and source", "Consequence of being wrong", "What to observe and which decision would change"], "next": "Test uncertainty that can change the decision first; team opinion is not evidence of citizen experience."}, {"id": "alternativas", "stage": "design", "method": "Gobierno Habilitador", "name": "Solution alternatives workshop", "purpose": "Generate different responses before committing to a technology or supplier.", "duration": "60–90 min", "people": "Service team, invited users and implementing departments.", "steps": ["Present a bounded problem and its supporting evidence. Identify one practice the team treats as fixed.", "Individually propose options in four areas: removing steps, changing coordination, improving information and using technology.", "Compare options against user needs, institutional powers and effort. Include the current service as a reference.", "Choose two alternatives to explore and state what you must learn before preferring either."], "example": "To reduce repeat visits, a municipality compares a clear requirements checklist, telephone pre-checks and a digital form. It does not assume an app is the best answer.", "fields": ["Problem and evidence", "Alternatives considered", "Benefits, constraints and excluded users", "Options to test and learning question"], "next": "Turn selected options into simple prototypes and observe use before investing."}, {"id": "usabilidad", "stage": "test", "method": "Gobierno Habilitador", "name": "Prototype usability test", "purpose": "Observe whether people understand a proposal and can complete specific tasks.", "duration": "Preparation: half a day; sessions: 30–45 min", "people": "Facilitator, observer and participants with varied usage contexts.", "steps": ["Prepare a paper or digital prototype and two realistic tasks. Recruit relevant profiles, including accessibility needs.", "Explain that the design is being tested and obtain consent. Use fictional data. Do not present the prototype as an available service.", "Ask people to complete tasks without coaching. Record obstacles, assistance and completion, separating observations from interpretation.", "Group difficulties by severity. Revise and run another round; an exploratory sample does not represent the entire population."], "example": "An office tests a business permit form with entrepreneurs with different digital experience. It observes misunderstood requirements and revises the wording before development.", "fields": ["Profile, context and tasks", "Observations: task, obstacle and assistance", "Proposed changes and owner", "What to retest and advancement criterion"], "next": "Proceed when relevant barriers are resolved in further observations; satisfaction alone does not demonstrate service impact."}, {"id": "simulacion", "stage": "test", "method": "Gobierno Habilitador", "name": "Service simulation", "purpose": "Rehearse internal coordination and exceptional cases before serving people in a live pilot.", "duration": "90–120 min", "people": "Frontline, operations, technology, service owner and relevant advisers.", "steps": ["Map user-facing steps and the internal tasks supporting them. Assign decision and execution responsibilities.", "Walk through a standard case using fictional records, noting handovers and delays.", "Repeat with difficult cases: incomplete information, system outage, support needs or an absent owner.", "Record failures, continuity measures and a person accountable for each blocker before field testing."], "example": "A municipality rehearses a WhatsApp request requiring inspection and payment. It discovers nobody confirms closure to the resident and assigns that step.", "fields": ["Steps and owners", "Standard and exceptional cases", "Failures and continuity measures", "Agreements, owners and retest date"], "next": "Rehearse critical steps again. Simulation checks coordination but does not replace observing real users."}, {"id": "factibilidad", "stage": "test", "method": "Gobierno Habilitador", "name": "Technical feasibility test", "purpose": "Check a bounded technical uncertainty before integrating a solution into a service.", "duration": "1–5 days depending on the test", "people": "Technical owner, operations, data and security leads.", "steps": ["Define one uncertainty: accuracy, integration, stability or capacity. Specify the environment and acceptable threshold before measurement.", "Prepare synthetic or authorised data in an environment separate from production. Agree permissions, access and deletion.", "Run normal and edge cases; record errors, timing, configuration and reproducible conditions.", "Document threshold achievement, exclusions and the cost of resolving limitations. Review with operations before proceeding."], "example": "A team tests whether a classifier can route municipal requests. It uses authorised de-identified cases and examines errors that could delay priority services.", "fields": ["Uncertainty and agreed threshold", "Environment, data and authorisations", "Results, errors and limitations", "Technical decision and next test"], "next": "A laboratory result does not demonstrate operational capacity, citizen acceptance or permission to deploy."}, {"id": "comparacion", "stage": "evaluate", "method": "Gobierno Habilitador", "name": "Outcome comparison design", "purpose": "Plan how to distinguish observed changes from effects attributable to an intervention.", "duration": "Initial workshop: 90 min; study duration depends on design", "people": "Evaluation lead, service team, data staff and ethics advisers when relevant.", "steps": ["Define the main outcome, analysis unit, population, period and baseline. Explain which decision needs causal evidence.", "With specialist support, consider a comparable group or random assignment when appropriate and permissible. Do not remove essential services.", "Estimate required size and duration, contamination, attrition and external factors; record the plan before viewing results.", "Compare results and uncertainty. With before-and-after data alone, report change and alternative explanations without claiming causality."], "example": "An office wants to know if reminders reduce missed appointments. Its evaluation team designs an admissible comparison and considers seasonality and user differences before interpreting results.", "fields": ["Outcome, population and baseline", "Proposed comparison and assumptions", "Size, duration, risks and authorisations", "Analysis and limits of conclusions"], "next": "Obtain evaluation review before execution; this worksheet structures discussion rather than calculating statistical validity."}, {"id": "aprendizaje", "stage": "evaluate", "method": "Gobierno Habilitador", "name": "Pilot learning log", "purpose": "Turn observations and adjustments into traceable decisions during implementation.", "duration": "20 min per weekly review", "people": "Pilot owner, operations and evidence collector.", "steps": ["Record this week’s expected observation and the related hypothesis.", "Note the result, date, source and limitations. Separate anecdotes from repeated patterns.", "Explain what changed in your interpretation and agree to retain, modify or stop part of the test.", "Assign an owner, date and signal to check the adjustment. Retain the previous protocol version."], "example": "During an appointment pilot, calls decrease but office enquiries increase. The team checks whether workload shifted channels before celebrating an isolated reduction.", "fields": ["Expectation and hypothesis", "Observation, source and limitations", "Learning and agreed adjustment", "Owner, date and next check"], "next": "Use the log at closure to explain why the pilot changed and what the institution learned."}, {"id": "evaluacion", "stage": "evaluate", "method": "Gobierno Habilitador", "name": "Pilot closure review", "purpose": "Assess relevance, effectiveness, efficiency, sustainability and early impact signals with explicit evidence.", "duration": "90–120 min with evidence prepared", "people": "Pilot owner, operations, evaluation, finance and political sponsor.", "steps": ["Gather objectives, hypotheses, protocol, indicators, costs and learning log. Declare missing data before judging performance.", "Review the five criteria. Support each judgement with evidence, its scope and an alternative explanation. Missing data is not failure.", "Separate service results from institutional learning. A refuted hypothesis can inform a useful decision; spending the budget does not prove efficiency.", "Agree to continue, adjust, stop or prepare adoption. Record decision authority, outstanding conditions and communication to users and leaders."], "example": "A pilot improves service but depends on one person without backup or an operating budget. The team proposes resolving continuity before expanding coverage.", "fields": ["Criteria: judgement, evidence and limitations", "Learning, costs and unintended effects", "Proposed decision and outstanding conditions", "Owner, deadline and public feedback"], "next": "Use the guided evaluation to structure closure; adoption requires an institutional decision and confirmed resources."}, {"id": "portafolio", "stage": "adopt", "method": "Gobierno Habilitador", "name": "Public innovation portfolio map", "purpose": "Organise initiatives by public outcome, stage, evidence and resource demand to focus effort.", "duration": "90 min", "people": "Leadership, project owners, planning and budget teams.", "steps": ["List active initiatives and connect each to a public outcome and an accountable department.", "Record stage, committed spending, required capacity, evidence and next decision. Flag obligations and dependencies.", "Find duplication, unowned projects and trials without adoption routes. Compare commitments with actual capacity.", "Agree what to retain, combine, reshape or close, recording reasons and the next review. Popularity is not a substitute for public value."], "example": "A government finds five digital pilots competing for one data team. It sequences delivery and combines two addressing the same citizen problem.", "fields": ["Initiatives and public outcomes", "Stage, owner, evidence and resources", "Dependencies and capacity conflicts", "Decisions and review date"], "next": "Update the map at management reviews; decisions should account for obligations, equity and operational capacity."}], "cases": {"boston": {"name": "Boston: Mayor’s Office of New Urban Mechanics", "place": "United States", "fact": "MONUM works from the mayor’s office with departments and communities. Project selection considers the problem, feasibility, impact and departmental adoption.", "learn": "Adaptation: connect political sponsorship to the department that will adopt the solution.", "limit": "The source describes organisation and criteria; it does not prove the model suits every municipality.", "url": "https://www.boston.gov/departments/new-urban-mechanics"}, "nyc": {"name": "New York: Service Design Studio", "place": "United States", "fact": "The Studio works with agencies to understand users and staff and test prototypes before scaling. It offers office hours and project support.", "learn": "Adaptation: begin with research and prototypes and share capabilities across departments.", "limit": "The source documents the service and approach, not a causal impact estimate of all its activity.", "url": "https://www.nyc.gov/site/opportunity/portfolio/service-design-studio.page"}, "team": {"name": "United Kingdom: Service Standard teams", "place": "United Kingdom", "fact": "The standard calls for multidisciplinary capabilities, decision-maker participation and access to specialist expertise, including legal and policy advice.", "learn": "Adaptation: define capabilities by project stage and share specialists when feasible.", "limit": "This documented institutional practice must be adapted to local resources and powers.", "url": "https://www.gov.uk/service-manual/service-standard/point-6-have-a-multidisciplinary-team"}, "helsinki": {"name": "Helsinki: Smart Kalasatama", "place": "Finland · 2013-2021", "fact": "Kalasatama developed urban experimentation and collaboration among operators, institutions and residents. Its final report describes learning transferred to Helsinki Innovation Districts.", "learn": "Adaptation: organise partners around concrete tests and transfer learning across places.", "limit": "The account does not imply every solution was replicated or establish effectiveness elsewhere.", "url": "https://forumvirium.fi/en/publication/smartkalasatama-final-report/"}, "piloting": {"name": "Helsinki: sharing-economy pilots", "place": "Finland · 2022 call", "fact": "Forum Virium proposed real-user testing and co-creation among the city, companies, residents and researchers to learn about new solutions.", "learn": "Adaptation: define a learning question and share findings with partners.", "limit": "The source is a call and model description, not an outcome evaluation of those pilots.", "url": "https://forumvirium.fi/en/sustainable-sharing-looking-for-solutions-for-housing-companies/"}, "evaluation": {"name": "United Kingdom: measuring public services", "place": "United Kingdom", "fact": "The Service Manual combines metrics, user research and multiple data sources to review service performance.", "learn": "Adaptation: choose indicators for intended outcomes and include evaluation from the design stage.", "limit": "It is government practice guidance, not causal proof that a particular service improved.", "url": "https://www.gov.uk/service-manual/measuring-success/measuring-the-success-of-your-service"}, "madrid": {"name": "Madrid: participatory-budget monitoring", "place": "Spain", "fact": "Decide Madrid explains proposal stages, evaluation and selection, and provides project tracking through milestones and updates.", "learn": "Adaptation: communicate decisions and return progress and status information to participants.", "limit": "Process transparency does not guarantee implementation or satisfaction; the reference does not establish each project’s outcomes.", "url": "https://decide.madrid.es/mas-informacion/dm/presupuestos"}}}, "actions": {"es": [[{"title": "Acordar un mandato y una autoridad patrocinadora", "dimension": "Política e institucional", "how": "Prepara una página con la necesidad pública, el alcance del espacio y las decisiones que necesitas. Solicita una reunión con la autoridad y la jefatura responsable del servicio. Distingue quién autoriza, quién ejecuta y cómo se resolverán bloqueos; pide compromisos verificables, no solo una declaración de apoyo.", "example": "Un municipio quiere mejorar permisos comerciales. La autoridad acuerda que el equipo puede convocar a las áreas involucradas, designa una jefatura patrocinadora y establece dónde resolver desacuerdos.", "output": "Mandato con alcance, patrocinador y decisiones autorizadas.", "owner": "Autoridad patrocinadora y jefatura del área responsable", "tool": "mandato", "gate": "Existe un responsable identificado y el alcance fue confirmado por quienes deciden."}, {"title": "Sustentar el encargo con evidencia del problema", "dimension": "Evidencia", "how": "Revisa reclamos, tiempos de atención y prioridades institucionales. Conversa con personal y usuarios para contrastar lo registrado. Resume qué dificultad existe, a quién afecta y qué todavía no sabes; evita justificar una nueva estructura únicamente porque otras ciudades tienen un laboratorio.", "example": "Los registros muestran visitas repetidas para un permiso. El equipo identifica requisitos confusos y contrasta esa explicación con funcionarios y solicitantes antes de proponer una intervención.", "output": "Ficha del desafío con fuentes y preguntas pendientes.", "owner": "Responsable del servicio y equipo de análisis", "tool": "desafio", "gate": "Puedes explicar la necesidad pública y distinguir datos de supuestos."}, {"title": "Traducir el mandato en reglas de trabajo", "dimension": "Técnica", "how": "Completa una matriz de responsabilidades para priorización, pruebas, presupuesto y adopción. Define una reunión de coordinación y un registro simple de decisiones. Revisa la formalización con el área competente según el contexto; la matriz no sustituye las atribuciones legales de cada unidad.", "example": "El laboratorio facilita el diseño; la dirección de atención decide sobre el servicio; presupuesto revisa recursos y jurídica examina la vía institucional. Cada decisión tiene un responsable.", "output": "Matriz de responsabilidades y mecanismo para resolver bloqueos.", "owner": "Coordinación del espacio y áreas competentes", "tool": "raci", "gate": "No quedan decisiones críticas sin responsable o vía de resolución."}, {"title": "Explicar el mandato y activar la colaboración interna", "dimension": "Comunicación", "how": "Redacta un mensaje breve que explique para qué existe el espacio, qué puede hacer y cómo solicitar su apoyo. Valídalo con la autoridad y compártelo con las jefaturas antes de una difusión amplia. Incluye un canal de contacto y una invitación concreta; revisa si los equipos comprenden su papel.", "example": "Una comunicación interna invita a cada dirección a proponer un desafío con responsable y evidencia. La presentación pública explica el propósito sin prometer resultados que todavía no existen.", "output": "Mensaje aprobado, públicos definidos y canal de contacto operativo.", "owner": "Coordinación y equipo de comunicaciones", "tool": "comunicacion", "gate": "Las áreas convocadas saben qué se espera de ellas y dónde acudir."}], [{"title": "Conseguir acceso al servicio y a sus responsables", "dimension": "Política e institucional", "how": "Acuerda con la jefatura del servicio qué problema investigar y qué personal puede participar. Solicita tiempo para entrevistas y acceso a registros por las vías autorizadas. Aclara quién validará el desafío y qué decisiones podrá tomar el equipo una vez termine la investigación.", "example": "Atención ciudadana autoriza observar el proceso de orientación, designa un enlace y acuerda revisar la ficha del problema antes de desarrollar soluciones.", "output": "Acuerdo de investigación con alcance, enlace y validación.", "owner": "Jefatura del servicio y coordinación del proyecto", "tool": "raci", "gate": "Hay acceso y participación acordados, con los resguardos que correspondan."}, {"title": "Escuchar a usuarios y contrastar los registros", "dimension": "Evidencia", "how": "Reúne datos de reclamos, demoras y errores. Usa entrevistas exploratorias para conocer situaciones diferentes, incluyendo personas con dificultades de acceso. Pregunta por experiencias concretas; registra hallazgos sin datos personales innecesarios. Amplía la escucha si aparecen diferencias que la primera ronda no explica.", "example": "El registro indica solicitudes incompletas. Las entrevistas muestran que algunas personas no comprenden la lista de requisitos y otras no pueden acceder al canal digital. Son causas que requieren respuestas distintas.", "output": "Síntesis de hallazgos, fuentes y limitaciones de la escucha.", "owner": "Equipo de diseño y personal del servicio", "tool": "entrevistas", "gate": "El problema se sostiene en más de una fuente y recoge experiencias diversas."}, {"title": "Definir un desafío abordable antes de elegir soluciones", "dimension": "Técnica", "how": "Mapea los pasos del servicio con el personal y los usuarios. Identifica dónde ocurre la dificultad y formula quién necesita qué mejora y por qué. Compara alcance, factibilidad y compromiso del área responsable; evita convertir una aplicación o plataforma en el problema a resolver.", "example": "En lugar de “necesitamos una app”, el desafío queda como “¿cómo facilitar que los solicitantes comprendan los requisitos antes de acudir a la oficina?”.", "output": "Ficha del desafío y recorrido con causas por explorar.", "owner": "Equipo de diseño y responsable del servicio", "tool": "recorrido", "gate": "El desafío es específico y no presupone una única solución."}, {"title": "Convocar a la escucha y devolver lo aprendido", "dimension": "Comunicación", "how": "Explica a usuarios y funcionarios
