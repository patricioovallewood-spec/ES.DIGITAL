const DATA={"es":{"pillars":[{"name":"Apoyo político y gobernanza","questions":["¿Existe una autoridad patrocinadora que participa en decisiones y desbloquea obstáculos?","¿Está acordado el mandato, el alcance y quién toma las decisiones?","¿Hay un área responsable de adoptar las soluciones y recursos comprometidos?"],"why":"Sin mandato y responsables, el equipo puede generar propuestas que nadie tenga capacidad de adoptar.","owner":"Autoridad patrocinadora y responsable de innovación","actions":["Relaciona el espacio con una prioridad pública y prepara una propuesta breve con evidencia, alcance y decisión solicitada.","Reúne a la autoridad y al área responsable; acuerda qué decisiones puede tomar el equipo y cómo escalar bloqueos.","Documenta responsables, dedicación y recursos iniciales; revisa la forma de formalizarlos con las áreas competentes."],"evidence":"Mandato acordado, patrocinador identificado y responsable de adopción con compromisos explícitos.","warning":"Inaugurar el espacio antes de asegurar responsabilidades y recursos.","tools":["mandato","raci"],"case":"boston"},{"name":"Identificación de desafíos","questions":["¿El problema está delimitado y respaldado por registros o datos?","¿Se escuchó a usuarios y personal que presta el servicio?","¿Se distinguieron las causas del problema de sus síntomas y de una solución preconcebida?"],"why":"Elegir tecnología antes de comprender el problema puede desplazar recursos hacia una solución poco pertinente.","owner":"Responsable del servicio y facilitador de investigación","actions":["Revisa reclamos, tiempos, errores y registros; identifica perfiles de usuarios que podrían estar quedando fuera.","Realiza una primera ronda exploratoria de entrevistas a usuarios y personal; amplíala si aparecen diferencias relevantes.","Mapea el recorrido y redacta el desafío: quién enfrenta qué dificultad, dónde ocurre y qué evidencia lo respalda."],"evidence":"Ficha del desafío con usuarios, causas, evidencia y preguntas pendientes.","warning":"Tratar una ronda pequeña de entrevistas como una muestra estadísticamente representativa.","tools":["entrevistas","recorrido","desafio"],"case":"nyc"},{"name":"Equipo y recursos","questions":["¿Hay personas con dedicación definida y capacidad para conducir el trabajo?","¿Están disponibles las capacidades de diseño, datos, operación y soporte jurídico necesarias?","¿Existe presupuesto para pruebas y continuidad, además de actividades de lanzamiento?"],"why":"La falta de dedicación o de capacidades críticas limita la implementación incluso cuando existe respaldo.","owner":"Dirección operativa, personas y presupuesto","actions":["Lista las capacidades requeridas por la cartera inicial y distingue disponibilidad real de participación nominal.","Acuerda dedicación semanal, capacidades compartidas y apoyos externos; comienza con un alcance que puedas sostener.","Presupuesta operación, pruebas, evaluación y mantenimiento; identifica qué recursos aún requieren aprobación."],"evidence":"Matriz de capacidades, dedicaciones acordadas y presupuesto inicial con fuente identificada.","warning":"Copiar un equipo grande sin considerar la capacidad financiera de la institución.","tools":["capacidades","raci"],"case":"team"},{"name":"Método y procesos","questions":["¿Existen etapas claras desde el problema hasta la adopción?","¿Hay criterios para priorizar proyectos y decidir si continuar, modificar o detenerlos?","¿El equipo documenta decisiones y aprendizajes de forma reutilizable?"],"why":"Sin un proceso compartido, cada proyecto depende de personas y decisiones improvisadas.","owner":"Responsable de innovación y líderes de proyectos","actions":["Dibuja el proceso actual e identifica dónde se traban decisiones, datos o recursos.","Acuerda etapas simples con entregable, responsable y criterio de revisión; prueba el proceso en un proyecto.","Mantén un registro de decisiones y aprendizajes; ajusta el método con el equipo al cerrar cada etapa."],"evidence":"Proceso probado con un proyecto y criterios de avance documentados.","warning":"Añadir controles que consumen más esfuerzo que el aprendizaje que generan.","tools":["priorizacion","desafio","piloto"],"case":"nyc"},{"name":"Redes y colaboración","questions":["¿Se identificaron actores según las capacidades que necesita el desafío?","¿Cada aliado tiene una contribución y un responsable definidos?","¿Hay una agenda compartida con proyectos y reglas de coordinación?"],"why":"Una lista de contactos o eventos no asegura colaboración ni resultados compartidos.","owner":"Coordinador del ecosistema y responsables de aliados","actions":["Mapea actores con sus intereses, capacidades y contribuciones potenciales; identifica quién falta.","Convoca una sesión de trabajo sobre un desafío concreto y acuerda una primera contribución por actor.","Formaliza una agenda manejable, responsables y revisión periódica de compromisos."],"evidence":"Mapa de actores y primer proyecto con contribuciones y responsables acordados.","warning":"Confundir adhesión a una red con recursos o participación efectiva.","tools":["actores","raci"],"case":"helsinki"},{"name":"Experimentación y pilotos","questions":["¿Cada piloto tiene una hipótesis y una incertidumbre concreta que resolver?","¿Se definieron usuarios, duración, riesgos y datos antes de probar?","¿Hay criterios previos para continuar, modificar o detener la prueba?"],"why":"Probar sin criterios genera actividades, pero poca evidencia útil para decidir.","owner":"Líder del piloto, área responsable y evaluador","actions":["Selecciona la incertidumbre más importante y diseña la prueba más pequeña que permita aprender sobre ella.","Prepara un prototipo y protocolo con usuarios, datos, riesgos y responsables; revisa las condiciones aplicables con el equipo competente.","Acuerda una revisión al finalizar: qué aprendimos, qué cambió y qué decisión permite la evidencia."],"evidence":"Protocolo de prueba y registro de aprendizajes con una decisión justificada.","warning":"Interpretar el entusiasmo inicial como evidencia suficiente de efectividad.","tools":["piloto","indicadores"],"case":"piloting"},{"name":"Adopción y escalamiento","questions":["¿Hay un área que asumirá la operación si la solución funciona?","¿Se previeron mantenimiento, formación, financiamiento y la vía institucional de adopción?","¿Se documentó qué debe adaptarse antes de ampliar o replicar la solución?"],"why":"La continuidad depende de capacidades y responsabilidades que un piloto por sí solo no crea.","owner":"Responsable del servicio, operación y presupuesto","actions":["Involucra desde el inicio al área que operará la solución y acuerda sus condiciones de aceptación.","Estima costos recurrentes, mantenimiento, capacitación y dependencias; revisa con las áreas competentes la vía de adopción.","Prueba una ampliación gradual y documenta qué cambia entre contextos antes de replicar."],"evidence":"Plan de adopción con responsable, costos recurrentes y decisión institucional pendiente o acordada.","warning":"Prometer compra o expansión automática por el solo hecho de concluir un piloto.","tools":["adopcion","capacidades"],"case":"boston"},{"name":"Evaluación y valor público","questions":["¿Existe una línea de base y un resultado esperado para las personas?","¿Los indicadores tienen fuente, frecuencia y responsable definidos?","¿Se distinguió actividad, resultado e impacto y se revisaron otras causas posibles del cambio?"],"why":"Medir eventos o prototipos no permite saber si mejoró un servicio o si vale la pena ampliarlo.","owner":"Responsable de evaluación, datos y servicio","actions":["Explica la relación entre intervención y resultado; identifica supuestos y efectos no deseados.","Reúne la línea de base y define pocos indicadores relevantes, combinando datos y experiencia de usuarios.","Elige una evaluación proporcional al riesgo y costo; documenta límites y conecta resultados con decisiones."],"evidence":"Teoría de cambio y ficha de indicadores con línea de base o un plan para obtenerla.","warning":"Atribuir una mejora al proyecto sin revisar cambios externos o diferencias entre usuarios.","tools":["cambio","indicadores"],"case":"evaluation"},{"name":"Comunicación y legitimidad","questions":["¿Están definidos públicos, mensajes y acciones esperadas de cada uno?","¿Existe un calendario con canales, responsables y devolución a participantes?","¿Los mensajes se respaldan en evidencia e incluyen dificultades y aprendizajes?"],"why":"La comunicación ayuda a comprender, participar y sostener el trabajo cuando muestra resultados verificables.","owner":"Comunicaciones, líder de proyecto y participación","actions":["Identifica qué necesitan saber y hacer autoridades, funcionarios, usuarios y aliados; diferencia sus mensajes.","Diseña un calendario que combine canales internos, redes sociales, prensa local y medios masivos cuando sean pertinentes.","Publica avances con evidencia y devuelve a participantes qué se incorporó, qué no y por qué."],"evidence":"Plan de comunicación y primera devolución publicada con resultados y pendientes verificables.","warning":"Prometer impacto antes de evaluarlo o medir legitimidad únicamente por alcance en redes.","tools":["comunicacion","actores"],"case":"madrid"}],"tools":[{"id":"mandato","name":"Ficha de propósito, mandato y patrocinio","method":"Diseño institucional","duration":"60-90 minutos","people":"Autoridad patrocinadora, responsable operativo y área del servicio","purpose":"Preparar una decisión institucional sobre propósito, alcance, responsabilidades y recursos.","steps":["Delimita la necesidad pública y aporta evidencia.","Define el resultado esperado y el alcance inicial.","Identifica patrocinador y responsables de decisión y adopción.","Acuerda recursos y la decisión solicitada; registra pendientes."],"fields":["Problema, personas afectadas y evidencia","Resultado esperado y alcance","Patrocinador, decisiones y responsables","Recursos, compromisos y decisión solicitada"],"example":"Servicio: permisos comerciales. Propósito: reducir visitas repetidas. Solicitud: dedicar un equipo compartido y designar al área de permisos como responsable de adopción.","next":"Presenta la ficha a la autoridad y registra los compromisos acordados."},{"id":"raci","name":"Matriz de responsabilidades y decisiones","method":"Gestión de proyectos","duration":"45-60 minutos","people":"Responsables de innovación, servicio y unidades de soporte","purpose":"Clarificar quién ejecuta, quién responde por una decisión y quién debe ser consultado o informado.","steps":["Enumera decisiones y entregables críticos.","Asigna quien ejecuta (R) y quien responde por la decisión (A).","Identifica consultados (C) e informados (I).","Comprueba que no haya vacíos y acuerda cómo resolver bloqueos."],"fields":["Decisión o entregable","R: ejecuta / A: responde por la decisión","C: consultados / I: informados","Bloqueos, mecanismo de resolución y revisión"],"example":"Piloto de atención: R, equipo del proyecto; A, dirección del servicio; C, jurídico y tecnología; I, autoridad patrocinadora.","next":"Valida las responsabilidades con las personas designadas; la matriz no sustituye sus atribuciones formales."},{"id":"entrevistas","name":"Guía de entrevistas exploratorias","method":"Diseño centrado en las personas","duration":"30-45 minutos por entrevista","people":"Facilitador y usuarios o personal de atención","purpose":"Comprender situaciones reales, obstáculos y necesidades sin inducir una respuesta.","steps":["Selecciona perfiles diversos y explica el propósito y uso de la información.","Pregunta por la última experiencia concreta: qué intentó hacer y qué ocurrió.","Profundiza en dificultades, apoyos y consecuencias.","Separa observaciones de interpretaciones y revisa patrones y diferencias."],"fields":["Perfil y contexto, sin identificadores innecesarios","Última experiencia: pasos y dificultades","Necesidades, apoyos y consecuencias","Hallazgos, diferencias y preguntas pendientes"],"example":"Pregunta: cuéntame la última vez que solicitaste este permiso. Evita: ¿te gustaría una aplicación para resolverlo?","next":"Amplía la exploración si faltan perfiles y usa los hallazgos en el mapa de recorrido."},{"id":"recorrido","name":"Mapa del recorrido del usuario","method":"Diseño de servicios","duration":"60-90 minutos","people":"Usuarios, personal de atención y responsable del servicio","purpose":"Localizar obstáculos a lo largo del servicio, incluyendo canales presenciales y digitales.","steps":["Define un perfil y una situación concreta.","Ordena lo que hace antes, durante y después del servicio.","Registra canales, esperas, dificultades y evidencia.","Selecciona oportunidades de mejora y valida el mapa con usuarios."],"fields":["Usuario, objetivo y situación","Antes: pasos, canales y obstáculos","Durante: pasos, canales y obstáculos","Después: resultado, dificultades y oportunidades"],"example":"Una persona consulta requisitos en línea, llega a oficina y descubre un documento faltante. El obstáculo puede estar en la información previa.","next":"Formula el desafío a partir de obstáculos respaldados por evidencia."},{"id":"desafio","name":"Ficha del desafío y preguntas de diseño","method":"Design thinking y análisis de problemas","duration":"60 minutos","people":"Equipo del proyecto, usuarios y responsable del servicio","purpose":"Convertir observaciones en un problema delimitado y una pregunta abierta a distintas soluciones.","steps":["Resume evidencia y población afectada.","Distingue causas, síntomas y supuestos.","Redacta una pregunta: ¿cómo podríamos facilitar X para Y considerando Z?","Define alcance, restricciones y qué aún necesitas investigar."],"fields":["Problema, usuarios y evidencia","Causas, síntomas y supuestos","Pregunta: ¿cómo podríamos...?","Alcance, restricciones y evidencia pendiente"],"example":"¿Cómo podríamos ayudar a nuevos emprendedores a comprender los requisitos del permiso antes de su primera visita?","next":"Explora alternativas y evita que la pregunta obligue a elegir una tecnología."},{"id":"capacidades","name":"Matriz de capacidades y recursos","method":"Planificación operativa","duration":"60-90 minutos","people":"Dirección operativa, personas, presupuesto y unidades de soporte","purpose":"Ajustar el alcance a las capacidades realmente disponibles y planificar brechas.","steps":["Lista tareas de la cartera inicial y capacidades requeridas.","Registra disponibilidad y dedicación efectiva.","Distingue recursos propios, compartidos y externos.","Acuerda acciones, costos y aprobaciones necesarias."],"fields":["Tarea y capacidad requerida","Persona o área disponible y dedicación","Brecha y forma de cubrirla","Costo, fuente, aprobación y responsable"],"example":"Diseño: capacidad interna, dedicación parcial. Jurídico: apoyo compartido. Evaluación: apoyo universitario por acordar.","next":"Reduce la cartera si hay brechas críticas sin responsable ni recursos."},{"id":"priorizacion","name":"Matriz de priorización de desafíos","method":"Gestión de cartera","duration":"60 minutos","people":"Responsable de innovación, áreas de servicios y patrocinador","purpose":"Elegir una cartera manejable con criterios explícitos y decisiones justificadas.","steps":["Acuerda criterios antes de comparar proyectos.","Revisa relevancia, evidencia, viabilidad, riesgos y responsable de adopción.","Compara alternativas con notas justificadas; registra desacuerdos.","Selecciona según capacidad y revisa la cartera al obtener nueva evidencia."],"fields":["Desafío y evidencia disponible","Relevancia para usuarios y resultado esperado","Viabilidad, riesgos y responsable de adopción","Decisión, justificación y condiciones para revisar"],"example":"Un trámite frecuente con responsable comprometido puede ser un mejor inicio que una tecnología visible sin problema claro.","next":"Convierte los desafíos elegidos en fichas y asigna un responsable por proyecto."},{"id":"actores","name":"Mapa de actores y contribuciones","method":"Articulación de ecosistemas","duration":"60-90 minutos","people":"Gobierno, empresas, universidades y sociedad civil pertinentes","purpose":"Conectar intereses y capacidades con compromisos concretos para un desafío.","steps":["Define el desafío o propósito compartido.","Identifica actores, intereses y capacidades, incluidos los ausentes.","Registra contribuciones posibles y dependencias.","Acuerda una primera acción y un responsable por actor."],"fields":["Actor, interés y relación con el desafío","Capacidad o contribución potencial","Compromiso, responsable y próximo paso","Actores ausentes, conflictos y coordinación"],"example":"Universidad: evaluación; municipio: acceso al servicio; empresa: prototipo; vecinos: experiencia y prueba. Cada contribución requiere acuerdo.","next":"Usa el mapa para acordar una agenda y revisar contribuciones efectivas."},{"id":"piloto","name":"Prototipo y protocolo de experimentación","method":"Prototipado y experimentación pública","duration":"90 minutos de preparación","people":"Equipo, usuarios, área responsable y soportes pertinentes","purpose":"Diseñar una prueba limitada que responda una incertidumbre y permita decidir.","steps":["Define hipótesis y qué podría demostrar que es incorrecta.","Elige un prototipo simple: guion, formulario, maqueta o simulación.","Acuerda usuarios, datos, duración, riesgos y condiciones de la prueba.","Establece criterios para continuar, modificar o detener y documenta aprendizajes."],"fields":["Hipótesis e incertidumbre","Prototipo, usuarios y procedimiento","Datos, duración, riesgos y responsables","Criterios de decisión y aprendizajes"],"example":"Probar un guion de orientación y un formulario en papel puede revelar problemas antes de desarrollar una plataforma.","next":"Revisa evidencia y resguardos; no conviertas una prueba en expansión automática."},{"id":"adopcion","name":"Plan de adopción y continuidad","method":"Implementación y sostenibilidad","duration":"90 minutos","people":"Responsable del servicio, operación, presupuesto y soporte","purpose":"Preparar la transición de una solución probada a la operación habitual.","steps":["Revisa evidencia y condiciones de aceptación.","Asigna quién operará, mantendrá y financiará la solución.","Planifica capacitación, transición y dependencias institucionales.","Define una ampliación gradual y revisión de resultados."],"fields":["Resultado del piloto y condiciones de aceptación","Operación, mantenimiento y responsables","Costos recurrentes, recursos y decisiones pendientes","Transición, capacitación y revisión"],"example":"La unidad del servicio incorpora el procedimiento, capacita al personal y asume una revisión mensual de resultados.","next":"Valida recursos y vía de adopción antes de comprometer fechas de expansión."},{"id":"cambio","name":"Teoría de cambio práctica","method":"Evaluación y planificación","duration":"60-90 minutos","people":"Equipo, responsable del servicio y evaluación","purpose":"Explicar cómo la intervención podría generar valor y qué supuestos deben cumplirse.","steps":["Define el cambio esperado para las personas.","Relaciona recursos, actividades, productos y resultados.","Explicita supuestos y efectos no deseados.","Identifica qué evidencia permitiría revisar la explicación."],"fields":["Problema y cambio esperado para las personas","Recursos, actividades y productos","Resultados y supuestos de la relación causal","Efectos no deseados y evidencia necesaria"],"example":"Información clara puede reducir visitas repetidas si los requisitos son estables y los usuarios pueden acceder a esa información.","next":"Convierte los resultados en indicadores y evalúa los supuestos."},{"id":"indicadores","name":"Ficha de indicadores y línea de base","method":"Medición y aprendizaje","duration":"60 minutos","people":"Servicio, datos y evaluación","purpose":"Medir cambios relevantes y definir quién obtendrá y utilizará la evidencia.","steps":["Elige resultados relevantes, incluyendo accesibilidad y posibles efectos adversos.","Define indicador, cálculo, fuente, frecuencia y responsable.","Obtén la línea de base o documenta cómo la reunirás.","Define decisiones y límites de atribución; combina datos con experiencia de usuarios."],"fields":["Resultado, indicador y forma de cálculo","Fuente, frecuencia y responsable","Línea de base, fecha y calidad del dato","Decisión, otras causas posibles y límites"],"example":"Visitas repetidas por solicitud: comparar registros de períodos equivalentes y revisar cambios en requisitos o composición de usuarios.","next":"Revisa los indicadores en cada decisión del proyecto; evita medir solo actividad."},{"id":"comunicacion","name":"Plan de comunicación y devolución","method":"Comunicación estratégica y participación","duration":"60-90 minutos","people":"Comunicaciones, proyecto, participación y servicio","purpose":"Definir qué deben comprender y hacer los públicos y cómo informar resultados verificables.","steps":["Identifica públicos y la acción esperada de cada uno.","Redacta mensajes respaldados por evidencia, sin prometer resultados no evaluados.","Elige canales: internos, medios locales o masivos, redes y encuentros según acceso.","Acuerda hitos, responsables y devolución de lo aprendido a participantes."],"fields":["Público, necesidad de información y acción esperada","Mensaje, evidencia y límites","Canal, hito, fecha y responsable","Devolución, comprensión y participación a observar"],"example":"Vecinos: cómo participar y qué cambió. Funcionarios: qué decisión se tomó y cómo aplicarla. Autoridades: resultados, pendientes y recursos necesarios.","next":"Publica una devolución y comprueba comprensión y participación, además del alcance."}],"cases":{"boston":{"name":"Boston: Mayor’s Office of New Urban Mechanics","place":"Estados Unidos","url":"https://www.boston.gov/departments/new-urban-mechanics","fact":"MONUM trabaja desde la oficina del alcalde con departamentos y comunidades. Su selección de proyectos considera problema, viabilidad, impacto y adopción por un departamento.","learn":"Para adaptar: conecta patrocinio político con un área que asumirá la solución.","limit":"La fuente describe organización y criterios; no demuestra que ese modelo sea adecuado para cualquier municipio."},"nyc":{"name":"Nueva York: Service Design Studio","place":"Estados Unidos","url":"https://www.nyc.gov/site/opportunity/portfolio/service-design-studio.page","fact":"El Studio colabora con agencias para comprender a usuarios y personal y probar prototipos antes de ampliarlos. Ofrece consultas breves y apoyo a proyectos.","learn":"Para adaptar: comenzar por investigación y prototipos; compartir capacidades entre áreas.","limit":"La fuente documenta el servicio y su enfoque; no ofrece una estimación causal de impacto para toda su actividad."},"team":{"name":"Reino Unido: equipos del Service Standard","place":"Reino Unido","url":"https://www.gov.uk/service-manual/service-standard/point-6-have-a-multidisciplinary-team","fact":"El estándar exige equipos con capacidades diversas, participación de quienes deciden y acceso a especialidades como análisis jurídico o de políticas.","learn":"Para adaptar: definir capacidades según la fase y compartir especialistas cuando sea viable.","limit":"Es una práctica institucional documentada; debe adaptarse a recursos y atribuciones locales."},"helsinki":{"name":"Helsinki: Smart Kalasatama","place":"Finlandia · experiencia 2013-2021","url":"https://forumvirium.fi/en/publication/smartkalasatama-final-report/","fact":"Kalasatama desarrolló experimentación urbana y colaboración entre operadores, instituciones y residentes. Su informe final documenta aprendizajes trasladados al programa Helsinki Innovation Districts.","learn":"Para adaptar: articular socios alrededor de pruebas concretas y transferir aprendizajes entre territorios.","limit":"La fuente relata la experiencia; no implica que todas las soluciones se replicaran ni prueba su efectividad en otro contexto."},"piloting":{"name":"Helsinki: pilotos de economía compartida","place":"Finlandia · convocatoria 2022","url":"https://forumvirium.fi/en/sustainable-sharing-looking-for-solutions-for-housing-companies/","fact":"Forum Virium propuso pruebas con usuarios reales y co-creación entre ciudad, empresas, residentes e investigación para aprender sobre nuevas soluciones.","learn":"Para adaptar: definir una pregunta de aprendizaje y compartir resultados con los socios.","limit":"Esta fuente es una convocatoria y descripción del modelo, no una evaluación de resultados de esos pilotos."},"evaluation":{"name":"Reino Unido: medición de servicios públicos","place":"Reino Unido","url":"https://www.gov.uk/service-manual/measuring-success/measuring-the-success-of-your-service","fact":"El Service Manual combina métricas con investigación de usuarios y distintas fuentes de datos para revisar el desempeño de un servicio.","learn":"Para adaptar: seleccionar indicadores según el resultado esperado e incorporar evaluación desde el diseño.","limit":"Es una guía de práctica gubernamental, no una prueba causal de que un servicio específico haya mejorado."},"madrid":{"name":"Madrid: seguimiento de presupuestos participativos","place":"España","url":"https://decide.madrid.es/mas-informacion/dm/presupuestos","fact":"Decide Madrid explica fases, evaluación y selección de propuestas, y ofrece seguimiento de proyectos mediante hitos y actualizaciones.","learn":"Para adaptar: comunicar decisiones y devolver a participantes el avance y estado de sus propuestas.","limit":"La transparencia del proceso no garantiza ejecución ni satisfacción; esta referencia no acredita los resultados de cada proyecto."}}},"en":{"pillars":[{"name":"Political support and governance","questions":["¿Existe una autoridad patrocinadora que participa en decisiones y desbloquea obstáculos?","¿Está acordado el mandato, el alcance y quién toma las decisiones?","¿Hay un área responsable de adoptar las soluciones y recursos comprometidos?"],"why":"Without a mandate and accountable owners, proposals may have no route to adoption.","owner":"Political sponsor and innovation lead","actions":["Relaciona el espacio con una prioridad pública y prepara una propuesta breve con evidencia, alcance y decisión solicitada.","Reúne a la autoridad y al área responsable; acuerda qué decisiones puede tomar el equipo y cómo escalar bloqueos.","Documenta responsables, dedicación y recursos iniciales; revisa la forma de formalizarlos con las áreas competentes."],"evidence":"Mandato acordado, patrocinador identificado y responsable de adopción con compromisos explícitos.","warning":"Inaugurar el espacio antes de asegurar responsabilidades y recursos.","tools":["mandato","raci"],"case":"boston"},{"name":"Challenge identification","questions":["¿El problema está delimitado y respaldado por registros o datos?","¿Se escuchó a usuarios y personal que presta el servicio?","¿Se distinguieron las causas del problema de sus síntomas y de una solución preconcebida?"],"why":"Choosing technology before understanding the problem can divert resources to an unsuitable solution.","owner":"Service owner and research facilitator","actions":["Revisa reclamos, tiempos, errores y registros; identifica perfiles de usuarios que podrían estar quedando fuera.","Realiza una primera ronda exploratoria de entrevistas a usuarios y personal; amplíala si aparecen diferencias relevantes.","Mapea el recorrido y redacta el desafío: quién enfrenta qué dificultad, dónde ocurre y qué evidencia lo respalda."],"evidence":"Ficha del desafío con usuarios, causas, evidencia y preguntas pendientes.","warning":"Tratar una ronda pequeña de entrevistas como una muestra estadísticamente representativa.","tools":["entrevistas","recorrido","desafio"],"case":"nyc"},{"name":"Team and resources","questions":["¿Hay personas con dedicación definida y capacidad para conducir el trabajo?","¿Están disponibles las capacidades de diseño, datos, operación y soporte jurídico necesarias?","¿Existe presupuesto para pruebas y continuidad, además de actividades de lanzamiento?"],"why":"Missing allocated time or critical skills limits delivery even when political support exists.","owner":"Operations, people and budget teams","actions":["Lista las capacidades requeridas por la cartera inicial y distingue disponibilidad real de participación nominal.","Acuerda dedicación semanal, capacidades compartidas y apoyos externos; comienza con un alcance que puedas sostener.","Presupuesta operación, pruebas, evaluación y mantenimiento; identifica qué recursos aún requieren aprobación."],"evidence":"Matriz de capacidades, dedicaciones acordadas y presupuesto inicial con fuente identificada.","warning":"Copiar un equipo grande sin considerar la capacidad financiera de la institución.","tools":["capacidades","raci"],"case":"team"},{"name":"Methods and processes","questions":["¿Existen etapas claras desde el problema hasta la adopción?","¿Hay criterios para priorizar proyectos y decidir si continuar, modificar o detenerlos?","¿El equipo documenta decisiones y aprendizajes de forma reutilizable?"],"why":"Without a shared process, projects depend on individuals and improvised decisions.","owner":"Innovation lead and project owners","actions":["Dibuja el proceso actual e identifica dónde se traban decisiones, datos o recursos.","Acuerda etapas simples con entregable, responsable y criterio de revisión; prueba el proceso en un proyecto.","Mantén un registro de decisiones y aprendizajes; ajusta el método con el equipo al cerrar cada etapa."],"evidence":"Proceso probado con un proyecto y criterios de avance documentados.","warning":"Añadir controles que consumen más esfuerzo que el aprendizaje que generan.","tools":["priorizacion","desafio","piloto"],"case":"nyc"},{"name":"Networks and collaboration","questions":["¿Se identificaron actores según las capacidades que necesita el desafío?","¿Cada aliado tiene una contribución y un responsable definidos?","¿Hay una agenda compartida con proyectos y reglas de coordinación?"],"why":"Contacts and events do not guarantee collaboration or shared outcomes.","owner":"Ecosystem coordinator and partner contacts","actions":["Mapea actores con sus intereses, capacidades y contribuciones potenciales; identifica quién falta.","Convoca una sesión de trabajo sobre un desafío concreto y acuerda una primera contribución por actor.","Formaliza una agenda manejable, responsables y revisión periódica de compromisos."],"evidence":"Mapa de actores y primer proyecto con contribuciones y responsables acordados.","warning":"Confundir adhesión a una red con recursos o participación efectiva.","tools":["actores","raci"],"case":"helsinki"},{"name":"Experimentation and pilots","questions":["¿Cada piloto tiene una hipótesis y una incertidumbre concreta que resolver?","¿Se definieron usuarios, duración, riesgos y datos antes de probar?","¿Hay criterios previos para continuar, modificar o detener la prueba?"],"why":"Testing without criteria generates activity but little evidence for decisions.","owner":"Pilot lead, service owner and evaluator","actions":["Selecciona la incertidumbre más importante y diseña la prueba más pequeña que permita aprender sobre ella.","Prepara un prototipo y protocolo con usuarios, datos, riesgos y responsables; revisa las condiciones aplicables con el equipo competente.","Acuerda una revisión al finalizar: qué aprendimos, qué cambió y qué decisión permite la evidencia."],"evidence":"Protocolo de prueba y registro de aprendizajes con una decisión justificada.","warning":"Interpretar el entusiasmo inicial como evidencia suficiente de efectividad.","tools":["piloto","indicadores"],"case":"piloting"},{"name":"Adoption and scaling","questions":["¿Hay un área que asumirá la operación si la solución funciona?","¿Se previeron mantenimiento, formación, financiamiento y la vía institucional de adopción?","¿Se documentó qué debe adaptarse antes de ampliar o replicar la solución?"],"why":"Continuity depends on capabilities and responsibilities that a pilot alone does not create.","owner":"Service owner, operations and budget teams","actions":["Involucra desde el inicio al área que operará la solución y acuerda sus condiciones de aceptación.","Estima costos recurrentes, mantenimiento, capacitación y dependencias; revisa con las áreas competentes la vía de adopción.","Prueba una ampliación gradual y documenta qué cambia entre contextos antes de replicar."],"evidence":"Plan de adopción con responsable, costos recurrentes y decisión institucional pendiente o acordada.","warning":"Prometer compra o expansión automática por el solo hecho de concluir un piloto.","tools":["adopcion","capacidades"],"case":"boston"},{"name":"Evaluation and public value","questions":["¿Existe una línea de base y un resultado esperado para las personas?","¿Los indicadores tienen fuente, frecuencia y responsable definidos?","¿Se distinguió actividad, resultado e impacto y se revisaron otras causas posibles del cambio?"],"why":"Counting events or prototypes does not establish whether a service improved.","owner":"Evaluation, data and service teams","actions":["Explica la relación entre intervención y resultado; identifica supuestos y efectos no deseados.","Reúne la línea de base y define pocos indicadores relevantes, combinando datos y experiencia de usuarios.","Elige una evaluación proporcional al riesgo y costo; documenta límites y conecta resultados con decisiones."],"evidence":"Teoría de cambio y ficha de indicadores con línea de base o un plan para obtenerla.","warning":"Atribuir una mejora al proyecto sin revisar cambios externos o diferencias entre usuarios.","tools":["cambio","indicadores"],"case":"evaluation"},{"name":"Communication and legitimacy","questions":["¿Están definidos públicos, mensajes y acciones esperadas de cada uno?","¿Existe un calendario con canales, responsables y devolución a participantes?","¿Los mensajes se respaldan en evidencia e incluyen dificultades y aprendizajes?"],"why":"Communication supports understanding, participation and continuity when claims are backed by evidence.","owner":"Communications, project lead and participation team","actions":["Identifica qué necesitan saber y hacer autoridades, funcionarios, usuarios y aliados; diferencia sus mensajes.","Diseña un calendario que combine canales internos, redes sociales, prensa local y medios masivos cuando sean pertinentes.","Publica avances con evidencia y devuelve a participantes qué se incorporó, qué no y por qué."],"evidence":"Plan de comunicación y primera devolución publicada con resultados y pendientes verificables.","warning":"Prometer impacto antes de evaluarlo o medir legitimidad únicamente por alcance en redes.","tools":["comunicacion","actores"],"case":"madrid"}],"tools":[{"id":"mandato","name":"Purpose, mandate and sponsorship worksheet","method":"Institutional design","duration":"60-90 minutes","people":"Political sponsor, operational lead and service owner","purpose":"Prepare an institutional decision on purpose, scope, responsibilities and resources.","steps":["Define the public need and provide evidence.","Agree the intended outcome and initial scope.","Identify the sponsor and those accountable for decisions and adoption.","Agree resources and the requested decision; record unresolved issues."],"fields":["Problem, affected people and evidence","Intended outcome and scope","Sponsor, decisions and responsibilities","Resources, commitments and requested decision"],"example":"Business permits: reduce repeat visits. Request: allocate a shared team and designate the permits department as the adoption owner.","next":"Present the worksheet to the sponsor and record agreed commitments."},{"id":"raci","name":"Responsibilities and decisions matrix","method":"Project management","duration":"45-60 minutes","people":"Innovation lead, service owner and support departments","purpose":"Clarify who does the work, who is accountable for decisions, and who must be consulted or informed.","steps":["List critical decisions and deliverables.","Assign who performs the work (R) and who is accountable (A).","Identify those consulted (C) and informed (I).","Check for gaps and agree how to resolve blockers."],"fields":["Decision or deliverable","R: responsible / A: accountable","C: consulted / I: informed","Blockers, resolution mechanism and review"],"example":"Service pilot: R, project team; A, service director; C, legal and technology teams; I, political sponsor.","next":"Confirm responsibilities with the named people. The matrix does not replace their formal powers."},{"id":"entrevistas","name":"Exploratory interview guide","method":"Human-centred design","duration":"30-45 minutes per interview","people":"Facilitator and service users or frontline staff","purpose":"Understand real situations, obstacles and needs without leading the interviewee.","steps":["Include diverse profiles and explain the purpose and use of information.","Ask about the last specific experience: what they tried to do and what happened.","Explore difficulties, support and consequences.","Separate observations from interpretations; review patterns and differences."],"fields":["Profile and context, without unnecessary identifiers","Last experience: steps and difficulties","Needs, support and consequences","Findings, differences and unanswered questions"],"example":"Ask: tell me about the last time you applied for this permit. Avoid: would you like an app to solve this?","next":"Include missing profiles and use the findings to build a user journey map."},{"id":"recorrido","name":"User journey map","method":"Service design","duration":"60-90 minutes","people":"Users, frontline staff and service owner","purpose":"Locate obstacles throughout a service, across physical and digital channels.","steps":["Define a user profile and a specific situation.","Map what happens before, during and after the service.","Record channels, waiting, difficulties and evidence.","Select improvement opportunities and validate the map with users."],"fields":["User, objective and situation","Before: steps, channels and obstacles","During: steps, channels and obstacles","After: outcome, difficulties and opportunities"],"example":"Someone checks requirements online, visits the office and learns a document is missing. The obstacle may lie in the information provided beforehand.","next":"Frame the challenge around obstacles supported by evidence."},{"id":"desafio","name":"Challenge framing and design questions","method":"Design thinking and problem analysis","duration":"60 minutes","people":"Project team, users and service owner","purpose":"Turn observations into a bounded problem and a question open to different solutions.","steps":["Summarise evidence and affected users.","Distinguish causes, symptoms and assumptions.","Write a question: how might we enable X for Y, considering Z?","Define scope, constraints and remaining research needs."],"fields":["Problem, users and evidence","Causes, symptoms and assumptions","How might we...?","Scope, constraints and missing evidence"],"example":"How might we help new business owners understand permit requirements before their first office visit?","next":"Explore alternatives without building a particular technology into the question."},{"id":"capacidades","name":"Capabilities and resources matrix","method":"Operational planning","duration":"60-90 minutes","people":"Operations, people, budget and support teams","purpose":"Match scope to actual capacity and plan how to address gaps.","steps":["List initial portfolio tasks and required capabilities.","Record real availability and allocated time.","Distinguish internal, shared and external resources.","Agree actions, costs and necessary approvals."],"fields":["Task and required capability","Available person or team and allocated time","Gap and how to address it","Cost, funding source, approval and owner"],"example":"Design: internal, part-time. Legal: shared support. Evaluation: university support still to be agreed.","next":"Reduce the portfolio if critical gaps have neither an owner nor resources."},{"id":"priorizacion","name":"Challenge prioritisation matrix","method":"Portfolio management","duration":"60 minutes","people":"Innovation lead, service departments and sponsor","purpose":"Select a manageable portfolio with explicit criteria and justified decisions.","steps":["Agree criteria before comparing projects.","Review relevance, evidence, feasibility, risk and the adoption owner.","Compare options with justified assessments and record disagreements.","Select within available capacity and revisit decisions as evidence changes."],"fields":["Challenge and available evidence","Relevance to users and intended outcome","Feasibility, risk and adoption owner","Decision, rationale and review conditions"],"example":"A frequent procedure with a committed service owner may be a better starting point than a visible technology without a clearly defined problem.","next":"Create challenge worksheets and assign an owner to each selected project."},{"id":"actores","name":"Stakeholder and contributions map","method":"Innovation ecosystem development","duration":"60-90 minutes","people":"Relevant government, business, university and civil society actors","purpose":"Connect interests and capabilities to concrete commitments around a challenge.","steps":["Define the shared challenge or purpose.","Identify actors, interests and capabilities, including absent stakeholders.","Record possible contributions and dependencies.","Agree a first action and a contact responsible for each actor."],"fields":["Actor, interest and relationship to the challenge","Capability or potential contribution","Commitment, owner and next step","Missing actors, conflicts and coordination"],"example":"University: evaluation; municipality: access to the service; company: prototype; residents: lived experience and testing. Each contribution needs an agreement.","next":"Agree a shared agenda and review actual contributions."},{"id":"piloto","name":"Prototype and experimentation protocol","method":"Public-sector prototyping and experimentation","duration":"90 minutes of preparation","people":"Team, users, service owner and relevant support staff","purpose":"Design a limited test that addresses uncertainty and supports a decision.","steps":["Define the hypothesis and what could show it is wrong.","Choose a simple prototype: script, form, mock-up or simulation.","Agree users, data, duration, risks and testing conditions.","Set criteria to continue, change or stop; document learning."],"fields":["Hypothesis and uncertainty","Prototype, users and procedure","Data, duration, risks and responsibilities","Decision criteria and learning"],"example":"Testing a guidance script and paper form can reveal problems before a platform is developed.","next":"Review evidence and safeguards. A test does not automatically justify expansion."},{"id":"adopcion","name":"Adoption and continuity plan","method":"Implementation and sustainability","duration":"90 minutes","people":"Service owner, operations, budget and support teams","purpose":"Prepare the transition from a tested solution to normal service operation.","steps":["Review evidence and acceptance conditions.","Assign who will operate, maintain and fund the solution.","Plan training, transition and institutional dependencies.","Define gradual expansion and an outcome review."],"fields":["Pilot findings and acceptance conditions","Operation, maintenance and responsibilities","Recurring costs, resources and pending decisions","Transition, training and review"],"example":"The service unit adopts the procedure, trains staff and takes responsibility for a monthly outcome review.","next":"Confirm resources and the adoption route before committing to expansion dates."},{"id":"cambio","name":"Practical theory of change","method":"Evaluation and planning","duration":"60-90 minutes","people":"Team, service owner and evaluation staff","purpose":"Explain how an intervention could create public value and which assumptions must hold.","steps":["Define the intended change for people.","Connect resources, activities, outputs and outcomes.","Make assumptions and unintended effects explicit.","Identify evidence that could challenge the explanation."],"fields":["Problem and intended change for people","Resources, activities and outputs","Outcomes and causal assumptions","Unintended effects and required evidence"],"example":"Clear information may reduce repeat visits if requirements remain stable and users can access the information.","next":"Turn outcomes into indicators and evaluate assumptions."},{"id":"indicadores","name":"Indicators and baseline worksheet","method":"Measurement and learning","duration":"60 minutes","people":"Service, data and evaluation teams","purpose":"Measure relevant changes and identify who will obtain and use the evidence.","steps":["Select relevant outcomes, including accessibility and possible adverse effects.","Define the indicator, calculation, source, frequency and owner.","Obtain the baseline or document how it will be gathered.","Define decisions and attribution limits; combine data with user experience."],"fields":["Outcome, indicator and calculation","Source, frequency and owner","Baseline, date and data quality","Decision, alternative explanations and limits"],"example":"Repeat visits per application: compare equivalent periods and check changes in requirements or user profiles.","next":"Review indicators at each decision point; avoid measuring activity alone."},{"id":"comunicacion","name":"Communication and feedback plan","method":"Strategic communication and participation","duration":"60-90 minutes","people":"Communication, project, participation and service teams","purpose":"Define what audiences need to understand and do, and how to communicate verified findings.","steps":["Identify audiences and the expected action for each.","Write evidence-backed messages without promising unevaluated outcomes.","Choose internal channels, local or mass media, social media and meetings according to access.","Agree milestones, owners and feedback to participants."],"fields":["Audience, information need and expected action","Message, evidence and limits","Channel, milestone, date and owner","Feedback, understanding and participation to observe"],"example":"Residents: how to participate and what changed. Staff: what was decided and how to apply it. Authorities: findings, outstanding issues and resources needed.","next":"Provide feedback and check understanding and participation as well as reach."}],"cases":{"boston":{"name":"Boston: Mayor’s Office of New Urban Mechanics","place":"United States","fact":"MONUM works from the mayor’s office with departments and communities. Project selection considers the problem, feasibility, impact and departmental adoption.","learn":"Adaptation: connect political sponsorship to the department that will adopt the solution.","limit":"The source describes organisation and criteria; it does not prove the model suits every municipality.","url":"https://www.boston.gov/departments/new-urban-mechanics"},"nyc":{"name":"New York: Service Design Studio","place":"United States","fact":"The Studio works with agencies to understand users and staff and test prototypes before scaling. It offers office hours and project support.","learn":"Adaptation: begin with research and prototypes and share capabilities across departments.","limit":"The source documents the service and approach, not a causal impact estimate of all its activity.","url":"https://www.nyc.gov/site/opportunity/portfolio/service-design-studio.page"},"team":{"name":"United Kingdom: Service Standard teams","place":"United Kingdom","fact":"The standard calls for multidisciplinary capabilities, decision-maker participation and access to specialist expertise, including legal and policy advice.","learn":"Adaptation: define capabilities by project stage and share specialists when feasible.","limit":"This documented institutional practice must be adapted to local resources and powers.","url":"https://www.gov.uk/service-manual/service-standard/point-6-have-a-multidisciplinary-team"},"helsinki":{"name":"Helsinki: Smart Kalasatama","place":"Finland · 2013-2021","fact":"Kalasatama developed urban experimentation and collaboration among operators, institutions and residents. Its final report describes learning transferred to Helsinki Innovation Districts.","learn":"Adaptation: organise partners around concrete tests and transfer learning across places.","limit":"The account does not imply every solution was replicated or establish effectiveness elsewhere.","url":"https://forumvirium.fi/en/publication/smartkalasatama-final-report/"},"piloting":{"name":"Helsinki: sharing-economy pilots","place":"Finland · 2022 call","fact":"Forum Virium proposed real-user testing and co-creation among the city, companies, residents and researchers to learn about new solutions.","learn":"Adaptation: define a learning question and share findings with partners.","limit":"The source is a call and model description, not an outcome evaluation of those pilots.","url":"https://forumvirium.fi/en/sustainable-sharing-looking-for-solutions-for-housing-companies/"},"evaluation":{"name":"United Kingdom: measuring public services","place":"United Kingdom","fact":"The Service Manual combines metrics, user research and multiple data sources to review service performance.","learn":"Adaptation: choose indicators for intended outcomes and include evaluation from the design stage.","limit":"It is government practice guidance, not causal proof that a particular service improved.","url":"https://www.gov.uk/service-manual/measuring-success/measuring-the-success-of-your-service"},"madrid":{"name":"Madrid: participatory-budget monitoring","place":"Spain","fact":"Decide Madrid explains proposal stages, evaluation and selection, and provides project tracking through milestones and updates.","learn":"Adaptation: communicate decisions and return progress and status information to participants.","limit":"Process transparency does not guarantee implementation or satisfaction; the reference does not establish each project’s outcomes.","url":"https://decide.madrid.es/mas-informacion/dm/presupuestos"}}},"actions":{"es":[[{"title":"Acordar un mandato y una autoridad patrocinadora","dimension":"Política e institucional","how":"Prepara una página con la necesidad pública, el alcance del espacio y las decisiones que necesitas. Solicita una reunión con la autoridad y la jefatura responsable del servicio. Distingue quién autoriza, quién ejecuta y cómo se resolverán bloqueos; pide compromisos verificables, no solo una declaración de apoyo.","example":"Un municipio quiere mejorar permisos comerciales. La autoridad acuerda que el equipo puede convocar a las áreas involucradas, designa una jefatura patrocinadora y establece dónde resolver desacuerdos.","output":"Mandato con alcance, patrocinador y decisiones autorizadas.","owner":"Autoridad patrocinadora y jefatura del área responsable","tool":"mandato","gate":"Existe un responsable identificado y el alcance fue confirmado por quienes deciden."},{"title":"Sustentar el encargo con evidencia del problema","dimension":"Evidencia","how":"Revisa reclamos, tiempos de atención y prioridades institucionales. Conversa con personal y usuarios para contrastar lo registrado. Resume qué dificultad existe, a quién afecta y qué todavía no sabes; evita justificar una nueva estructura únicamente porque otras ciudades tienen un laboratorio.","example":"Los registros muestran visitas repetidas para un permiso. El equipo identifica requisitos confusos y contrasta esa explicación con funcionarios y solicitantes antes de proponer una intervención.","output":"Ficha del desafío con fuentes y preguntas pendientes.","owner":"Responsable del servicio y equipo de análisis","tool":"desafio","gate":"Puedes explicar la necesidad pública y distinguir datos de supuestos."},{"title":"Traducir el mandato en reglas de trabajo","dimension":"Técnica","how":"Completa una matriz de responsabilidades para priorización, pruebas, presupuesto y adopción. Define una reunión de coordinación y un registro simple de decisiones. Revisa la formalización con el área competente según el contexto; la matriz no sustituye las atribuciones legales de cada unidad.","example":"El laboratorio facilita el diseño; la dirección de atención decide sobre el servicio; presupuesto revisa recursos y jurídica examina la vía institucional. Cada decisión tiene un responsable.","output":"Matriz de responsabilidades y mecanismo para resolver bloqueos.","owner":"Coordinación del espacio y áreas competentes","tool":"raci","gate":"No quedan decisiones críticas sin responsable o vía de resolución."},{"title":"Explicar el mandato y activar la colaboración interna","dimension":"Comunicación","how":"Redacta un mensaje breve que explique para qué existe el espacio, qué puede hacer y cómo solicitar su apoyo. Valídalo con la autoridad y compártelo con las jefaturas antes de una difusión amplia. Incluye un canal de contacto y una invitación concreta; revisa si los equipos comprenden su papel.","example":"Una comunicación interna invita a cada dirección a proponer un desafío con responsable y evidencia. La presentación pública explica el propósito sin prometer resultados que todavía no existen.","output":"Mensaje aprobado, públicos definidos y canal de contacto operativo.","owner":"Coordinación y equipo de comunicaciones","tool":"comunicacion","gate":"Las áreas convocadas saben qué se espera de ellas y dónde acudir."}],[{"title":"Conseguir acceso al servicio y a sus responsables","dimension":"Política e institucional","how":"Acuerda con la jefatura del servicio qué problema investigar y qué personal puede participar. Solicita tiempo para entrevistas y acceso a registros por las vías autorizadas. Aclara quién validará el desafío y qué decisiones podrá tomar el equipo una vez termine la investigación.","example":"Atención ciudadana autoriza observar el proceso de orientación, designa un enlace y acuerda revisar la ficha del problema antes de desarrollar soluciones.","output":"Acuerdo de investigación con alcance, enlace y validación.","owner":"Jefatura del servicio y coordinación del proyecto","tool":"raci","gate":"Hay acceso y participación acordados, con los resguardos que correspondan."},{"title":"Escuchar a usuarios y contrastar los registros","dimension":"Evidencia","how":"Reúne datos de reclamos, demoras y errores. Usa entrevistas exploratorias para conocer situaciones diferentes, incluyendo personas con dificultades de acceso. Pregunta por experiencias concretas; registra hallazgos sin datos personales innecesarios. Amplía la escucha si aparecen diferencias que la primera ronda no explica.","example":"El registro indica solicitudes incompletas. Las entrevistas muestran que algunas personas no comprenden la lista de requisitos y otras no pueden acceder al canal digital. Son causas que requieren respuestas distintas.","output":"Síntesis de hallazgos, fuentes y limitaciones de la escucha.","owner":"Equipo de diseño y personal del servicio","tool":"entrevistas","gate":"El problema se sostiene en más de una fuente y recoge experiencias diversas."},{"title":"Definir un desafío abordable antes de elegir soluciones","dimension":"Técnica","how":"Mapea los pasos del servicio con el personal y los usuarios. Identifica dónde ocurre la dificultad y formula quién necesita qué mejora y por qué. Compara alcance, factibilidad y compromiso del área responsable; evita convertir una aplicación o plataforma en el problema a resolver.","example":"En lugar de “necesitamos una app”, el desafío queda como “¿cómo facilitar que los solicitantes comprendan los requisitos antes de acudir a la oficina?”.","output":"Ficha del desafío y recorrido con causas por explorar.","owner":"Equipo de diseño y responsable del servicio","tool":"recorrido","gate":"El desafío es específico y no presupone una única solución."},{"title":"Convocar a la escucha y devolver lo aprendido","dimension":"Comunicación","how":"Explica a usuarios y funcionarios por qué se les invita, cómo se utilizarán sus aportes y qué no se puede prometer. Elige canales accesibles: atención presencial, teléfono, organizaciones locales o redes sociales según el público. Después devuelve los hallazgos y lo que se decidió investigar.","example":"Una invitación en la oficina convoca a personas que realizaron el trámite. Al cerrar las entrevistas, una ficha explica qué dificultades se detectaron y cuál será el siguiente paso.","output":"Convocatoria accesible y devolución de hallazgos.","owner":"Participación ciudadana y comunicaciones","tool":"comunicacion","gate":"Las personas conocen el uso de sus aportes y reciben una devolución."}],[{"title":"Acordar dedicación y recursos con las jefaturas","dimension":"Política e institucional","how":"Reúne a las jefaturas de las capacidades que necesitas. Solicita dedicación concreta, una persona de enlace y el mecanismo para ajustar prioridades cuando haya conflictos. Distingue recursos confirmados de solicitudes pendientes; comienza con un alcance que puedas sostener sin depender de apoyos informales.","example":"Tecnología designa un enlace para revisar la viabilidad, jurídica acuerda participar en decisiones relevantes y la dirección permite tiempo de trabajo para un primer desafío.","output":"Acuerdo de dedicación, responsables y recursos pendientes.","owner":"Dirección del espacio y jefaturas participantes","tool":"raci","gate":"La dedicación y el financiamiento inicial están confirmados para el alcance elegido."},{"title":"Verificar capacidades y disponibilidad reales","dimension":"Evidencia","how":"Lista las tareas del proyecto y las capacidades necesarias para ejecutarlas. Contrasta disponibilidad con carga de trabajo, experiencia y recursos existentes. Pregunta qué puede compartirse y qué debe conseguirse; una nómina amplia de participantes no equivale a capacidad operativa.","example":"El equipo descubre que cuenta con experiencia en atención, pero no con evaluación de datos. Acuerda apoyo de otra unidad en lugar de iniciar varios pilotos sin esa capacidad.","output":"Inventario de capacidades, brechas y disponibilidad comprobada.","owner":"Coordinación y enlaces de las áreas","tool":"capacidades","gate":"Cada tarea crítica tiene capacidad disponible o una acción para conseguirla."},{"title":"Organizar una operación inicial viable","dimension":"Técnica","how":"Define una cartera pequeña y distribuye tareas según capacidad real. Estima costos de investigación, pruebas, evaluación y continuidad. Crea un calendario de trabajo y revisa avances con el equipo; no asumas que hace falta una sede propia si puedes usar espacios y capacidades compartidos.","example":"Un equipo parcial inicia un desafío, usa salas existentes y reserva apoyo de datos para la evaluación. Los otros proyectos esperan hasta confirmar capacidad.","output":"Plan operativo inicial con tareas, costos y dedicación.","owner":"Coordinación operativa y presupuesto","tool":"capacidades","gate":"El alcance es coherente con tiempo, capacidades y recursos disponibles."},{"title":"Hacer comprensible la oferta y sus límites","dimension":"Comunicación","how":"Publica qué apoyo ofrece el equipo, a quién, cómo solicitarlo y cuánto trabajo puede asumir. Comunica a las jefaturas las necesidades de participación y el estado de solicitudes. Evita una campaña de lanzamiento que prometa una cartera mayor que la capacidad disponible.","example":"La página interna anuncia acompañamiento para un primer desafío y explica los criterios de selección, el compromiso del área postulante y el canal para consultar.","output":"Oferta clara, canal de ingreso y mensajes sobre capacidad.","owner":"Coordinación y comunicaciones internas","tool":"comunicacion","gate":"Quienes solicitan apoyo entienden requisitos, alcance y tiempos por acordar."}],[{"title":"Acordar quién decide en cada etapa","dimension":"Política e institucional","how":"Convoca al responsable del servicio y a las áreas que autorizan recursos o cambios. Acuerda qué decisiones requieren validación y cómo se revisarán. Define un mecanismo para detener o ajustar proyectos sin que se interprete automáticamente como fracaso.","example":"Antes de iniciar una prueba, la jefatura acuerda que podrá detenerse si no mejora la experiencia o aparecen riesgos; queda registrada la autoridad que tomará esa decisión.","output":"Reglas de decisión y responsables por etapa.","owner":"Coordinación y jefatura del servicio","tool":"raci","gate":"Cada etapa tiene una decisión explícita y una persona facultada para tomarla."},{"title":"Encontrar dónde se traban los proyectos","dimension":"Evidencia","how":"Revisa un proyecto reciente y reconstruye sus decisiones, tiempos y entregables. Pregunta al equipo qué información faltó y qué aprobaciones generaron demoras. Distingue problemas del método de restricciones que el equipo no puede resolver solo.","example":"El prototipo se terminó, pero estuvo semanas esperando saber quién aceptaría la solución. El aprendizaje lleva a incorporar al área de adopción desde el inicio.","output":"Mapa de bloqueos y mejoras justificadas del proceso.","owner":"Equipo de proyecto y responsable del servicio","tool":"recorrido","gate":"Los cambios propuestos responden a bloqueos observados, no solo a preferencias metodológicas."},{"title":"Probar un proceso simple en un proyecto","dimension":"Técnica","how":"Define etapas desde el desafío hasta la adopción, con un entregable y criterio de avance por etapa. Usa un tablero o registro sencillo para responsables y pendientes. Aplica el proceso a un proyecto real y ajústalo al cierre; no necesitas imponer todas las metodologías a todos los desafíos.","example":"Un proyecto pasa por problema delimitado, alternativas, prueba y decisión de adopción. Cada revisión verifica un entregable concreto antes de comprometer más recursos.","output":"Proceso aplicado y registro de decisiones y aprendizajes.","owner":"Coordinación metodológica y equipo ejecutor","tool":"priorizacion","gate":"El equipo puede explicar qué sigue y qué evidencia permite avanzar."},{"title":"Dar visibilidad a avances, decisiones y bloqueos","dimension":"Comunicación","how":"Establece un resumen periódico con estado, siguiente decisión, responsable y apoyo requerido. Usa canales internos donde las jefaturas puedan responder. Comparte aprendizajes de ajustes o detenciones sin ocultar dificultades ni difundir información sensible.","example":"El resumen del proyecto indica que la siguiente decisión es aprobar acceso a datos y quién debe resolverla; no se limita a informar que se realizó un taller.","output":"Formato de seguimiento y devolución de aprendizajes.","owner":"Coordinación del proyecto y comunicaciones internas","tool":"comunicacion","gate":"El resumen permite a cada actor identificar qué debe hacer."}],[{"title":"Alinear intereses y compromisos de los aliados","dimension":"Política e institucional","how":"Invita a los actores necesarios alrededor de un desafío concreto. Pregunta qué valor obtienen, qué pueden aportar y quién puede comprometer ese aporte. Acuerda reglas de coordinación y examina con las áreas competentes cualquier convenio necesario; no confundas asistencia a una reunión con una alianza activa.","example":"Municipio, universidad y empresa acuerdan explorar una prueba de eficiencia hídrica: cada uno identifica su contribución, límites y responsable antes de anunciar la colaboración.","output":"Agenda compartida y compromisos identificados.","owner":"Articulación del ecosistema y representantes de los aliados","tool":"actores","gate":"Hay contribuciones y responsables, además de interés general."},{"title":"Mapear aportes y actores que faltan","dimension":"Evidencia","how":"Registra capacidades, intereses y vínculos existentes según el desafío. Contrasta los aportes potenciales con disponibilidad real. Incluye usuarios y organizaciones del territorio para detectar necesidades no representadas; revisa qué relaciones requieren fortalecerse.","example":"Hay varios proveedores tecnológicos, pero falta una organización que conozca las dificultades de los usuarios y un equipo que evalúe la prueba. El mapa permite completar esas capacidades.","output":"Mapa de actores con aportes comprobados y vacíos.","owner":"Equipo de articulación y responsable del desafío","tool":"actores","gate":"Los aliados cubren las capacidades necesarias y se identifican actores ausentes."},{"title":"Activar un proyecto colaborativo manejable","dimension":"Técnica","how":"Selecciona un proyecto con alcance acotado, responsables y recursos acordados. Define hitos, intercambio de información y revisiones de compromisos. Documenta quién realiza cada tarea y cómo se ajustará el trabajo si un aporte no se concreta.","example":"La universidad evalúa una prueba, el municipio facilita instalaciones y el proveedor aporta el prototipo. Una revisión conjunta verifica avances y pendientes antes de ampliar el proyecto.","output":"Ficha del proyecto colaborativo y matriz de responsabilidades.","owner":"Responsable del proyecto y enlaces de aliados","tool":"raci","gate":"Cada compromiso tiene tarea, entregable y mecanismo de seguimiento."},{"title":"Movilizar aliados alrededor de una propuesta concreta","dimension":"Comunicación","how":"Construye mensajes diferenciados para empresas, academia, sociedad civil y áreas públicas. Explica el desafío, las contribuciones buscadas y cómo participar. Usa reuniones, redes, prensa o medios masivos cuando correspondan; comunica aportes reales y devuelve resultados a quienes participaron.","example":"Una convocatoria busca apoyo para evaluar accesibilidad, en vez de invitar genéricamente a “sumarse al ecosistema”. Luego informa qué alianzas se activaron y qué aportó cada una.","output":"Convocatoria con aportes buscados y plan de devolución.","owner":"Articulación y comunicaciones","tool":"comunicacion","gate":"Los actores saben qué contribución se solicita y cómo ofrecerla."}],[{"title":"Habilitar la prueba y acordar sus decisiones","dimension":"Política e institucional","how":"Identifica al responsable del servicio, a quienes autorizan la prueba y al área que podría adoptar la solución. Revisa los resguardos aplicables con los equipos competentes. Acuerda quién puede modificar o detener la prueba y cómo se tratarán incidentes antes de invitar usuarios.","example":"Una prueba de orientación telefónica cuenta con responsable, guion revisado y un canal para problemas. No se inicia solo con la autorización informal de un integrante del equipo.","output":"Acuerdo de prueba, responsabilidades y resguardos.","owner":"Responsable del servicio y áreas competentes","tool":"raci","gate":"La prueba tiene autorización y condiciones de operación revisadas."},{"title":"Definir qué incertidumbre debe resolver el piloto","dimension":"Evidencia","how":"Formula una hipótesis y el aprendizaje necesario para decidir. Reúne la situación inicial y elige indicadores de resultado y efectos no deseados. Define cómo interpretarás cambios y qué no podrás atribuir al piloto; el diseño de evaluación debe ser proporcional a su riesgo y alcance.","example":"La hipótesis es que una orientación previa reduce solicitudes incompletas. Se registran errores antes y durante la prueba y se revisa si cambió el perfil de solicitantes.","output":"Hipótesis, línea de base y criterios de evaluación.","owner":"Equipo de evaluación y responsable del servicio","tool":"indicadores","gate":"Puedes describir qué resultado permitiría continuar, ajustar o detener."},{"title":"Diseñar una prueba pequeña y documentada","dimension":"Técnica","how":"Completa un protocolo con usuarios, duración por acordar, procedimiento, datos, riesgos y responsables. Prepara el prototipo mínimo necesario para aprender. Ensaya la operación con el personal antes de la prueba y agenda una revisión final que produzca una decisión.","example":"Se prueba una lista de requisitos en una oficina, con registro de dudas y errores. Si aparecen problemas, el equipo ajusta el material antes de considerar otras oficinas.","output":"Protocolo y prototipo preparados para una prueba controlada.","owner":"Equipo ejecutor y operación del servicio","tool":"piloto","gate":"El protocolo puede ser ejecutado por el equipo y los criterios de decisión están acordados."},{"title":"Explicar la prueba y devolver sus aprendizajes","dimension":"Comunicación","how":"Describe a usuarios y funcionarios el propósito, alcance, canales de consulta y carácter experimental de la iniciativa. Valida mensajes y condiciones de participación según el contexto. Al finalizar comunica qué se aprendió y qué se decidió, evitando presentar el inicio del piloto como un resultado logrado.","example":"La invitación dice que se probará una nueva orientación y ofrece un canal para dificultades. El cierre informa si se mantendrá, ajustará o retirará y explica la evidencia utilizada.","output":"Mensajes de inicio, consulta y cierre del piloto.","owner":"Responsable del servicio y comunicaciones","tool":"comunicacion","gate":"Participantes comprenden la prueba y existe una devolución prevista."}],[{"title":"Acordar quién adoptará y sostendrá la solución","dimension":"Política e institucional","how":"Solicita una reunión con la jefatura del servicio y las áreas de presupuesto, tecnología o jurídica que correspondan. Lleva una página con problema, resultados y decisión solicitada. Acuerda quién operará la solución, qué compromisos puede asumir y qué autorizaciones siguen pendientes.","example":"Tras probar una orientación para permisos, la dirección responsable acuerda quién mantendrá la información y capacitará al personal. El laboratorio acompaña la transferencia, pero no sustituye al dueño del servicio.","output":"Acuerdo de adopción con responsable y decisiones pendientes.","owner":"Jefatura del servicio y áreas competentes","tool":"raci","gate":"El área receptora acepta el alcance y se identifica la vía institucional de adopción."},{"title":"Comprobar si la evidencia justifica continuar","dimension":"Evidencia","how":"Reúne datos anteriores y posteriores, además de experiencias de usuarios y funcionarios. Revisa qué mejoró, para quién y qué dificultades persisten. Examina cambios en volumen, personal o perfil de usuarios; si la evidencia es insuficiente, acuerda una prueba adicional antes de recomendar ampliación.","example":"Disminuyen las solicitudes incompletas, pero también cambió el personal. El equipo entrevista usuarios y analiza registros para distinguir explicaciones antes de atribuir la mejora al piloto.","output":"Ficha de resultados, límites y recomendación de decisión.","owner":"Equipo de evaluación y responsable del servicio","tool":"indicadores","gate":"La decisión se apoya en resultados y límites explícitos, no solo en satisfacción del equipo."},{"title":"Preparar una incorporación gradual al servicio","dimension":"Técnica","how":"Con el área receptora, define procedimiento, capacitación, mantenimiento, costos recurrentes y seguimiento. Revisa dependencias técnicas y la vía de adopción con las áreas competentes. Comienza con un alcance manejable y fija qué condiciones revisar antes de ampliar o replicar.","example":"La nueva orientación se incorpora primero en una oficina. Se asignan responsables para actualizar materiales y revisar errores; se amplía cuando funciona y hay recursos para sostenerla.","output":"Plan de adopción con tareas, recursos y criterios de ampliación.","owner":"Operación del servicio, tecnología y presupuesto","tool":"adopcion","gate":"Están acordados operación, mantenimiento y recursos para el alcance inicial."},{"title":"Comunicar el cambio y facilitar su apropiación","dimension":"Comunicación","how":"Explica a funcionarios qué cambia en su trabajo y ofrece instrucciones, formación y un canal de dudas. A usuarios comunica cómo acceder a la mejora, desde cuándo y qué límites tiene. Coordina redes, web, atención presencial y prensa según el público; anuncia resultados únicamente con evidencia disponible.","example":"El equipo de atención recibe una guía para orientar solicitudes. Los usuarios encuentran la misma información en web y oficina; un mensaje público explica la mejora sin afirmar que se eliminaron todos los errores.","output":"Plan de transición con mensajes, canales y responsables.","owner":"Responsable del servicio y comunicaciones","tool":"comunicacion","gate":"Personal y usuarios reciben información coherente y saben cómo usar el cambio."}],[{"title":"Acordar qué decisión informará la evaluación","dimension":"Política e institucional","how":"Reúne al responsable del servicio y a quienes deciden continuidad o recursos. Define qué quieren saber y qué harán con los resultados. Asegura acceso autorizado a información y una revisión donde puedan decidir; evita producir indicadores que nadie utilizará.","example":"La dirección acuerda que revisará si una mejora reduce visitas repetidas y mantiene accesibilidad antes de autorizar una ampliación.","output":"Pregunta de evaluación y decisión asociada.","owner":"Jefatura del servicio y responsables de evaluación","tool":"raci","gate":"Hay una decisión concreta, responsables y acceso a información por confirmar o acordado."},{"title":"Construir una línea de base y reconocer los límites","dimension":"Evidencia","how":"Define resultados para las personas y revisa qué información previa existe. Registra fuentes, calidad, frecuencia y vacíos. Distingue actividades de resultados y de impacto; analiza explicaciones alternativas y solicita apoyo especializado si necesitas inferir efectos causales.","example":"Contar talleres no indica que mejoró un servicio. El equipo registra visitas repetidas y comprensión de requisitos, e informa que una comparación antes/después por sí sola no demuestra causalidad.","output":"Línea de base y ficha de indicadores con limitaciones.","owner":"Evaluación, datos y personal del servicio","tool":"indicadores","gate":"Las medidas tienen fuente y definición; las conclusiones respetan el alcance del método."},{"title":"Organizar un seguimiento que permita aprender","dimension":"Técnica","how":"Dibuja cómo la intervención podría producir el resultado esperado e identifica supuestos. Selecciona pocas medidas útiles, define responsables y un registro simple. Agenda revisiones para interpretar datos y experiencia de usuarios y documentar las decisiones tomadas.","example":"Una orientación más clara debería reducir errores si las personas la reciben y comprenden. El seguimiento verifica ambas condiciones, además de las solicitudes incompletas.","output":"Teoría de cambio y rutina de revisión de resultados.","owner":"Equipo de proyecto y evaluación","tool":"cambio","gate":"El seguimiento comprueba supuestos y permite modificar el trabajo."},{"title":"Comunicar resultados sin exagerar sus alcances","dimension":"Comunicación","how":"Prepara una síntesis que explique qué se observó, con qué datos, en qué periodo y con qué límites. Adapta el mensaje para autoridades, funcionarios y ciudadanía. Incluye dificultades y próximos pasos; solicita revisión técnica antes de publicar cifras o atribuir impacto.","example":"Un comunicado informa menos errores en la oficina participante, aclara el alcance de la prueba y evita afirmar una mejora en todo el municipio.","output":"Síntesis revisada de resultados y límites.","owner":"Evaluación y comunicaciones","tool":"comunicacion","gate":"Las afirmaciones públicas pueden vincularse a una fuente y alcance claros."}],[{"title":"Acordar vocerías y decisiones de comunicación","dimension":"Política e institucional","how":"Identifica quién valida mensajes, quién habla en nombre del proyecto y qué áreas deben coordinarse. Acuerda cómo informar dificultades y resolver mensajes contradictorios. Vincula la comunicación con el propósito público y las decisiones del proyecto, no solo con hitos de autoridades.","example":"La dirección valida cambios del servicio, evaluación revisa cifras y comunicaciones prepara el mensaje. Un canal definido permite explicar una demora sin que cada área publique una versión diferente.","output":"Vocerías y matriz de validación de mensajes.","owner":"Autoridad patrocinadora, responsable del servicio y comunicaciones","tool":"raci","gate":"Existe una ruta de validación y respuesta para mensajes relevantes."},{"title":"Conocer públicos y comprobar la comprensión","dimension":"Evidencia","how":"Pregunta a usuarios, funcionarios y aliados qué necesitan saber y por qué canales reciben información. Revisa dudas, consultas y barreras de acceso. Prueba un mensaje con personas del público antes de difundirlo y observa si comprenden qué deben hacer; alcance en redes no equivale a comprensión o legitimidad.","example":"Un mensaje sobre un nuevo trámite recibe muchas vistas, pero las consultas muestran que no se entiende quién puede usarlo. El equipo ajusta requisitos y prueba la explicación con usuarios.","output":"Mapa de públicos, necesidades informativas y prueba de mensajes.","owner":"Participación, atención ciudadana y comunicaciones","tool":"entrevistas","gate":"El mensaje permite comprender la acción esperada y no depende solo de métricas de difusión."},{"title":"Preparar un calendario y un sistema de respuesta","dimension":"Técnica","how":"Organiza mensajes por público, etapa, canal y responsable. Coordina web, atención, redes y medios según pertinencia, con información consistente. Define quién contesta dudas y cómo se actualizan materiales cuando cambie el proyecto; reserva tiempo para devolución y aprendizaje.","example":"Antes del cambio se informa al personal, durante el lanzamiento se actualizan web y oficina, y después se revisan dudas para corregir materiales y devolver resultados.","output":"Calendario con piezas, responsables y canal de respuesta.","owner":"Comunicaciones y operación del servicio","tool":"comunicacion","gate":"Cada pieza tiene responsable, momento, público y una acción esperada."},{"title":"Dar visibilidad con evidencia y devolver resultados","dimension":"Comunicación","how":"Redacta un mensaje que explique problema, avance comprobable y próximo paso. Diferencia lo que necesitan autoridades, personal, usuarios y aliados. Elige prensa, medios masivos, redes o canales locales según a quién buscas llegar. Publica también dificultades y explica qué aportes se incorporaron y cuáles no.","example":"Una nota de prensa explica la mejora probada y sus límites; una publicación en redes orienta cómo usarla; una devolución a participantes informa qué se cambió gracias a sus aportes.","output":"Mensajes y devolución respaldados por evidencia.","owner":"Comunicaciones, responsable del servicio y participación","tool":"comunicacion","gate":"El público sabe qué cambió, cómo participar o utilizarlo y dónde consultar."}]],"en":[[{"title":"Agree a mandate and political sponsor","dimension":"Political and institutional","how":"Prepare a one-page brief covering the public need, scope and decisions requested. Meet the sponsor and service lead to agree who authorises, who delivers and how blockers will be resolved. Ask for verifiable commitments rather than a general statement of support.","example":"For business permits, the sponsor authorises cross-department coordination, appoints a lead and agrees where unresolved decisions will be escalated.","output":"Completed purpose, mandate and sponsorship worksheet, recording decisions, commitments and outstanding issues.","owner":"Political sponsor and innovation lead","tool":"mandato","gate":"Present the worksheet to the sponsor and record agreed commitments."},{"title":"Ground the mandate in evidence of the problem","dimension":"Evidence","how":"Review complaints, waiting times and institutional priorities. Speak with users an
