d frontline staff to check the records. Explain who faces the difficulty and what remains uncertain; other cities having a lab does not by itself justify creating one.","example":"Records show repeat visits for a permit. The team checks whether confusing requirements explain them before proposing a new structure.","output":"Completed challenge framing and design questions, recording decisions, commitments and outstanding issues.","owner":"Political sponsor and innovation lead","tool":"desafio","gate":"Explore alternatives without building a particular technology into the question."},{"title":"Turn the mandate into working rules","dimension":"Technical","how":"Use a responsibilities matrix for prioritisation, testing, budget and adoption. Set a coordination routine and a simple decision log. Review formalisation with the relevant department: a matrix cannot override formal powers.","example":"The lab facilitates design, the service director owns operational decisions, budget reviews resources and legal staff assess the institutional route.","output":"Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.","owner":"Political sponsor and innovation lead","tool":"raci","gate":"Confirm responsibilities with the named people. The matrix does not replace their formal powers."},{"title":"Explain the mandate and mobilise internal participation","dimension":"Communication","how":"Write a short message explaining why the space exists, what it can do and how departments can request support. Validate it with the sponsor before wider publication. Include a contact channel and a concrete invitation; check whether staff understand their role.","example":"An internal invitation asks each department to propose a challenge with an owner and evidence. Public communication explains the purpose without promising results that do not yet exist.","output":"Completed communication and feedback plan, recording decisions, commitments and outstanding issues.","owner":"Political sponsor and innovation lead","tool":"comunicacion","gate":"Provide feedback and check understanding and participation as well as reach."}],[{"title":"Agree access to the service and its staff","dimension":"Political and institutional","how":"Agree the research scope with the service lead, including staff time and authorised access to records. Identify who will validate the challenge and what decisions the team may take afterwards. Address relevant safeguards before collecting information.","example":"The service lead names a contact, allows observation of guidance and agrees to review the problem brief before solution development.","output":"Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.","owner":"Service owner and research facilitator","tool":"raci","gate":"Confirm responsibilities with the named people. The matrix does not replace their formal powers."},{"title":"Listen to users and cross-check records","dimension":"Evidence","how":"Review complaints, delays and errors. Use exploratory interviews with different profiles, including people facing access barriers. Ask about specific experiences and avoid unnecessary personal identifiers. Expand the research if the first round leaves important differences unexplained.","example":"Incomplete applications may reflect confusing information for some users and lack of digital access for others. Those causes need different responses.","output":"Completed exploratory interview guide, recording decisions, commitments and outstanding issues.","owner":"Service owner and research facilitator","tool":"entrevistas","gate":"Include missing profiles and use the findings to build a user journey map."},{"title":"Frame an actionable challenge before choosing solutions","dimension":"Technical","how":"Map service steps with users and staff. Identify where the difficulty occurs and describe who needs what improvement and why. Compare scope, feasibility and the service owner's commitment; avoid treating a platform as the problem itself.","example":"Replace 'we need an app' with 'how might we help applicants understand requirements before they visit the office?'","output":"Completed user journey map, recording decisions, commitments and outstanding issues.","owner":"Service owner and research facilitator","tool":"recorrido","gate":"Frame the challenge around obstacles supported by evidence."},{"title":"Invite participation and return findings","dimension":"Communication","how":"Explain why people are invited, how their input will be used and what cannot yet be promised. Choose accessible channels: offices, telephone, community organisations or social media as appropriate. Return findings and explain what the team will investigate next.","example":"An office invitation recruits recent applicants. A follow-up brief explains the difficulties identified and the next step.","output":"Completed communication and feedback plan, recording decisions, commitments and outstanding issues.","owner":"Service owner and research facilitator","tool":"comunicacion","gate":"Provide feedback and check understanding and participation as well as reach."}],[{"title":"Agree staff time and resources with department heads","dimension":"Political and institutional","how":"Meet the departments whose capabilities are needed. Ask for specific allocated time, a contact and a way to resolve competing priorities. Distinguish confirmed resources from pending requests. Start with a scope that can be sustained without informal favours.","example":"Technology appoints a feasibility contact, legal staff join relevant decisions and the director allocates staff time to one initial challenge.","output":"Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.","owner":"Operations, people and budget teams","tool":"raci","gate":"Confirm responsibilities with the named people. The matrix does not replace their formal powers."},{"title":"Check actual capabilities and availability","dimension":"Evidence","how":"List project tasks and required skills. Check capacity against workloads, experience and resources. Identify what can be shared and what must be obtained; a long list of participants is not the same as an operational team.","example":"The team has frontline expertise but lacks data evaluation skills. It secures support from another department rather than starting several unsupported pilots.","output":"Completed capabilities and resources matrix, recording decisions, commitments and outstanding issues.","owner":"Operations, people and budget teams","tool":"capacidades","gate":"Reduce the portfolio if critical gaps have neither an owner nor resources."},{"title":"Organise a viable initial operation","dimension":"Technical","how":"Keep the portfolio small and allocate tasks according to actual capacity. Estimate research, testing, evaluation and continuity costs. Create a working schedule and review progress. Shared rooms and expertise may be sufficient without a dedicated building.","example":"A part-time team starts one challenge, uses existing meeting rooms and secures data support for evaluation. Other projects wait for confirmed capacity.","output":"Completed capabilities and resources matrix, recording decisions, commitments and outstanding issues.","owner":"Operations, people and budget teams","tool":"capacidades","gate":"Reduce the portfolio if critical gaps have neither an owner nor resources."},{"title":"Explain the support offer and its limits","dimension":"Communication","how":"Publish what support is available, for whom, how to request it and how much work the team can accept. Explain departmental participation needs and the status of requests. Avoid a launch campaign that promises more projects than available capacity permits.","example":"An internal page offers support for one initial challenge and explains selection criteria, the requesting department's commitment and where to ask questions.","output":"Completed communication and feedback plan, recording decisions, commitments and outstanding issues.","owner":"Operations, people and budget teams","tool":"comunicacion","gate":"Provide feedback and check understanding and participation as well as reach."}],[{"title":"Agree who decides at each stage","dimension":"Political and institutional","how":"Meet the service owner and those who authorise resources or changes. Define which decisions need validation and how they will be reviewed. Agree how a project can be stopped or adjusted without automatically treating learning as failure.","example":"Before testing, the lead agrees it can stop if user experience does not improve or risks appear, and records who will make that decision.","output":"Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.","owner":"Innovation lead and project owners","tool":"raci","gate":"Confirm responsibilities with the named people. The matrix does not replace their formal powers."},{"title":"Identify where projects get stuck","dimension":"Evidence","how":"Reconstruct a recent project's decisions, timing and deliverables. Ask what information was missing and which approvals caused delays. Distinguish process weaknesses from restrictions that require action beyond the project team.","example":"A completed prototype waited weeks because no adoption owner had been identified. The process is changed to involve that department from the start.","output":"Completed user journey map, recording decisions, commitments and outstanding issues.","owner":"Innovation lead and project owners","tool":"recorrido","gate":"Frame the challenge around obstacles supported by evidence."},{"title":"Test a simple process on a real project","dimension":"Technical","how":"Define stages from problem framing to adoption, each with a deliverable and an advancement criterion. Use a simple board or log for tasks and unresolved issues. Apply the process to one real project and adapt it afterwards instead of imposing every method on every challenge.","example":"A project moves through problem framing, alternatives, testing and adoption decisions. Each review checks a specific deliverable before committing further resources.","output":"Completed challenge prioritisation matrix, recording decisions, commitments and outstanding issues.","owner":"Innovation lead and project owners","tool":"priorizacion","gate":"Create challenge worksheets and assign an owner to each selected project."},{"title":"Make progress, decisions and blockers visible","dimension":"Communication","how":"Set a regular update covering status, the next decision, its owner and support required. Use internal channels where decision-makers can respond. Share learning from adjustments or stopped work without concealing problems or disclosing sensitive information.","example":"The update states that authorised data access is the next decision and identifies who must resolve it, rather than only reporting that a workshop took place.","output":"Completed communication and feedback plan, recording decisions, commitments and outstanding issues.","owner":"Innovation lead and project owners","tool":"comunicacion","gate":"Provide feedback and check understanding and participation as well as reach."}],[{"title":"Align partners' interests and commitments","dimension":"Political and institutional","how":"Bring relevant actors together around a specific challenge. Ask what value they expect, what they can contribute and who may commit that contribution. Agree coordination rules and examine any necessary agreements with competent departments. Attendance is not an active partnership.","example":"A municipality, university and company explore a water-efficiency test, identifying contributions, limits and owners before announcing collaboration.","output":"Completed stakeholder and contributions map, recording decisions, commitments and outstanding issues.","owner":"Ecosystem coordinator and partner contacts","tool":"actores","gate":"Agree a shared agenda and review actual contributions."},{"title":"Map contributions and missing actors","dimension":"Evidence","how":"Record capabilities, interests and existing connections in relation to the challenge. Check potential contributions against availability. Include users and local organisations to identify unrepresented needs and relationships that must be strengthened.","example":"Several technology providers are interested, but user insight and evaluation capacity are missing. The map makes those gaps visible.","output":"Completed stakeholder and contributions map, recording decisions, commitments and outstanding issues.","owner":"Ecosystem coordinator and partner contacts","tool":"actores","gate":"Agree a shared agenda and review actual contributions."},{"title":"Activate a manageable collaborative project","dimension":"Technical","how":"Select a bounded project with agreed owners and resources. Define milestones, information exchange and commitment reviews. Document who delivers each task and what changes if a contribution does not materialise.","example":"The university evaluates, the municipality provides access to facilities and the company supplies a prototype. Partners review delivery before considering expansion.","output":"Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.","owner":"Ecosystem coordinator and partner contacts","tool":"raci","gate":"Confirm responsibilities with the named people. The matrix does not replace their formal powers."},{"title":"Mobilise partners with a concrete proposition","dimension":"Communication","how":"Tailor messages for business, academia, civil society and public departments. Explain the challenge, contributions sought and how to participate. Choose meetings, social media or press according to audience. Communicate actual contributions and return findings to participants.","example":"A call seeks accessibility-evaluation support rather than asking organisations generically to 'join the ecosystem'. It later explains which partnerships became active.","output":"Completed communication and feedback plan, recording decisions, commitments and outstanding issues.","owner":"Ecosystem coordinator and partner contacts","tool":"comunicacion","gate":"Provide feedback and check understanding and participation as well as reach."}],[{"title":"Enable the test and agree decision authority","dimension":"Political and institutional","how":"Identify the service owner, those authorising the test and the potential adopter. Review applicable safeguards with competent teams. Agree who may change or stop the test and how incidents will be handled before inviting users.","example":"A telephone-guidance test has a responsible lead, a reviewed script and an issue channel; it is not launched on an informal team member's approval alone.","output":"Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.","owner":"Pilot lead, service owner and evaluator","tool":"raci","gate":"Confirm responsibilities with the named people. The matrix does not replace their formal powers."},{"title":"Define the uncertainty the pilot must resolve","dimension":"Evidence","how":"Formulate the hypothesis and learning needed for a decision. Gather baseline information and choose outcome and unintended-effect indicators. Define how changes will be interpreted and what cannot be attributed to the pilot; evaluation should match risk and scope.","example":"The hypothesis is that advance guidance reduces incomplete applications. The team records errors before and during the test and checks whether applicant profiles changed.","output":"Completed indicators and baseline worksheet, recording decisions, commitments and outstanding issues.","owner":"Pilot lead, service owner and evaluator","tool":"indicadores","gate":"Review indicators at each decision point; avoid measuring activity alone."},{"title":"Design a small, documented test","dimension":"Technical","how":"Prepare a protocol covering users, duration to be agreed, procedure, data, risks and responsibilities. Build the smallest prototype needed to learn. Rehearse with staff and schedule a final review that produces a decision, not just a report.","example":"A requirements checklist is tested in one office, with doubts and errors recorded. It is adjusted before other offices are considered.","output":"Completed prototype and experimentation protocol, recording decisions, commitments and outstanding issues.","owner":"Pilot lead, service owner and evaluator","tool":"piloto","gate":"Review evidence and safeguards. A test does not automatically justify expansion."},{"title":"Explain the test and return its learning","dimension":"Communication","how":"Tell users and staff the purpose, scope, consultation channel and experimental nature of the initiative. Review messages and participation conditions in context. At the end, explain findings and the decision; launching a pilot is not itself a successful outcome.","example":"The invitation explains that new guidance is being tested. The closing message explains whether it will continue, change or stop, and the evidence behind that decision.","output":"Completed communication and feedback plan, recording decisions, commitments and outstanding issues.","owner":"Pilot lead, service owner and evaluator","tool":"comunicacion","gate":"Provide feedback and check understanding and participation as well as reach."}],[{"title":"Agree who will adopt and sustain the solution","dimension":"Political and institutional","how":"Meet the service lead and relevant budget, technology or legal departments. Bring a one-page brief with the problem, findings and requested decision. Agree who will operate the solution, which commitments can be made and which approvals remain outstanding.","example":"After testing permit guidance, the service director assigns information maintenance and staff training. The lab supports transfer but does not replace the service owner.","output":"Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.","owner":"Service owner, operations and budget teams","tool":"raci","gate":"Confirm responsibilities with the named people. The matrix does not replace their formal powers."},{"title":"Check whether evidence justifies continuation","dimension":"Evidence","how":"Bring together before-and-after data and user and staff experience. Review what improved, for whom and what remains difficult. Check changes in volume, staffing or user profiles; if evidence is insufficient, agree a further test before recommending expansion.","example":"Incomplete applications declined, but staffing also changed. Interviews and records help examine alternative explanations before crediting the pilot.","output":"Completed indicators and baseline worksheet, recording decisions, commitments and outstanding issues.","owner":"Service owner, operations and budget teams","tool":"indicadores","gate":"Review indicators at each decision point; avoid measuring activity alone."},{"title":"Prepare gradual incorporation into the service","dimension":"Technical","how":"Agree procedures, training, maintenance, recurring costs and monitoring with the receiving department. Review technical dependencies and the adoption route with competent teams. Begin with a manageable scope and define what must be checked before expansion or replication.","example":"New guidance starts in one office. Named staff update materials and review errors; it expands only when it works and resources can sustain it.","output":"Completed adoption and continuity plan, recording decisions, commitments and outstanding issues.","owner":"Service owner, operations and budget teams","tool":"adopcion","gate":"Confirm resources and the adoption route before committing to expansion dates."},{"title":"Communicate the change and support uptake","dimension":"Communication","how":"Explain to staff what changes in their work, providing instructions, training and a question channel. Tell users how and when to access the improvement and its limits. Coordinate social media, web, offices and press according to audience; only announce evidence-supported results.","example":"Frontline staff receive a guidance sheet. Website and office information match, and the public message explains the improvement without claiming that all errors have disappeared.","output":"Completed communication and feedback plan, recording decisions, commitments and outstanding issues.","owner":"Service owner, operations and budget teams","tool":"comunicacion","gate":"Provide feedback and check understanding and participation as well as reach."}],[{"title":"Agree which decision the evaluation will inform","dimension":"Political and institutional","how":"Meet the service owner and those deciding continuation or resources. Define what they need to know and what they will do with findings. Secure authorised information access and a decision review. Avoid producing indicators that nobody will use.","example":"The director agrees to review repeat visits and accessibility before authorising expansion.","output":"Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.","owner":"Evaluation, data and service teams","tool":"raci","gate":"Confirm responsibilities with the named people. The matrix does not replace their formal powers."},{"title":"Build a baseline and acknowledge limits","dimension":"Evidence","how":"Define outcomes for people and review existing information. Record sources, quality, frequency and gaps. Distinguish activities, outcomes and impact; examine alternative explanations and seek specialist support when causal inference is needed.","example":"Workshop counts do not show service improvement. The team measures repeat visits and understanding and explains that a before-and-after comparison alone does not establish causality.","output":"Completed indicators and baseline worksheet, recording decisions, commitments and outstanding issues.","owner":"Evaluation, data and service teams","tool":"indicadores","gate":"Review indicators at each decision point; avoid measuring activity alone."},{"title":"Organise monitoring that supports learning","dimension":"Technical","how":"Explain how the intervention could produce the intended outcome and identify assumptions. Choose a few useful measures, assign owners and use a simple record. Schedule reviews combining data and user experience, documenting resulting decisions.","example":"Clearer guidance should reduce errors if people receive and understand it. Monitoring checks both assumptions as well as incomplete applications.","output":"Completed practical theory of change, recording decisions, commitments and outstanding issues.","owner":"Evaluation, data and service teams","tool":"cambio","gate":"Turn outcomes into indicators and evaluate assumptions."},{"title":"Communicate findings without overstating them","dimension":"Communication","how":"Prepare a summary explaining what was observed, with which data, over what period and with which limitations. Tailor messages for authorities, staff and residents. Include difficulties and next steps; request technical review before publishing figures or claiming impact.","example":"A message reports fewer errors in the participating office, states the test's scope and avoids claiming improvement across the municipality.","output":"Completed communication and feedback plan, recording decisions, commitments and outstanding issues.","owner":"Evaluation, data and service teams","tool":"comunicacion","gate":"Provide feedback and check understanding and participation as well as reach."}],[{"title":"Agree spokespersons and communication decisions","dimension":"Political and institutional","how":"Identify message approvers, spokespersons and departments that must coordinate. Agree how to report difficulties and resolve inconsistent messages. Link communication to public purpose and project decisions rather than political milestones alone.","example":"The director validates service changes, evaluation reviews figures and communications prepares the message. A clear channel prevents conflicting explanations of a delay.","output":"Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.","owner":"Communications, project lead and participation team","tool":"raci","gate":"Confirm responsibilities with the named people. The matrix does not replace their formal powers."},{"title":"Understand audiences and check comprehension","dimension":"Evidence","how":"Ask users, staff and partners what they need to know and which channels they use. Review questions and access barriers. Test a message with its intended audience before publication and check whether people understand the expected action; reach is not comprehension or legitimacy.","example":"A message gets many views but users do not understand eligibility. The team clarifies requirements and tests the explanation with users.","output":"Completed exploratory interview guide, recording decisions, commitments and outstanding issues.","owner":"Communications, project lead and participation team","tool":"entrevistas","gate":"Include missing profiles and use the findings to build a user journey map."},{"title":"Prepare a calendar and a response process","dimension":"Technical","how":"Organise messages by audience, stage, channel and owner. Coordinate web, frontline information, social media and relevant media with consistent content. Define who answers questions and updates material when the project changes; allow time for feedback and learning.","example":"Staff are informed before the change, web and office information are updated at launch, and questions inform subsequent corrections.","output":"Completed communication and feedback plan, recording decisions, commitments and outstanding issues.","owner":"Communications, project lead and participation team","tool":"comunicacion","gate":"Provide feedback and check understanding and participation as well as reach."},{"title":"Build visibility with evidence and return findings","dimension":"Communication","how":"Write messages explaining the problem, a verifiable development and the next step. Distinguish what authorities, staff, users and partners need. Select press, mass media, social media or local channels accordingly. Report difficulties and explain which contributions were incorporated and why.","example":"A press note explains a tested improvement and its limits, a social post tells people how to use it, and participant feedback explains changes made from their input.","output":"Completed communication and feedback plan, recording decisions, commitments and outstanding issues.","owner":"Communications, project lead and participation team","tool":"comunicacion","gate":"Provide feedback and check understanding and participation as well as reach."}]]},"anchors":{"es":[["No hay respaldo ni mandato acordado.","Hay respaldo verbal, sin responsabilidades ni recursos acordados.","Hay patrocinador y mandato; faltan decisiones o recursos por cerrar.","Mandato, responsables y recursos funcionan en proyectos reales.","Además, la gobernanza se revisa y tiene mecanismos de continuidad."],["Los desafíos se eligen sin evidencia.","Hay intuiciones o registros aislados, sin escuchar a usuarios.","Hay un problema delimitado y una primera escucha de usuarios.","Se combinan datos, usuarios y análisis de causas para priorizar.","El proceso se aplica regularmente y se revisa su calidad."],["No hay personas ni recursos asignados.","Hay apoyos informales o dedicación ocasional.","Hay responsable y dedicación; faltan capacidades o recursos.","Hay capacidades y recursos suficientes para la cartera actual.","Se planifican continuidad, reemplazos y fortalecimiento de capacidades."],["No existe un proceso de trabajo.","Se trabaja de forma ocasional, sin criterios compartidos.","Hay etapas y plan inicial, todavía aplicados de forma irregular.","Se usan etapas, responsables y criterios para continuar o detener.","El proceso se mejora con aprendizajes documentados de proyectos."],["No se han identificado aliados.","Hay contactos, pero sin contribuciones concretas.","Hay aliados con contribuciones para un primer proyecto.","Existe agenda compartida, responsables y seguimiento de compromisos.","La colaboración se sostiene y se revisan aportes y resultados."],["No se han diseñado ni realizado pruebas.","Hay ideas de pruebas, sin hipótesis ni protocolo.","Se realiza una prueba con hipótesis, usuarios y alcance definidos.","Las pruebas incluyen riesgos, datos y criterios previos de decisión.","Se documentan aprendizajes y se usan para continuar, ajustar o detener."],["No se ha definido quién adoptaría las soluciones.","Hay intención de adoptar, sin responsable ni vía acordada.","Hay área responsable y plan inicial de adopción.","Una solución se incorporó a la operación con recursos y mantenimiento.","La adopción se sostiene y la ampliación o réplica se evalúa con evidencia."],["No se han definido resultados ni indicadores.","Se cuentan actividades, sin línea de base ni resultados para usuarios.","Hay resultados esperados e indicadores con una primera línea de base.","Se revisan resultados con fuentes, responsables y límites de atribución.","La evidencia se usa regularmente para decidir y revisar efectos no deseados."],["No se planifica la comunicación.","Se difunden actividades, sin públicos ni mensajes definidos.","Hay públicos, mensajes, canales y responsables definidos.","Se comunica evidencia y se devuelve a participantes lo aprendido.","Se revisa comprensión y apropiación; se comunican también límites y dificultades."]],"en":[["No support or agreed mandate.","Verbal support, without agreed responsibilities or resources.","A sponsor and mandate exist; decisions or resources remain outstanding.","Mandate, owners and resources work in real projects.","Governance is reviewed and has continuity mechanisms."],["Challenges are selected without evidence.","Isolated ideas or records, without listening to users.","A bounded problem and initial user research exist.","Data, user insight and cause analysis inform prioritisation.","The process is applied regularly and its quality reviewed."],["No people or resources assigned.","Informal support or occasional staff time.","A lead and allocated time exist; skills or resources remain missing.","Capabilities and resources support the current portfolio.","Continuity, replacements and capability development are planned."],["No working process exists.","Occasional work without shared criteria.","Initial stages and a plan exist but are applied inconsistently.","Stages, owners and criteria to continue or stop are used.","Documented project learning improves the process."],["No partners identified.","Contacts exist without concrete contributions.","Partners contribute to an initial project.","A shared agenda, owners and commitment monitoring exist.","Collaboration is sustained and contributions and outcomes reviewed."],["No tests designed or delivered.","Testing ideas without a hypothesis or protocol.","A test has a hypothesis, users and defined scope.","Tests include risks, data and prior decision criteria.","Documented learning informs continuation, adjustment or stopping."],["No adoption owner identified.","Intention to adopt without an owner or agreed route.","A receiving department and initial adoption plan exist.","A solution operates with resources and maintenance.","Adoption is sustained; expansion or replication is assessed with evidence."],["No outcomes or indicators defined.","Activities counted without baseline or user outcomes.","Intended outcomes, indicators and an initial baseline exist.","Findings are reviewed with sources, owners and attribution limits.","Evidence routinely informs decisions and unintended effects are reviewed."],["Communication is not planned.","Activities publicised without defined audiences or messages.","Audiences, messages, channels and owners are defined.","Evidence is communicated and learning returned to participants.","Understanding and uptake are reviewed; difficulties and limits are communicated."]]}},PDFS={"es": {"mandato": "JVBERi0xLjQKJZOMi54gUmVwb3J0TGFiIEdlbmVyYXRlZCBQREYgZG9jdW1lbnQgKG9wZW5zb3VyY2UpCjEgMCBvYmoKPDwKL0YxIDIgMCBSIC9GMiAzIDAgUgo+PgplbmRvYmoKMiAwIG9iago8PAovQmFzZUZvbnQgL0hlbHZldGljYSAvRW5jb2RpbmcgL1dpbkFuc2lFbmNvZGluZyAvTmFtZSAvRjEgL1N1YnR5cGUgL1R5cGUxIC9UeXBlIC9Gb250Cj4+CmVuZG9iagozIDAgb2JqCjw8Ci9CYXNlRm9udCAvSGVsdmV0aWNhLUJvbGQgL0VuY29kaW5nIC9XaW5BbnNpRW5jb2RpbmcgL05hbWUgL0YyIC9TdWJ0eXBlIC9UeXBlMSAvVHlwZSAvRm9udAo+PgplbmRvYmoKNCAwIG9iago8PAovQ29udGVudHMgOSAwIFIgL01lZGlhQm94IFsgMCAwIDU5NS4yNzU2IDg0MS44ODk4IF0gL1BhcmVudCA4IDAgUiAvUmVzb3VyY2VzIDw8Ci9Gb250IDEgMCBSIC9Qcm9jU2V0IFsgL1BERiAvVGV4dCAvSW1hZ2VCIC9JbWFnZUMgL0ltYWdlSSBdCj4+IC9Sb3RhdGUgMCAvVHJhbnMgPDwKCj4+IAogIC9UeXBlIC9QYWdlCj4+CmVuZG9iago1IDAgb2JqCjw8Ci9Db250ZW50cyAxMCAwIFIgL01lZGlhQm94IFsgMCAwIDU5NS4yNzU2IDg0MS44ODk4IF0gL1BhcmVudCA4IDAgUiAvUmVzb3VyY2VzIDw8Ci9Gb250IDEgMCBSIC9Qcm9jU2V0IFsgL1BERiAvVGV4dCAvSW1hZ2VCIC9JbWFnZUMgL0ltYWdlSSBdCj4+IC9Sb3RhdGUgMCAvVHJhbnMgPDwKCj4+IAogIC9UeXBlIC9QYWdlCj4+CmVuZG9iago2IDAgb2JqCjw8Ci9QYWdlTW9kZSAvVXNlTm9uZSAvUGFnZXMgOCAwIFIgL1R5cGUgL0NhdGFsb2cKPj4KZW5kb2JqCjcgMCBvYmoKPDwKL0F1dGhvciAoXChhbm9ueW1vdXNcKSkgL0NyZWF0aW9uRGF0ZSAoRDoyMDI2MTAwNDIwNDQwOS0wNCcwMCcpIC9DcmVhdG9yIChcKHVuc3BlY2lmaWVkXCkpIC9LZXl3b3JkcyAoKSAvTW9kRGF0ZSAoRDoyMDI2MTAwNDIwNDQwOS0wNCcwMCcpIC9Qcm9kdWNlciAoUmVwb3J0TGFiIFBERiBMaWJyYXJ5IC0gXChvcGVuc291cmNlXCkpIAogIC9TdWJqZWN0IChcKHVuc3BlY2lmaWVkXCkpIC9UaXRsZSAoXChhbm9ueW1vdXNcKSkgL1RyYXBwZWQgL0ZhbHNlCj4+CmVuZG9iago4IDAgb2JqCjw8Ci9Db3VudCAyIC9LaWRzIFsgNCAwIFIgNSAwIFIgXSAvVHlwZSAvUGFnZXMKPj4KZW5kb2JqCjkgMCBvYmoKPD const root=document.getElementById('gh-preview');let language='es',step=0,showResult=false;
try{language=localStorage.getItem('es-lang')==='en'?'en':'es';}catch(e){}
const L=(es,en)=>language==='es'?es:en,db=()=>DATA[language],A=()=>DATA.actions[language];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={scores:[],tasks:{},project:'',stage:'new'},services=[];
try{const s=JSON.parse(localStorage.getItem('gh-radar-v3')||'null');if(s&&Array.isArray(s.scores))state={...state,...s};const p=JSON.parse(localStorage.getItem('gh-services-v1')||'null');if(Array.isArray(p))services=p;}catch(e){}
const save=()=>{try{localStorage.setItem('gh-radar-v3',JSON.stringify(state));localStorage.setItem('gh-services-v1',JSON.stringify(services));}catch(e){const n=root.querySelector('#gh-save-note');if(n)n.textContent=L('No se pudo guardar. Descarga una copia antes de salir.','Unable to save. Download a copy before leaving.');}};
const status=i=>!Number.isInteger(state.scores[i])?'unknown':state.scores[i]<=2?'absent':state.scores[i]===3?'partial':'ready';
const rows=()=>db().pillars.map((p,i)=>({p,i,status:status(i)}));
function selection(){const r=rows(),g=r.filter(x=>['absent','partial'].includes(x.status)).sort((a,b)=>state.scores[a.i]-state.scores[b.i]||a.i-b.i),u=r.filter(x=>x.status==='unknown');if(status(0)==='unknown')return {row:r[0],reason:L('Primero verifica el mandato y los responsables. Sin información no significa una brecha, pero falta confirmar quién autoriza y sostiene el trabajo.','First verify the mandate and accountable owners. Missing information is not a deficit, but decision authority and continuity remain unconfirmed.')};if(state.scores[0]<=2)return {row:r[0],reason:L('El respaldo y el mandato habilitan el resto: acuerda estas condiciones antes de comprometer pilotos o inversiones.','Support and mandate enable the rest: agree these conditions before committing to pilots or investments.')};if(g[0]&&[5,6].includes(g[0].i)&&state.scores[2]<=2)return {row:r[2],reason:L('Acuerda equipo y recursos antes de probar o ampliar soluciones.','Agree team capacity and resources before testing or expanding solutions.')};return {row:g[0]||u[0]||r[0],reason:L(g.length?'Se propone la brecha con menor nivel declarado; los empates siguen el orden de condiciones. Confirma la prioridad con tu equipo.':u.length?'Confirma la información pendiente antes de concluir sobre el perfil.':'Mantén y comprueba las capacidades declaradas, comenzando por gobernanza.',g.length?'The lowest declared capability is suggested; ties follow the condition order. Confirm the priority with your team.':u.length?'Verify missing information before drawing conclusions about the profile.':'Maintain and verify declared capabilities, starting with governance.')};}
function radar(){const names=language==='es'?['Gobernanza','Desafíos','Equipo','Método','Colaboración','Pilotos','Adopción','Evaluación','Comunicación']:['Governance','Challenges','Team','Methods','Collaboration','Pilots','Adoption','Evaluation','Communication'];const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/9;return [270+Math.cos(a)*150*v/5,245+Math.sin(a)*150*v/5];};let s='<svg class="gh-radar-svg" viewBox="0 0 540 500" role="img" aria-label="'+L('Perfil de capacidades declaradas. Valores exactos en la tabla.','Declared capability profile. Exact values in the table.')+'">';for(let k=1;k<=5;k++)s+='<polygon points="'+names.map((_,i)=>pt(i,k).join(',')).join(' ')+'" fill="none" stroke="#cbd6cf"/><text x="278" y="'+(245-150*k/5+4)+'" fill="#536564" font-size="11">'+k+'</text>';names.forEach((n,i)=>{const [x,y]=pt(i,5),[lx,ly]=pt(i,6.35);s+='<line x1="270" y1="245" x2="'+x+'" y2="'+y+'" stroke="#cbd6cf"/><text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#142e32">'+n+(!Number.isInteger(state.scores[i])?' *':'')+'</text>';});if(names.every((_,i)=>Number.isInteger(state.scores[i])))s+='<polygon points="'+names.map((_,i)=>pt(i,state.scores[i]).join(',')).join(' ')+'" fill="#16786d" fill-opacity=".15" stroke="#16786d" stroke-width="3"/>';else names.forEach((_,i)=>{const j=(i+1)%9;if(Number.isInteger(state.scores[i])&&Number.isInteger(state.scores[j])){const a=pt(i,state.scores[i]),b=pt(j,state.scores[j]);s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#16786d" stroke-width="3"/>';}});names.forEach((_,i)=>{if(Number.isInteger(state.scores[i])){const [x,y]=pt(i,state.scores[i]);s+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="#16786d"/>';}});return s+'</svg>';}
function paper(title,body){return '<!doctype html><html lang="'+language+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(title)+'</title><style>body{font:16px/1.6 Arial;color:#142e32;max-width:900px;margin:30px auto;padding:20px}h1{font-size:29px}h2{font-size:23px}h3{font-size:18px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #89958e;padding:10px;text-align:left;vertical-align:top}td[contenteditable]{height:90px}.example{padding:16px;background:#edf2e8}.gh-radar-svg{width:100%;max-width:450px}button{padding:10px;font:inherit}@media print{button,.screen-note{display:none}.action{break-before:page}tr{break-inside:avoid}body{margin:0;padding:0}*{print-color-adjust:exact}}</style></head><body><small>'+L('Gobierno Habilitador','Enabling Government')+' · Patricio Ovalle Wood · ES Digital</small><h1>'+esc(title)+'</h1><p class="screen-note">'+L('Edita los campos y usa Imprimir para guardar como PDF. Conserva una copia; los cambios no actualizan el sitio.','Edit the fields and use Print to save as PDF. Keep a copy; changes do not update the website.')+'</p><button onclick="window.print()">'+L('Imprimir / guardar PDF','Print / save PDF')+'</button>'+body+'</body></html>';}
function download(content,name,type='text/html;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function openPaper(content){const w=window.open('','_blank');if(w){w.document.open();w.document.write(content);w.document.close();}else{root.querySelector('#gh-save-note').textContent=L('El navegador bloqueó la vista. Usa Descargar o permite abrir la vista imprimible.','The browser blocked the view. Download a copy or allow the printable view to open.');}}
const tool=id=>db().tools.find(t=>t.id===id);
function toolPaper(id){const t=tool(id);return paper(t.name,'<p>'+esc(t.purpose)+'</p><p><b>'+L('Tiempo orientativo','Suggested time')+':</b> '+esc(t.duration)+'<br><b>'+L('Participantes','Participants')+':</b> '+esc(t.people)+'</p><h2>'+L('Cómo utilizarla','How to use it')+'</h2><ol>'+t.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><div class="example"><b>'+L('Ejemplo ilustrativo','Illustrative example')+'</b><p>'+esc(t.example)+'</p></div><h2>'+L('Ficha de trabajo','Worksheet')+'</h2><p contenteditable="true">'+L('Organización: [completar] · Fecha: [completar]','Organisation: [complete] · Date: [complete]')+'</p><table>'+t.fields.map(f=>'<tr><th>'+esc(f)+'</th><td contenteditable="true">'+L('[Completar]','[Complete]')+'</td></tr>').join('')+'</table><h2>'+L('Siguiente paso','Next step')+'</h2><p>'+esc(t.next)+'</p><small>'+L('Ficha original de la guía. Referencias metodológicas: NYC Civic Service Design Tools + Tactics y GOV.UK Service Manual.','Original worksheet. Method references: NYC Civic Service Design Tools + Tactics and GOV.UK Service Manual.')+'</small>');}
function toolCard(id){const t=tool(id);return '<details class="gh-tool-card"><summary>'+esc(t.name)+'</summary><p>'+esc(t.purpose)+'</p><p>'+esc(t.method)+' · '+esc(t.duration)+'</p><h4>'+L('Participantes','Participants')+'</h4><p>'+esc(t.people)+'</p><h4>'+L('Cómo utilizarla','How to use it')+'</h4><ol>'+t.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><h4>'+L('Ejemplo ilustrativo','Illustrative example')+'</h4><p>'+esc(t.example)+'</p><h4>'+L('Después','Next')+'</h4><p>'+esc(t.next)+'</p><div class="gh-output-tools"><button class="gh-btn" data-pdf="'+id+'">PDF A4 ↓</button><button class="gh-btn gh-secondary" data-edit="'+id+'">'+L('Ficha editable ↓','Editable worksheet ↓')+'</button></div></details>';}
function caseCard(id){const c=db().cases[id];return '<details class="gh-case-card"><summary>'+L('Referencia internacional','International reference')+' · '+esc(c.name)+'</summary><p>'+esc(c.place)+'</p><h4>'+L('Práctica documentada','Documented practice')+'</h4><p>'+esc(c.fact)+'</p><p>'+esc(c.learn)+'</p><h4>'+L('Límite de la referencia','Limit of the reference')+'</h4><p>'+esc(c.limit)+'</p><a target="_blank" rel="noopener" href="'+esc(c.url)+'">'+L('Leer fuente primaria ↗','Read primary source ↗')+'</a></details>';}
function actions(i){return A()[i].map(a=>{if(status(i)==='unknown')return {...a,title:L('Verificar: ','Verify: ')+a.title,how:L('Antes de hacer cambios, revisa con las áreas responsables si esta práctica existe y solicita evidencia de su aplicación. Registra lo disponible y lo pendiente; no interpretes falta de información como desempeño negativo. Si confirmas una brecha: ','Before making changes, ask accountable departments whether this practice exists and request evidence of its use. Record what is available and missing; missing information is not poor performance. If a gap is confirmed: ')+a.how,gate:L('La evidencia permite actualizar el diagnóstico y decidir si hace falta intervenir.','Evidence supports updating the assessment and deciding whether intervention is needed.')};if(status(i)==='ready')return {...a,title:L('Revisar y sostener: ','Review and sustain: ')+a.title,how:L('Aprovecha lo que ya funciona; revisa un proyecto real y ajusta solo lo necesario. ','Build on what works; review a real project and adjust only what is needed. ')+a.how};if(status(i)==='partial')return {...a,how:L('Identifica primero el componente incompleto y conserva lo que ya está acordado. ','First identify the incomplete component and retain what has already been agreed. ')+a.how};return a;});}
function actionCard(i,a,j){const task=state.tasks?.[i]?.[j]||{};return '<section class="gh-action-wrap"><details class="gh-action-card"><summary>0'+(j+1)+' · '+esc(a.dimension)+' · '+esc(a.title)+'</summary><h4>'+L('Qué hacer y cómo hacerlo','What to do and how')+'</h4><p>'+esc(a.how)+'</p><h4>'+L('Ejemplo ilustrativo','Illustrative example')+'</h4><p class="gh-example">'+esc(a.example)+'</p><h4>'+L('A quién involucrar','Who to involve')+'</h4><p>'+esc(a.owner)+'</p><h4>'+L('Qué debes obtener','Expected deliverable')+'</h4><p>'+esc(a.output)+'</p><h4>'+L('Criterio para avanzar','Criterion for moving forward')+'</h4><p>'+esc(a.gate)+'</p><div class="gh-task-fields">'+[['owner',L('Responsable acordado','Agreed owner')],['date',L('Fecha objetivo','Target date')],['evidence',L('Avance o evidencia','Progress or evidence')]].map(([k,label])=>'<label>'+label+'<input data-task="'+i+':'+j+':'+k+'" type="'+(k==='date'?'date':'text')+'" maxlength="300" value="'+esc(task[k]||'')+'"></label>').join('')+'</div>'+toolCard(a.tool)+'</details><p class="gh-action-intro">'+esc(a.how.split('. ')[0])+'.</p></section>';}
function planCard(i){return '<section class="gh-priority"><div class="gh-eyebrow">'+L('Tu plan de acción recomendado','Your recommended action plan')+'</div><h3>'+esc(db().pillars[i].name)+'</h3><p>'+esc(db().pillars[i].why)+'</p><p>'+L('Cuatro acciones complementarias. Abre cada una para encontrar instrucciones, ejemplo, herramienta y criterio de avance.','Four complementary actions. Open each for instructions, an example, a tool and an advancement criterion.')+'</p>'+actions(i).map((a,j)=>actionCard(i,a,j)).join('')+caseCard(db().pillars[i].case)+'</section>';}
function designPaper(){const sel=selection(),i=sel.row.i,c=db().cases[sel.row.p.case];return paper(L('Mi perfil y plan de acción','My profile and action plan'),'<p>'+esc(state.project)+'</p>'+radar()+'<ul>'+rows().map(r=>'<li>'+esc(r.p.name)+': '+(Number.isInteger(state.scores[r.i])?state.scores[r.i]+'/5':L('Sin información','Unknown'))+'</li>').join('')+'</ul><h2>'+esc(sel.row.p.name)+'</h2><p>'+esc(sel.reason)+'</p>'+actions(i).map((a,j)=>{const t=state.tasks?.[i]?.[j]||{};return '<section class="action"><h2>'+(j+1)+'. '+esc(a.title)+'</h2><p>'+esc(a.dimension)+'</p><h3>'+L('Cómo hacerlo','How to do it')+'</h3><p>'+esc(a.how)+'</p><div class="example"><b>'+L('Ejemplo ilustrativo','Illustrative example')+'</b><p>'+esc(a.example)+'</p></div><p><b>'+L('Responsable sugerido','Suggested owner')+':</b> '+esc(a.owner)+'</p><p><b>'+L('Entregable','Deliverable')+':</b> '+esc(a.output)+'</p><p><b>'+L('Criterio para avanzar','Advancement criterion')+':</b> '+esc(a.gate)+'</p><p>'+L('Herramienta','Tool')+': '+esc(tool(a.tool).name)+'</p><table>'+[['owner',L('Responsable acordado','Agreed owner')],['date',L('Fecha objetivo','Target date')],['evidence',L('Avance o evidencia','Progress or evidence')]].map(([k,label])=>'<tr><th>'+label+'</th><td contenteditable="true">'+esc(t[k]||L('[Completar]','[Complete]'))+'</td></tr>').join('')+'</table></section>';}).join('')+'<h2>'+L('Referencia internacional','International reference')+'</h2><p><a href="'+esc(c.url)+'">'+esc(c.name)+'</a></p><p>'+esc(c.fact)+'</p><p>'+esc(c.limit)+'</p><small>'+L('Autoevaluación orientativa, no una certificación ni un índice validado. Ejemplos ilustrativos; ajusta decisiones y autorizaciones a tu institución.','Indicative self-assessment, not certification or a validated index. Examples are illustrative; adapt decisions and authorisations to your institution.')+'</small>');}
function design(){let html='<h1>'+L('Diseña o fortalece tu espacio de innovación pública','Design or strengthen your public innovation space')+'</h1><p class="gh-lead">'+L('Institucionalidad, gobernanza y capacidad de implementación. Nueve condiciones, un perfil visual y un plan para actuar.','Institutional foundations, governance and implementation capacity. Nine conditions, a visual profile and an action plan.')+'</p><label>'+L('Institución o proyecto — opcional','Institution or project — optional')+'<input id="gh-project-new" value="'+esc(state.project)+'" maxlength="160"></label>';
if(showResult){const sel=selection();html+='<section id="gh-diagnostic-result"><h2>'+L('Tu perfil de innovación pública','Your public innovation profile')+'</h2><div class="gh-radar-layout"><div>'+radar()+'<p class="gh-note">'+L('* Sin evaluar: el tramo queda abierto para no inventar una puntuación.','* Not assessed: the segment remains open rather than inventing a score.')+'</p></div><table class="gh-radar-table"><caption>'+L('Capacidades declaradas · escala 1–5','Declared capabilities · scale 1–5')+'</caption>'+rows().map(r=>'<tr><td>'+esc(r.p.name)+'</td><td>'+(Number.isInteger(state.scores[r.i])?state.scores[r.i]+'/5':L('Sin información','Unknown'))+'</td></tr>').join('')+'</table></div><p class="gh-dependency">'+esc(sel.reason)+'</p>'+planCard(sel.row.i)+'<details class="gh-other"><summary>'+L('Ver las demás condiciones','Review other conditions')+'</summary>'+rows().filter(r=>r.i!==sel.row.i).map(r=>planCard(r.i)).join('')+'</details><div class="gh-output-tools"><button class="gh-btn" id="gh-view-plan">'+L('Ver plan imprimible ↗','View printable plan ↗')+'</button><button class="gh-btn gh-secondary" id="gh-download-plan">'+L('Descargar plan editable ↓','Download editable plan ↓')+'</button><button class="gh-btn gh-secondary" id="gh-review">'+L('Revisar respuestas','Review answers')+'</button></div><p class="gh-note">'+L('Reglas: verificar gobernanza desconocida o débil; asegurar recursos si bloquean pilotos o adopción; después, menor nivel declarado. Empates según el orden de condiciones. No mide impacto.','Rules: verify unknown or weak governance; secure resources if they block testing or adoption; otherwise select the lowest declared level. Ties follow condition order. This does not measure impact.')+'</p></section>';}else{html+='<div class="gh-mini-nav">'+db().pillars.map((p,i)=>'<button data-step="'+i+'" aria-current="'+(step===i)+'" aria-label="'+esc(p.name)+'">'+(i+1)+'</button>').join('')+'</div><section class="gh-question-screen"><div class="gh-eyebrow">'+L('Condición','Condition')+' '+(step+1)+' / 9</div><h2>'+esc(db().pillars[step].name)+'</h2><p>'+L('Elige el nivel que mejor describe lo que puedes comprobar.','Choose the level that best describes what you can verify.')+'</p>'+[...DATA.anchors[language][step],L('No tengo información suficiente.','I do not have enough information.')].map((txt,j)=>'<label class="gh-level"><input type="radio" name="gh-capability" value="'+(j===5?'unknown':j+1)+'" '+(state.scores[step]===(j===5?'unknown':j+1)?'checked':'')+'><span><strong>'+ (j===5?L('Sin información','Unknown'):L('Nivel ','Level ')+(j+1))+'</strong>'+esc(txt)+'</span></label>').join('')+'<div class="gh-output-tools"><button class="gh-btn gh-secondary" id="gh-prev" '+(step===0?'disabled':'')+'>'+L('← Anterior','← Previous')+'</button><button class="gh-btn" id="gh-next">'+(step===8?L('Ver mi diagnóstico ↗','View my assessment ↗'):L('Siguiente →','Next →'))+'</button></div><p id="gh-question-note" role="status"></p></section>';}
return html;}
function landing(){return '<div class="gh-eyebrow">'+L('Herramientas para la acción pública','Tools for public action')+'</div><h1>'+L('Gobierno Habilitador','Enabling Government')+'</h1><p class="gh-lead">'+L('Fortalece capacidades institucionales y toma mejores decisiones públicas. Elige lo que necesitas resolver.','Strengthen institutional capabilities and make better public decisions. Choose what you need to address.')+'</p><div class="gh-launch-grid"><a class="gh-launch-card" href="#gh-design"><span>01</span><h2>'+L('Diseña o fortalece tu espacio de innovación pública','Design or strengthen your public innovation space')+'</h2><p>'+L('Evalúa institucionalidad, gobernanza y operación de hubs, laboratorios y espacios GovTech. Recibe un radar y un plan de acción.','Assess institutional foundations, governance and operations for hubs, labs and GovTech spaces. Receive a radar profile and an action plan.')+'</p><strong>'+L('Evaluar mi institución →','Assess my institution →')+'</strong></a><a class="gh-launch-card" href="#gh-prioritize"><span>02</span><h2>'+L('Prioriza mejoras en tus servicios públicos','Prioritise improvements to public services')+'</h2><p>'+L('Compara necesidad ciudadana, capacidad técnica, respaldo político y condiciones normativas. Distingue uso, evaluación y visibilidad.','Compare citizen needs, technical capacity, political support and regulatory conditions. Keep usage, assessment and visibility distinct.')+'</p><strong>'+L('Comparar mis servicios →','Compare my services →')+'</strong></a></div><p class="gh-note">'+L('Método y herramientas de Patricio Ovalle Wood. Orientaciones para adaptar con tu equipo, no decisiones automáticas.','Methods and tools by Patricio Ovalle Wood. Guidance to adapt with your team, not automated decisions.')+'</p>';}
function blankService(){return {name:'',archetype:'',actors:'',source:'',need:'unknown',harm:'unknown',technical:'unknown',political:'unknown',norm:'unknown',normSource:'',deadline:'',usage:'unknown',evaluation:'unknown',visibility:'unknown'};}
const opts={need:()=>[['unknown',L('Sin información','Unknown')],['1',L('Necesidad baja','Low need')],['2',L('Necesidad acotada','Limited need')],['3',L('Necesidad relevante','Relevant need')],['4',L('Necesidad alta','High need')],['5',L('Necesidad esencial o urgente','Essential or urgent need')]],harm:()=>[['unknown',L('Por verificar','To verify')],['critical',L('Daño grave o pérdida de acceso esencial','Serious harm or loss of essential access')],['moderate',L('Dificultades relevantes','Significant difficulties')],['low',L('Consecuencias limitadas','Limited consequences')]],technical:()=>[['unknown',L('Por verificar','To verify')],['high',L('Capacidades y recursos disponibles','Capabilities and resources available')],['medium',L('Parcialmente disponibles','Partly available')],['low',L('Faltan capacidades o recursos','Capabilities or resources missing')]],political:()=>[['unknown',L('Por verificar','To verify')],['yes',L('Respaldo y responsable definidos','Support and owner defined')],['partial',L('Interés sin compromisos completos','Interest without full commitments')],['no',L('Sin respaldo acordado','No agreed support')]],norm:()=>[['unknown',L('Por revisar con el área competente','Review with the competent department')],['required',L('Obligación vigente y aplicable','Current applicable obligation')],['upcoming',L('Cambio próximo que requiere preparación','Upcoming change requiring preparation')],['restricted',L('Restricción o interpretación pendiente','Restriction or interpretation outstanding')],['allowed',L('Actuación permitida en las atribuciones','Action permitted within institutional powers')]],usage:()=>[['unknown',L('Sin información','Unknown')],['high',L('Uso alto','High usage')],['medium',L('Uso medio','Medium usage')],['low',L('Uso bajo','Low usage')]],evaluation:()=>[['unknown',L('Sin información','Unknown')],['poor',L('Mal evaluado','Poorly assessed')],['mixed',L('Evaluación mixta','Mixed assessment')],['good',L('Bien evaluado','Well assessed')]],visibility:()=>[['unknown',L('Sin información','Unknown')],['high',L('Alta exposición pública','High public exposure')],['medium',L('Exposición moderada','Moderate exposure')],['low',L('Poca exposición pública','Low public exposure')]]};
function selectField(i,key,label){return '<label>'+label+'<select data-service="'+i+':'+key+'">'+opts[key]().map(([v,t])=>'<option value="'+v+'" '+(services[i][key]===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label>';}
function inputField(i,key,label,type='text'){return '<label>'+label+'<input type="'+type+'" maxlength="400" data-service="'+i+':'+key+'" value="'+esc(services[i][key]||'')+'"></label>';}
let comparison=false;
function priority(s){if(s.norm==='required')return {level:0,title:L('Atender obligación y confirmar condiciones','Address obligation and confirm conditions'),reason:L('Declaras una obligación vigente. Confirma aplicabilidad, autoridad, plazo y respuesta necesaria con el área competente; no depende de su visibilidad.','You report a current obligation. Confirm applicability, authority, deadline and required response with the competent department; visibility does not determine compliance.')};if(s.harm==='critical')return {level:1,title:L('Atender riesgo o acceso esencial','Address risk or essential access'),reason:L('La gravedad declarada requiere revisar medidas de protección y atención, aunque el servicio sea poco usado o visible.','Declared severity calls for reviewing protection and access measures, even with low usage or visibility.')};if(s.norm==='upcoming')return {level:2,title:L('Preparar la transición normativa','Prepare the regulatory transition'),reason:L('Verifica fecha, competencias y medidas antes de la entrada en vigor.','Verify timing, powers and implementation measures before the change takes effect.')};if(Number(s.need)>=4||s.evaluation==='poor')return {level:3,title:L('Investigar y priorizar una mejora','Investigate and prioritise an improvement'),reason:L('La necesidad o evaluación declarada justifica investigar causas y alternativas; confirma la evidencia antes de comprometer una solución.','Declared need or assessment warrants investigating causes and alternatives; confirm evidence before committing to a solution.')};if(s.need==='unknown'&&s.evaluation==='unknown')return {level:5,title:L('Reunir información para decidir','Gather information to decide'),reason:L('Falta información para sostener una prioridad; silencio o pocas quejas no prueban satisfacción.','Information is insufficient to justify a priority; silence or few complaints does not establish satisfaction.')};return {level:4,title:L('Explorar oportunidades y revisar','Explore opportunities and review'),reason:L('No se identifican por estas respuestas una obligación o gravedad alta. Revisa necesidades y barreras antes de ampliar o descartar mejoras.','These responses do not identify an obligation or high severity. Review needs and barriers before expanding or dismissing improvements.')};}
function serviceActions(s){const name=s.name||L('este servicio','this service');return [
{dimension:L('Política e institucional','Political and institutional'),title:L('Acordar la decisión y la vía normativa','Agree the decision and regulatory route'),how:L('Reúne a la jefatura de '+name+' y a las áreas jurídica y presupuestaria pertinentes. Confirma la obligación o restricción declarada, su fuente, autoridad competente y plazo. Acuerda qué puede decidirse hoy y qué requiere autorización; el cumplimiento puede necesitar información, operación o fiscalización, sin implicar necesariamente una innovación.','Meet the '+name+' lead and relevant legal and budget teams. Confirm the reported obligation or restriction, its source, competent authority and deadline. Agree what can be decided now and what needs authorisation; compliance may require information, operations or enforcement rather than innovation.'),example:L('Ante un cambio de reglas de un servicio, el equipo verifica a quién se aplica, quién informa y qué ajuste operativo debe autorizarse antes de anunciarlo.','When service rules change, the team checks who is affected, who communicates and which operational changes must be authorised before announcing them.'),output:L('Acuerdo de decisión, responsables, revisión normativa y pendientes.','Decision agreement, accountable owners, regulatory review and outstanding issues.'),tool:'raci'},
{dimension:L('Evidencia','Evidence'),title:L('Contrastar necesidad, uso y evaluación','Cross-check need, usage and assessment'),how:L('Revisa registros del servicio y escucha a los arquetipos identificados, incluyendo personas con barreras de acceso. Define periodo y fuente de uso, quién evaluó y con qué método. Distingue quejas públicas de experiencias de usuarios; incorpora a quienes no participan en redes y revisa gravedad y equidad.','Review service records and listen to the identified user profiles, including people facing access barriers. Define the period and source for usage, who assessed the service and how. Separate public complaints from user experience; include people who do not use social media and review severity and equity.'),example:L('Un servicio muy usado, mal evaluado y poco visible se investiga con registros, entrevistas y atención presencial, en vez de esperar denuncias en redes.','A heavily used, poorly assessed but low-visibility service is investigated through records, interviews and in-person contact rather than waiting for social-media complaints.'),output:L('Ficha con fuentes, perfiles, causas posibles y vacíos de información.','Evidence brief with sources, profiles, possible causes and information gaps.'),tool:'entrevistas'},
{dimension:L('Técnica','Technical'),title:L('Diseñar una respuesta viable y proporcional','Design a feasible and proportionate response'),how:L('Mapea el recorrido y las causas confirmadas. Compara opciones de información, procesos, acceso, operación o tecnología, según el problema. Si faltan recursos, acota el alcance y acuerda capacidades compartidas. Define responsable, entregable e indicadores; una prueba solo procede si sus condiciones están habilitadas.','Map the journey and confirmed causes. Compare information, process, access, operational or technology options according to the problem. If resources are missing, narrow the scope and agree shared capabilities. Define an owner, deliverable and indicators; testing requires enabled conditions.'),example:L('Si el problema son requisitos confusos, se compara orientación y simplificación del proceso antes de contratar una plataforma.','If the problem is confusing requirements, compare guidance and process simplification before commissioning a platform.'),output:L('Alternativa justificada, recursos requeridos y criterios de prueba o implementación.','Justified option, required resources and testing or implementation criteria.'),tool:'desafio'},
{dimension:L('Comunicación','Communication'),title:L('Adaptar mensajes a públicos y visibilidad','Adapt messages to audiences and visibility'),how:s.visibility==='low'?L('Busca activamente a usuarios poco representados mediante atención, teléfono y organizaciones pertinentes. Explica cómo participar y devuelve los hallazgos. No interpretes poca exposición como poca necesidad. Coordina información interna y pública con evidencia disponible.','Actively reach underrepresented users through frontline channels, telephone and relevant organisations. Explain participation and return findings. Low exposure does not mean low need. Coordinate internal and public information using available evidence.'):L('Distingue usuarios del servicio y actores organizados; observa su incidencia sin asumir comportamientos por pertenecer a un grupo. Define vocería, mensajes, canales de respuesta y evidencia. Ante alta exposición, informa acciones y límites con claridad sin permitir que el volumen de publicaciones sustituya la necesidad ciudadana.','Distinguish service users from organised actors; observe their influence without assuming behaviour from group membership. Define spokespersons, messages, response channels and evidence. With high exposure, explain actions and limits without treating post volume as a substitute for citizen need.'),example:L('Un servicio visible recibe mensajes claros y un canal de respuesta. En uno poco visible, la institución convoca y escucha a quienes no hacen públicas sus dificultades.','A visible service receives clear messages and a response channel. For a low-visibility service, the institution actively reaches people who do not publicise their difficulties.'),output:L('Plan de públicos, mensajes, canales, responsables y devolución.','Audience, message, channel, owner and feedback plan.'),tool:'comunicacion'}];}
function serviceResult(s,i){const p=priority(s);return '<section class="gh-priority"><div class="gh-eyebrow">'+esc(p.title)+'</div><h2>'+esc(s.name||L('Servicio ','Service ')+(i+1))+'</h2><p>'+esc(p.reason)+'</p><p>'+L('Perfil: ','Profile: ')+['usage','evaluation','visibility'].map(k=>esc(opts[k]().find(x=>x[0]===s[k])?.[1])).join(' · ')+'</p>'+(s.norm==='required'&&!s.normSource?'<p class="gh-dependency">'+L('Falta registrar la fuente normativa: confirma esta obligación antes de darla por establecida.','Regulatory source missing: confirm the obligation before treating it as established.')+'</p>':'')+'<details><summary>'+L('Ver ruta de acción','View action route')+'</summary>'+serviceActions(s).map((a,j)=>'<details class="gh-action-card"><summary>0'+(j+1)+' · '+esc(a.dimension)+' · '+esc(a.title)+'</summary><p>'+esc(a.how)+'</p><h4>'+L('Ejemplo ilustrativo','Illustrative example')+'</h4><p class="gh-example">'+esc(a.example)+'</p><h4>'+L('Entregable','Deliverable')+'</h4><p>'+esc(a.output)+'</p>'+toolCard(a.tool)+'</details>').join('')+'</details></section>';}
function comparisonPaper(){return paper(L('Comparación y plan de servicios públicos','Public service comparison and action plan'),'<p>'+L('Reglas orientativas: obligaciones declaradas, gravedad, cambios próximos, necesidad y evaluación. Uso y visibilidad caracterizan el servicio, no se suman como una nota. Confirma decisiones con las áreas competentes.','Indicative rules: reported obligations, severity, upcoming changes, need and assessment. Usage and visibility describe the service rather than adding to a score. Confirm decisions with competent departments.')+'</p>'+services.map((s,i)=>'<section><h2>'+esc(s.name||L('Servicio ','Service ')+(i+1))+'</h2><p>'+esc(priority(s).reason)+'</p><p>'+L('Arquetipo','User profile')+': '+esc(s.archetype)+'<br>'+L('Actores organizados','Organised actors')+': '+esc(s.actors)+'<br>'+L('Fuente / periodo','Source / period')+': '+esc(s.source)+'<br>'+L('Fuente normativa / plazo','Regulatory source / deadline')+': '+esc(s.normSource)+' / '+esc(s.deadline)+'</p><ul>'+Object.keys(opts).map(k=>'<li>'+esc(fieldLabel(k))+': '+esc(opts[k]().find(x=>x[0]===s[k])?.[1])+'</li>').join('')+'</ul>'+serviceActions(s).map(a=>'<div class="action"><h3>'+esc(a.dimension)+' · '+esc(a.title)+'</h3><p>'+esc(a.how)+'</p><div class="example"><b>'+L('Ejemplo ilustrativo','Illustrative example')+'</b><p>'+esc(a.example)+'</p></div><p>'+L('Entregable','Deliverable')+': '+esc(a.output)+'</p><p>'+L('Herramienta','Tool')+': '+esc(tool(a.tool).name)+'</p><p contenteditable="true">'+L('Responsable: [completar] · Fecha: [acordar] · Evidencia: [completar]','Owner: [complete] · Date: [agree] · Evidence: [complete]')+'</p></div>').join('')+'</section>').join(''));}
function fieldLabel(k){return ({need:L('Ciudadana: importancia de la necesidad','Citizen perspective: importance of the need'),harm:L('Ciudadana: gravedad y acceso','Citizen perspective: severity and access'),technical:L('Técnica: capacidad para actuar','Technical: delivery capacity'),political:L('Política: respaldo y responsable','Political: support and ownership'),norm:L('Normativa/regulatoria: situación','Legal/regulatory: status'),usage:L('Nivel de uso','Usage level'),evaluation:L('Evaluación del servicio','Service assessment'),visibility:L('Visibilidad del problema','Problem visibility')})[k];}
function prioritise(){if(!services.length)services=[blankService(),blankService()];return '<h1>'+L('Prioriza mejoras en tus servicios públicos','Prioritise improvements to public services')+'</h1><p class="gh-lead">'+L('Cuatro perspectivas y tres atributos. Compara necesidades y condiciones para actuar sin confundir visibilidad con importancia.','Four perspectives and three attributes. Compare needs and delivery conditions without equating visibility with importance.')+'</p><p>'+L('El arquetipo describe necesidades y barreras de usuarios; los actores organizados describen representación e incidencia. Registra lo observado en el contexto, sin asumir comportamientos por pertenencia a un grupo.','User profiles describe needs and barriers; organised actors describe representation and influence. Record observed behaviour in context rather than making assumptions based on group membership.')+'</p>'+services.map((s,i)=>'<details class="gh-service-entry" '+(!comparison&&i===0?'open':'')+'><summary>'+esc(s.name||L('Servicio ','Service ')+(i+1))+'</summary><div class="gh-service-grid">'+inputField(i,'name',L('Nombre del servicio','Service name'))+inputField(i,'archetype',L('Arquetipo: necesidades, contexto y barreras','User profile: needs, context and barriers'))+inputField(i,'actors',L('Actores organizados y canales de incidencia','Organised actors and influence channels'))+inputField(i,'source',L('Fuentes, periodo y quién evalúa','Sources, period and who assessed it'))+'<h3>'+L('Cuatro perspectivas para decidir','Four perspectives for decisions')+'</h3>'+['need','harm','technical','political','norm'].map(k=>selectField(i,k,fieldLabel(k))).join('')+inputField(i,'normSource',L('Fuente normativa y revisión — si corresponde','Regulatory source and review — if applicable'))+inputField(i,'deadline',L('Plazo verificado — si corresponde','Verified deadline — if applicable'),'date')+'<h3>'+L('Tres atributos independientes','Three independent attributes')+'</h3>'+['usage','evaluation','visibility'].map(k=>selectField(i,k,fieldLabel(k))).join('')+'</div><button class="gh-btn gh-secondary" data-remove-service="'+i+'">'+L('Quitar servicio','Remove service')+'</button></details>').join('')+'<div class="gh-output-tools"><button class="gh-btn gh-secondary" id="gh-add-service">'+L('Añadir servicio +','Add service +')+'</button><button class="gh-btn" id="gh-compare">'+L('Comparar y proponer acciones →','Compare and suggest actions →')+'</button></div><div id="gh-compare-note" role="status"></div>'+(comparison?'<section id="gh-comparison"><h2>'+L('Comparación para conversar y decidir','Comparison for discussion and decisions')+'</h2><p>'+L('Las categorías orientan atención; no certifican urgencia ni establecen una obligación legal. En igualdad de condiciones se mantiene el orden ingresado.','Categories guide attention; they do not certify urgency or establish a legal obligation. Equal conditions retain input order.')+'</p>'+services.map((s,i)=>({s,i,p:priority(s)})).sort((a,b)=>a.p.level-b.p.level||a.i-b.i).map(({s,i})=>serviceResult(s,i)).join('')+'<div class="gh-output-tools"><button class="gh-btn" id="gh-view-comparison">'+L('Ver plan imprimible ↗','View printable plan ↗')+'</button><button class="gh-btn gh-secondary" id="gh-download-comparison">'+L('Descargar comparación y plan ↓','Download comparison and plan ↓')+'</button></div></section>':'');}
function render(){const hash=location.hash;const designRoute=['#gh-design','#gh-diagnostic'].includes(hash),serviceRoute=hash==='#gh-prioritize';root.innerHTML='<main class="gh-app"><nav class="gh-app-nav"><a href="#gobierno-habilitador">'+L('Gobierno Habilitador','Enabling Government')+'</a><a href="#home">'+L('← Volver a ES Digital','← Back to ES Digital')+'</a></nav>'+(designRoute?design():serviceRoute?prioritise():landing())+'<details class="gh-optional" '+(hash==='#gh-toolkit'?'open':'')+'><summary>'+L('Biblioteca de herramientas · PDF y fichas editables','Tool library · PDF and editable worksheets')+'</summary><div class="gh-tool-library">'+db().tools.map(t=>toolCard(t.id)).join('')+'</div></details><details class="gh-optional"><summary>'+L('Método, referencias y autor','Method, references and author')+'</summary><p>'+L('Herramientas de Patricio Ovalle Wood para gobiernos e instituciones de América Latina. La guía integra diseño institucional, retos públicos y articulación de ecosistemas. Las referencias documentan prácticas y sus límites; no garantizan resultados.','Tools by Patricio Ovalle Wood for governments and institutions in Latin America. The guide integrates institutional design, public challenges and ecosystem development. References document practices and their limits; they do not guarantee outcomes.')+'</p>'+Object.keys(db().cases).map(caseCard).join('')+'</details><p class="gh-privacy">'+L('Respuestas guardadas en este navegador cuando lo permite; no se envían a un servidor. Evita información personal o confidencial. Autoevaluaciones y recomendaciones orientativas, no certificaciones ni índices validados.','Responses are saved in this browser when supported; they are not sent to a server. Avoid personal or confidential information. Assessments and recommendations are indicative, not certifications or validated indices.')+'</p><p id="gh-save-note" role="status"></p><section class="gh-cta"><h2>'+L('¿Necesitas acompañamiento para tu equipo?','Need support for your team?')+'</h2><p>'+L('Adaptamos las herramientas al contexto y las capacidades de tu institución.','We adapt these tools to your institutional context and capabilities.')+'</p><a class="gh-btn" href="#contact">'+L('Conversemos ↗','Let’s talk ↗')+'</a></section><footer>'+L('Gobierno Habilitador','Enabling Government')+' · Patricio Ovalle Wood · ES / EN · v4.0</footer></main>';bind();}
function bind(){root.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>{const s=atob(PDFS[language][b.dataset.pdf]),bytes=Uint8Array.from(s,c=>c.charCodeAt(0));download(bytes,'Gobierno-Habilitador-'+b.dataset.pdf+'-'+language+'.pdf','application/pdf');});root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>download(toolPaper(b.dataset.edit),'Gobierno-Habilitador-'+b.dataset.edit+'-'+language+'.html'));root.querySelectorAll('[data-task]').forEach(input=>input.oninput=()=>{const [i,j,k]=input.dataset.task.split(':');state.tasks=state.tasks||{};state.tasks[i]=state.tasks[i]||{};state.tasks[i][j]={...state.tasks[i][j],[k]:input.value};save();});const project=root.querySelector('#gh-project-new');if(project)project.oninput=()=>{state.project=project.value;save();};root.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);render();});root.querySelectorAll('[name="gh-capability"]').forEach(input=>input.onchange=()=>{state.scores[step]=input.value==='unknown'?'unknown':Number(input.value);save();});const next=root.querySelector('#gh-next');if(next)next.onclick=()=>{if(state.scores[step]===undefined){root.querySelector('#gh-question-note').textContent=L('Selecciona un nivel o Sin información.','Select a level or Unknown.');return;}if(step<8)step++;else if(state.scores.slice(0,9).filter(v=>Number.isInteger(v)||v==='unknown').length<9){step=Array.from({length:9},(_,i)=>i).find(i=>state.scores[i]===undefined);}else showResult=true;render();root.querySelector(showResult?'#gh-diagnostic-result':'.gh-question-screen')?.scrollIntoView({block:'start',behavior:'smooth'});};const prev=root.querySelector('#gh-prev');if(prev)prev.onclick=()=>{step--;render();};const review=root.querySelector('#gh-review');if(review)review.onclick=()=>{showResult=false;step=0;render();};const vp=root.querySelector('#gh-view-plan');if(vp)vp.onclick=()=>openPaper(designPaper());const dp=root.querySelector('#gh-download-plan');if(dp)dp.onclick=()=>download(designPaper(),'Gobierno-Habilitador-plan-'+language+'.html');root.querySelectorAll('[data-service]').forEach(input=>input.oninput=()=>{const [i,k]=input.dataset.service.split(':');services[i][k]=input.value;comparison=false;root.querySelector('#gh-comparison')?.remove();save();});root.querySelectorAll('[data-remove-service]').forEach(b=>b.onclick=()=>{services.splice(Number(b.dataset.removeService),1);comparison=false;save();render();});const add=root.querySelector('#gh-add-service');if(add)add.onclick=()=>{if(services.length>=8){root.querySelector('#gh-compare-note').textContent=L('Compara hasta ocho servicios por sesión.','Compare up to eight services per session.');return;}services.push(blankService());save();render();};const compare=root.querySelector('#gh-compare');if(compare)compare.onclick=()=>{if(!services.every(s=>s.name.trim())){root.querySelector('#gh-compare-note').textContent=L('Nombra cada servicio para distinguirlos. Las condiciones sin información pueden quedar por verificar.','Name each service to distinguish it. Unknown conditions may remain to be verified.');return;}comparison=true;render();root.querySelector('#gh-comparison').scrollIntoView({behavior:'smooth',block:'start'});};const vc=root.querySelector('#gh-view-comparison');if(vc)vc.onclick=()=>openPaper(comparisonPaper());const dc=root.querySelector('#gh-download-comparison');if(dc)dc.onclick=()=>download(comparisonPaper(),'Gobierno-Habilitador-servicios-'+language+'.html');}
window.addEventListener('gh-language-change',e=>{language=e.detail==='en'?'en':'es';render();});window.addEventListener('hashchange',render);render();
})();
