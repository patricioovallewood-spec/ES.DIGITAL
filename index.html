es:[
{title:'Servicios públicos y experiencia ciudadana',claim:'Servicios diseñados desde la vida de las personas.',peopleClaim:'Menos vueltas. Más claridad. Servicios que te ayudan.',lead:'Diseñamos mejoras en servicios, trámites y procesos públicos con las personas que los utilizan y los equipos que los operan. Combinamos experiencia ciudadana, simplificación y capacidad institucional para que las mejoras puedan implementarse y sostenerse.',peopleLead:'Un servicio funciona mejor cuando entiendes qué necesitas, sabes dónde pedirlo y recibes una respuesta clara. Ayudamos a las instituciones a detectar obstáculos y probar formas más simples de atenderte.',problem:'Un trámite puede funcionar en el papel y seguir siendo difícil de usar. Requisitos poco claros, canales desconectados y responsabilidades fragmentadas generan esfuerzo para las personas y carga para los equipos. Partimos del servicio real: lo que vive el usuario y lo que necesita la institución para resolver.',peopleProblem:'Repetir tus datos, visitar varias oficinas o no saber en qué estado está tu solicitud consume tiempo. Escuchamos esas experiencias y trabajamos con quienes atienden para mejorar el recorrido completo.',who:'Municipalidades, organismos públicos y organizaciones que quieren mejorar la atención, simplificar trámites o rediseñar un servicio específico.',modules:[['Diagnóstico del servicio','Revisamos requisitos, canales, tiempos, registros disponibles y puntos de coordinación. Entrevistamos a usuarios y equipos para identificar dónde se concentra la fricción.'],['Diseño con las personas','Construimos recorridos de usuario y un mapa de operación del servicio. Co-diseñamos cambios en información, atención, requisitos y coordinación, con criterios de accesibilidad.'],['Prueba y adopción','Prototipamos las mejoras y las probamos a una escala acordada. Definimos responsables, ajustes operativos y condiciones para incorporarlas al funcionamiento habitual.']],outputs:[['Diagnóstico y prioridades','Recorrido actual, barreras, necesidades de usuarios y oportunidades priorizadas.'],['Diseño del servicio futuro','Recorrido propuesto, procesos, roles, canales y mensajes de atención.'],['Prototipos y evaluación','Materiales de prueba, hallazgos y ajustes recomendados.'],['Plan de implementación','Responsables, recursos, indicadores y ruta de adopción.']],stages:[['Delimitar','Elegimos el servicio y acordamos usuarios, objetivo, alcance y datos disponibles.'],['Escuchar y observar','Recogemos experiencias y analizamos el trabajo que ocurre detrás de la atención.'],['Diseñar y probar','Probamos cambios antes de extenderlos, evaluando utilidad y factibilidad.'],['Instalar y medir','Acompañamos la adopción y dejamos herramientas para monitorear la mejora.']],metrics:['Tiempo y esfuerzo para completar el trámite','Solicitudes completas al primer intento','Claridad percibida y satisfacción con la atención','Carga operativa y adopción por el equipo'],exampleTitle:'Una licencia comercial más fácil de entender',example:'Un municipio quiere reducir consultas repetidas sobre una licencia. El encargo puede revisar requisitos y puntos de contacto, probar una guía más clara y rediseñar la coordinación entre áreas. El resultado esperado se valida con usuarios y con el equipo responsable antes de ampliarlo.',scope:'El rediseño no implica digitalizar todo. Puede combinar mejoras presenciales, contenidos y herramientas digitales. El desarrollo de software o la integración con sistemas se incorpora solo cuando forma parte del alcance acordado.',faq:[['¿Hay que partir comprando tecnología?','Primero entendemos el problema y el recorrido del usuario. La tecnología se elige cuando ayuda a resolverlo.'],['¿Qué necesita aportar la institución?','Un responsable del servicio, acceso a información pertinente y disponibilidad de equipos y usuarios para escuchar, probar y adoptar las mejoras.']]},
{title:'Hubs y ecosistemas de innovación',claim:'De reunir actores a construir colaboración.',peopleClaim:'Un lugar para conectar ideas con oportunidades.',lead:'Diseñamos y acompañamos hubs de innovación con propósito, gobernanza, servicios, programas y sostenibilidad. Articulamos actores alrededor de desafíos y oportunidades del territorio, con una ruta que conecta el espacio con proyectos concretos.',peopleLead:'Un hub puede ayudarte a encontrar aliados, aprender, emprender o participar en proyectos de tu comunidad. Diseñamos qué ofrece, quién puede acceder y cómo sus conexiones se convierten en oportunidades reales.',problem:'Un edificio, una agenda de eventos o una lista de aliados no bastan para desarrollar un ecosistema. Sin una propuesta de valor, un equipo operativo y acuerdos de colaboración, las conexiones pueden agotarse en encuentros. Diseñamos las condiciones que permiten trabajar juntos.',peopleProblem:'Tener una buena idea no siempre significa saber a quién acudir o cómo dar el siguiente paso. Un hub necesita ofrecer apoyo claro, conexiones útiles y actividades que respondan a lo que las personas necesitan.',who:'Gobiernos locales, universidades, empresas y alianzas que quieren crear, fortalecer o reorientar un hub y su ecosistema.',modules:[['Propósito y ecosistema','Identificamos activos, necesidades, actores y capacidades existentes. Definimos a quién sirve el hub y qué valor aporta frente a otras iniciativas.'],['Gobernanza y operación','Diseñamos reglas de participación, responsabilidades, equipo, toma de decisiones y relación entre el hub y las instituciones que lo impulsan.'],['Servicios y activación','Estructuramos programas, conexiones y proyectos con aliados. Diseñamos una agenda de puesta en marcha vinculada a prioridades del territorio.'],['Sostenibilidad y aprendizaje','Definimos recursos, fuentes de sostenimiento y seguimiento. Diferenciamos actividad, colaboración efectiva y resultados de los proyectos.']],outputs:[['Mapa del ecosistema','Actores, activos, brechas y oportunidades de colaboración.'],['Modelo del hub','Propósito, públicos, gobernanza, operación y propuesta de valor.'],['Portafolio de servicios','Programas, criterios de acceso, aliados y experiencia de participación.'],['Plan de activación','Agenda inicial, recursos, responsabilidades e indicadores de sostenibilidad.']],stages:[['Leer el territorio','Reconocemos las capacidades existentes y escuchamos a los posibles participantes.'],['Co-diseñar el modelo','Acordamos propósito, gobernanza y servicios con el grupo impulsor.'],['Activar','Acompañamos alianzas, programas iniciales y puesta en marcha.'],['Consolidar','Evaluamos uso, colaboración y sostenibilidad para ajustar el modelo.']],metrics:['Participación recurrente y uso de servicios','Alianzas que generan proyectos concretos','Proyectos que avanzan después de la conexión','Capacidad operativa y sostenimiento de recursos'],exampleTitle:'Un hub municipal con servicios y aliados',example:'Un municipio dispone de un espacio y quiere convertirlo en un hub. El servicio puede definir su público, gobernanza y oferta; organizar un grupo impulsor; y acompañar programas iniciales con universidades, empresas y emprendedores. La prioridad es activar colaboración útil desde el comienzo.',scope:'El alcance puede incluir recomendaciones sobre uso del espacio y experiencia de participación. El diseño arquitectónico, la obra y la operación permanente se contratan o coordinan de forma específica.',faq:[['¿Necesitamos un edificio propio?','El modelo puede comenzar como red de programas y aliados. La necesidad de un espacio físico depende de los servicios y de los recursos disponibles.'],['¿También fortalecen hubs que ya existen?','Sí. Podemos revisar su propuesta de valor, gobernanza, uso de servicios y sostenibilidad para reorientar la operación.']]},
{title:'Laboratorios y capacidades públicas',claim:'Equipos con mandato para innovar y capacidad para implementar.',peopleClaim:'Una institución que escucha, prueba y mejora contigo.',lead:'Diseñamos laboratorios, áreas y unidades de innovación pública que trabajan con las áreas responsables de los servicios. Definimos su mandato, equipo, procesos, cartera de retos y mecanismos para que las soluciones probadas sean adoptadas.',peopleLead:'Ayudamos a crear equipos públicos que escuchen tus necesidades, prueben mejoras y aprendan antes de extenderlas. Su trabajo es apoyar a las áreas que prestan los servicios para que puedan resolver mejor.',problem:'La innovación puede depender de una persona o quedarse en talleres y prototipos. Si nadie asume la implementación, el aprendizaje no se convierte en mejora pública. Diseñamos la conexión entre experimentación, decisiones y operación para instalar capacidades que puedan mantenerse.',peopleProblem:'Las ideas para mejorar un servicio necesitan alguien que las pruebe y un equipo que pueda ponerlas en práctica. Un laboratorio ayuda a recorrer ese camino y a aprender de lo que funciona y de lo que no.',who:'Gobiernos y organismos públicos que quieren crear una unidad de innovación, ordenar iniciativas existentes o desarrollar capacidades en sus equipos.',modules:[['Mandato y ubicación institucional','Definimos propósito, funciones, relación con otras áreas y decisiones que requieren respaldo directivo. Revisamos capacidades y restricciones con el equipo institucional.'],['Modelo operativo','Diseñamos roles, selección de retos, procesos de experimentación, coordinación y mecanismos de adopción. Cada proyecto tiene un área responsable.'],['Aprendizaje aplicado','Formamos equipos a través de desafíos reales, con acompañamiento en escucha, co-diseño, prototipado, evaluación y comunicación de aprendizajes.'],['Continuidad y transferencia','Documentamos métodos, decisiones y herramientas para que la capacidad permanezca en la organización y pueda ser utilizada por otros equipos.']],outputs:[['Diseño de la unidad','Mandato, funciones, estructura propuesta, roles y relaciones de coordinación.'],['Manual de operación','Ruta del reto a la adopción y criterios para priorizar, evaluar y decidir.'],['Cartera inicial','Retos seleccionados, responsables y fichas de proyecto.'],['Plan de capacidades','Formación, acompañamiento y herramientas de transferencia.']],stages:[['Diagnosticar','Identificamos capacidades, iniciativas y apoyos necesarios.'],['Diseñar el mandato','Acordamos funciones y mecanismos con autoridades y áreas responsables.'],['Aprender haciendo','Trabajamos una cartera acotada de retos y acompañamos al equipo.'],['Instalar la práctica','Formalizamos herramientas y mecanismos de seguimiento y adopción.']],metrics:['Retos con responsables y criterios de evaluación','Soluciones adoptadas por las áreas operativas','Uso de métodos por equipos formados','Recursos y respaldo para sostener la capacidad'],exampleTitle:'Diseñar una nueva área municipal de innovación',example:'Una municipalidad quiere establecer un área que coordine innovación pública, GovTech y articulación del ecosistema. El encargo puede diagnosticar capacidades, definir funciones y gobernanza, priorizar desafíos y elaborar una hoja de ruta de implementación validada con su equipo.',scope:'El diseño organizacional es una propuesta para validación institucional. La revisión y aprobación de instrumentos administrativos y presupuestarios corresponde a las áreas competentes. La estructura debe responder a las capacidades reales de la organización.',faq:[['¿Un laboratorio tiene que ser una nueva oficina?','Puede ser una unidad, un equipo transversal o una capacidad distribuida. Elegimos el diseño que mejor responda al mandato y a las condiciones institucionales.'],['¿Cómo evitamos que se quede en pilotos?','Definimos desde el inicio el área que adoptará la solución, las decisiones necesarias y los recursos para incorporarla a la operación.']]},
{title:'GovTech y espacios de experimentación',claim:'Desafíos públicos conectados con soluciones que pueden probarse.',peopleClaim:'Tecnología puesta a prueba para resolver problemas reales.',lead:'Diseñamos mecanismos para conectar desafíos públicos con startups, empresas y universidades. Estructuramos convocatorias, pilotos y espacios de experimentación, con reglas, evaluación y una ruta institucional para decidir sobre su adopción.',peopleLead:'Una nueva tecnología debe demostrar que ayuda a resolver un problema. Acompañamos pruebas acotadas para aprender cómo funciona, qué beneficios ofrece y qué condiciones necesita antes de ampliar su uso.',problem:'Un encuentro entre gobierno y startups no garantiza una solución. Pueden faltar una definición clara del problema, acceso a condiciones de prueba, criterios de evaluación o una ruta para implementar. Diseñamos esos elementos para que la colaboración avance con responsabilidades explícitas.',peopleProblem:'Las soluciones tecnológicas deben adaptarse a cómo viven y usan los servicios las personas. Las pruebas ayudan a conocer su utilidad y sus límites, recogiendo experiencias antes de extenderlas.',who:'Gobiernos, universidades, empresas y ecosistemas que quieren organizar desafíos GovTech, probar soluciones o evaluar un espacio de experimentación.',modules:[['Definición del desafío','Convertimos una necesidad pública en un reto con usuarios, condiciones de prueba, resultados esperados y área responsable.'],['Convocatoria y selección','Diseñamos reglas, criterios y mecanismos de evaluación para conectar el reto con capacidades externas y seleccionar propuestas pertinentes.'],['Piloto y evaluación','Definimos alcance, participantes, datos, seguimiento, indicadores y criterios para adoptar, ajustar o detener la prueba.'],['Sandbox y ruta de adopción','Evaluamos si se necesita un entorno especial de experimentación y qué decisiones requieren las autoridades competentes. Diseñamos la ruta posterior al piloto.']],outputs:[['Fichas de desafíos','Problema, usuarios, condiciones de prueba y objetivos acordados.'],['Modelo de convocatoria','Reglas, criterios de selección y esquema de evaluación.'],['Protocolo del piloto','Roles, recursos, tratamiento de información y criterios de salida.'],['Recomendación de adopción','Evidencia, condiciones institucionales y siguientes decisiones.']],stages:[['Delimitar el problema','Acordamos el reto y verificamos si existe capacidad para probar y adoptar.'],['Conectar soluciones','Articulamos actores y un proceso de selección transparente.'],['Experimentar','Acompañamos una prueba acotada con seguimiento y evaluación.'],['Decidir','Documentamos la evidencia y las condiciones para continuar, ajustar o cerrar.']],metrics:['Soluciones que cumplen criterios del desafío','Cambios en indicadores del problema público','Utilidad y experiencia de usuarios y equipos','Viabilidad operativa de la adopción'],exampleTitle:'Probar una solución para atención ciudadana',example:'Un municipio quiere evaluar una herramienta de apoyo a la atención. El encargo puede definir consultas elegibles, condiciones de uso de información, supervisión humana y criterios de utilidad. La decisión de continuar se basa en la prueba y en la capacidad del municipio para operarla.',scope:'Un piloto no equivale a una compra ni autoriza excepciones normativas. Un sandbox requiere evaluar competencias y condiciones específicas. La contratación y las aprobaciones corresponden a las instituciones y áreas responsables.',faq:[['¿Todo piloto necesita un sandbox?','No. Muchas pruebas pueden realizarse dentro de las reglas existentes. Evaluamos la necesidad del instrumento según el desafío.'],['¿ES Digital desarrolla la solución tecnológica?','Nuestra oferta se centra en diseño, articulación y acompañamiento. El desarrollo o suministro tecnológico se define expresamente cuando integra el encargo.']]},
{title:'Distritos de innovación y desarrollo territorial',claim:'Un territorio con propósito, conexiones y proyectos compartidos.',peopleClaim:'Más oportunidades para trabajar, emprender y aprender cerca de ti.',lead:'Diseñamos estrategias para desarrollar distritos de innovación a partir de activos reales: instituciones, talento, empresas, espacios y capacidades públicas. Conectamos visión territorial, gobernanza y proyectos que puedan activarse por etapas.',peopleLead:'Ayudamos a que universidades, empresas, gobiernos y comunidades colaboren en un territorio para abrir oportunidades. El diseño considera cómo esas actividades se relacionan con la vida del barrio y con quienes ya lo habitan.',problem:'Llamar distrito de innovación a un área no crea colaboración ni actividad económica. Sin activos conectados, instituciones comprometidas y una agenda de implementación, el concepto puede quedar en una marca. Partimos de lo que el territorio tiene y de lo que necesita desarrollar.',peopleProblem:'Un distrito debería aportar algo a quienes viven y trabajan allí. Necesita escuchar a la comunidad, conectar oportunidades y considerar acceso, convivencia y efectos en el entorno.',who:'Gobiernos locales, universidades, instituciones ancla, desarrolladores y alianzas territoriales que quieren diseñar o activar una estrategia de innovación.',modules:[['Lectura territorial','Mapeamos instituciones, talento, actividad económica, espacios, conectividad y proyectos existentes. Identificamos oportunidades y tensiones con actores locales.'],['Visión y gobernanza','Construimos una propuesta compartida: especialización, propósito, actores impulsores, responsabilidades y mecanismos para colaborar.'],['Cartera de proyectos','Priorizamos iniciativas de investigación aplicada, emprendimiento, formación, experimentación y activación de espacios según su viabilidad.'],['Implementación por etapas','Diseñamos una hoja de ruta que conecte proyectos iniciales, recursos y condiciones de desarrollo. Definimos cómo evaluar avances y efectos territoriales.']],outputs:[['Diagnóstico territorial','Activos, actores, brechas, oportunidades y criterios de delimitación.'],['Estrategia del distrito','Visión, propuesta de valor y modelo de gobernanza.'],['Cartera priorizada','Proyectos con objetivos, responsables y condiciones de viabilidad.'],['Hoja de ruta','Etapas, recursos, articulación y marco de seguimiento.']],stages:[['Reconocer activos','Leemos el territorio con sus instituciones y comunidades.'],['Acordar una visión','Identificamos una ambición compartida y compromisos concretos.'],['Activar proyectos','Organizamos iniciativas que pueden empezar con los recursos existentes.'],['Consolidar y evaluar','Revisamos colaboración, resultados y efectos en el territorio.']],metrics:['Proyectos entre instituciones ancla y actores locales','Uso de espacios y programas de innovación','Oportunidades de formación y emprendimiento','Participación local y efectos territoriales observados'],exampleTitle:'Conectar un eje universitario y comercial',example:'Un territorio reúne universidades, empresas y actividad comercial, pero sus actores trabajan por separado. El servicio puede identificar activos, acordar una visión y priorizar programas de talento, desafíos empresariales y proyectos urbanos que activen colaboración.',scope:'La estrategia no reemplaza la planificación urbana ni implica construir un parque tecnológico. Estudios urbanos, diseño arquitectónico y obras se integran mediante encargos específicos y especialistas según las necesidades.',faq:[['¿Cualquier territorio puede ser un distrito?','La pertinencia depende de sus activos, conexiones y capacidad de compromiso. El diagnóstico puede recomendar otras formas de articulación.'],['¿Por dónde se empieza?','Por una lectura de capacidades y una coalición impulsora. Después definimos proyectos realizables y condiciones para crecer.']]},
{title:'Inversión, alianzas y redes de ciudades',claim:'Conectar al territorio con recursos, conocimiento y oportunidades.',peopleClaim:'Aliados y proyectos que abren oportunidades para tu comunidad.',lead:'Diseñamos capacidades de promoción y facilitación de inversiones, alianzas estratégicas y redes de colaboración entre ciudades. La oferta tiene dos rutas complementarias: oportunidades territoriales y cooperación para aprender e implementar.',peopleLead:'Ayudamos a conectar a tu territorio con empresas, universidades y otras ciudades. Esas relaciones pueden aportar proyectos, aprendizaje, empleo y mejoras en servicios cuando tienen objetivos y compromisos claros.',problem:'Una lista de inversionistas o una red de contactos puede no generar proyectos. Faltan oportunidades estructuradas, responsables de seguimiento o una agenda común. Diseñamos funciones y procesos para que la relación con aliados tenga continuidad y un propósito concreto.',peopleProblem:'Firmar acuerdos no basta para que una comunidad vea beneficios. Las alianzas necesitan proyectos, responsables y seguimiento para convertirse en oportunidades y servicios útiles.',who:'Gobiernos locales, agencias, universidades y organizaciones que quieren fortalecer promoción de inversiones, construir alianzas o coordinar una red de ciudades.',modules:[['Promoción y facilitación de inversiones','Diseñamos el mandato, los servicios de orientación, la coordinación interna y el seguimiento de oportunidades. Diferenciamos promoción, permisos y decisiones de inversión.'],['Cartera de oportunidades','Identificamos proyectos y activos, organizamos información relevante y priorizamos oportunidades según su preparación y necesidades de articulación.'],['Redes y cooperación entre ciudades','Diseñamos propósito, gobernanza, criterios de participación y una agenda de aprendizaje, intercambio y proyectos compartidos.'],['Alianzas y movilización de recursos','Mapeamos aliados y mecanismos de colaboración. Estructuramos propuestas, compromisos y seguimiento según prioridades y capacidad de ejecución.']],outputs:[['Modelo de servicios','Funciones, usuarios, procesos y coordinación para inversión o cooperación.'],['Cartera y mapa de aliados','Oportunidades priorizadas, información disponible y actores pertinentes.'],['Gobernanza y agenda','Responsables, mecanismos de participación y programas compartidos.'],['Plan de seguimiento','Ruta de implementación e indicadores de avance de oportunidades y alianzas.']],stages:[['Elegir la ruta','Definimos si el foco es inversión territorial, cooperación o una combinación.'],['Preparar la oferta','Ordenamos capacidades, oportunidades y servicios que la organización puede ofrecer.'],['Articular aliados','Diseñamos propuestas y acuerdos con objetivos y responsabilidades claros.'],['Dar seguimiento','Acompañamos el avance y revisamos qué relaciones se convierten en proyectos.']],metrics:['Oportunidades con información y responsables definidos','Alianzas que avanzan a iniciativas concretas','Participación activa y aprendizaje entre ciudades','Avance de proyectos y recursos comprometidos'],exampleTitle:'Dos rutas según el desafío',example:'Un municipio puede necesitar ordenar su función de promoción de inversiones y una cartera de oportunidades. Una red de ciudades puede necesitar gobernanza, agenda y mecanismos para transferir experiencias. Cada ruta tiene entregables propios y puede contratarse por separado.',scope:'La facilitación no reemplaza permisos, contratación ni decisiones de inversión pública o privada. La consultoría no garantiza financiamiento, montos de inversión ni aprobación de proyectos; organiza capacidades y condiciones para gestionarlos.',faq:[['¿Las dos rutas se contratan juntas?','Pueden desarrollarse por separado. Definimos el alcance en función del desafío y de la capacidad de la organización.'],['¿Cómo se evita una red solo de eventos?','Con una agenda de trabajo, servicios útiles para sus miembros, compromisos de participación y seguimiento a proyectos y aprendizajes.']]}
],
en:[
{title:'Public services and citizen experience',claim:'Services designed around people’s lives.',peopleClaim:'Less friction. More clarity. Services that help.',lead:'We improve public services, procedures and processes with the people who use them and the teams who deliver them. We combine citizen experience, simplification and institutional capability so improvements can be implemented and sustained.',peopleLead:'A service works better when you know what you need, where to ask and how to get a clear answer. We help institutions identify barriers and test simpler ways to support you.',problem:'A procedure may work on paper yet remain difficult to use. Unclear requirements, disconnected channels and fragmented responsibilities create effort for users and workload for staff. We examine the actual service journey and the conditions the institution needs to improve it.',peopleProblem:'Repeating information, visiting several offices or not knowing the status of a request takes time. We listen to those experiences and work with delivery teams to improve the full journey.',who:'Municipalities, public bodies and organizations seeking to improve service delivery, simplify procedures or redesign a particular service.',modules:[['Service assessment','We review requirements, channels, available records, timings and coordination points. Interviews with users and staff identify where friction is concentrated.'],['Design with people','We map user journeys and the operating processes behind them. We co-design changes to information, support, requirements and coordination, considering accessibility.'],['Testing and adoption','We prototype improvements at an agreed scale. We define responsibilities, operational adjustments and conditions for routine adoption.']],outputs:[['Assessment and priorities','Current journey, barriers, user needs and prioritized opportunities.'],['Future service design','Proposed journey, processes, roles, channels and service communications.'],['Prototypes and evaluation','Testing materials, findings and recommended adjustments.'],['Implementation plan','Responsibilities, resources, indicators and an adoption pathway.']],stages:[['Define','Agree on the service, users, objectives, scope and available data.'],['Listen and observe','Gather experiences and examine work behind the service.'],['Design and test','Test changes for usefulness and feasibility before expansion.'],['Adopt and measure','Support adoption and leave tools to monitor improvement.']],metrics:['Time and effort to complete a procedure','Applications complete on the first attempt','Perceived clarity and satisfaction','Staff workload and operational adoption'],exampleTitle:'A business licence that is easier to understand',example:'A municipality wants to reduce repeated questions about a licence. An engagement may review requirements and contact points, test clearer guidance and redesign coordination between teams. Expected improvements are checked with users and staff before expansion.',scope:'Redesign does not mean digitizing everything. It may combine in-person improvements, content and digital tools. Software development and system integration are included only when expressly agreed.',faq:[['Should we begin by buying technology?','We first understand the problem and user journey. Technology is selected when it helps solve the challenge.'],['What must the institution contribute?','A service owner, access to relevant information and availability of staff and users to listen, test and adopt improvements.']]},
{title:'Innovation hubs and ecosystems',claim:'From bringing stakeholders together to building collaboration.',peopleClaim:'A place to connect ideas with opportunities.',lead:'We design and support innovation hubs with purpose, governance, services, programmes and sustainability. We connect stakeholders around local challenges and opportunities, linking the hub to concrete projects.',peopleLead:'A hub can help you find partners, learn, start a business or join community projects. We design what it offers, who can access it and how connections become useful opportunities.',problem:'A building, an events calendar or a partner list is not enough to develop an ecosystem. Without a clear value proposition, operating team and collaboration agreements, connections may end at meetings. We design the conditions for joint work.',peopleProblem:'Having a good idea does not always mean knowing whom to approach or how to take the next step. A hub needs clear support, useful connections and activities that respond to people’s needs.',who:'Local governments, universities, businesses and partnerships seeking to create, strengthen or refocus a hub and its ecosystem.',modules:[['Purpose and ecosystem','We identify assets, needs, stakeholders and existing capabilities, defining whom the hub serves and the value it adds.'],['Governance and operations','We design participation rules, responsibilities, decision-making, team roles and relationships with founding institutions.'],['Services and activation','We structure programmes, connections and joint projects, with a launch agenda linked to local priorities.'],['Sustainability and learning','We identify resources and monitoring mechanisms, distinguishing activity from effective collaboration and project outcomes.']],outputs:[['Ecosystem map','Stakeholders, assets, gaps and collaboration opportunities.'],['Hub model','Purpose, audiences, governance, operations and value proposition.'],['Service portfolio','Programmes, access criteria, partners and participation experience.'],['Activation plan','Initial agenda, resources, responsibilities and sustainability indicators.']],stages:[['Understand the place','Recognize existing capabilities and listen to prospective participants.'],['Co-design the model','Agree on purpose, governance and services with the founding group.'],['Activate','Support partnerships, initial programmes and launch.'],['Consolidate','Review use, collaboration and sustainability to refine the model.']],metrics:['Repeat participation and service use','Partnerships generating concrete projects','Projects progressing after introductions','Operating capacity and sustained resources'],exampleTitle:'A municipal hub with services and partners',example:'A municipality has a space it wants to turn into a hub. Support may define its audiences, governance and offer, organize a founding group and accompany initial programmes with universities, businesses and entrepreneurs. The priority is useful collaboration from the start.',scope:'The engagement may recommend space use and participation design. Architectural design, construction and ongoing operations require specific arrangements.',faq:[['Do we need our own building?','The model can start as a network of programmes and partners. A physical space depends on the services and resources available.'],['Do you strengthen existing hubs?','Yes. We can assess their value proposition, governance, service use and sustainability to refocus operations.']]},
{title:'Innovation labs and public capabilities',claim:'Teams with a mandate to innovate and the capacity to deliver.',peopleClaim:'An institution that listens, tests and improves with you.',lead:'We design public innovation labs, departments and units that work with service owners. We define their mandate, teams, processes, challenge portfolios and mechanisms for adopting tested solutions.',peopleLead:'We help create public teams that listen to your needs, test improvements and learn before expanding them. Their role is to support the departments that deliver services.',problem:'Innovation can depend on one person or stop at workshops and prototypes. If no team owns implementation, learning does not become better service delivery. We connect experimentation, decisions and operations to establish capabilities that can endure.',peopleProblem:'Ideas need someone to test them and a team able to put them into practice. A lab helps make that journey and learn from both successes and failures.',who:'Governments and public bodies seeking to establish an innovation unit, organize existing initiatives or build staff capabilities.',modules:[['Mandate and institutional position','We define purpose, functions, relationships with other departments and decisions requiring leadership support. We review capabilities and constraints with the institution.'],['Operating model','We design roles, challenge selection, experimentation, coordination and adoption. Each project has a responsible operating department.'],['Applied learning','Teams develop capabilities through real challenges, supported in listening, co-design, prototyping, evaluation and communicating learning.'],['Continuity and transfer','We document methods, decisions and tools so capabilities remain in the organization and can be used by other teams.']],outputs:[['Unit design','Mandate, functions, proposed structure, roles and coordination relationships.'],['Operating handbook','Challenge-to-adoption pathway and criteria for prioritizing, evaluating and deciding.'],['Initial portfolio','Selected challenges, owners and project briefs.'],['Capability plan','Training, implementation support and transfer tools.']],stages:[['Assess','Identify capabilities, initiatives and support needed.'],['Design the mandate','Agree on functions and mechanisms with leaders and operating teams.'],['Learn by doing','Work on a bounded challenge portfolio and support the team.'],['Establish practice','Embed tools, monitoring and adoption mechanisms.']],metrics:['Challenges with owners and evaluation criteria','Solutions adopted by operating departments','Use of methods by trained teams','Resources and leadership support for continuity'],exampleTitle:'Designing a municipal innovation department',example:'A municipality wants a department coordinating public innovation, GovTech and ecosystem development. An engagement may assess capabilities, define functions and governance, prioritize challenges and develop an implementation roadmap validated with its team.',scope:'Organizational design is a proposal for institutional validation. Administrative and budget instruments must be reviewed and approved by competent departments. The structure must reflect actual organizational capacity.',faq:[['Must a lab be a new office?','It can be a unit, cross-functional team or distributed capability. The design depends on its mandate and institutional conditions.'],['How do we move beyond pilots?','We define the adopting department, required decisions and resources for operational integration from the start.']]},
{title:'GovTech and experimentation spaces',claim:'Public challenges connected to solutions that can be tested.',peopleClaim:'Technology tested against real problems.',lead:'We design mechanisms to connect public challenges with startups, businesses and universities. We structure calls, pilots and experimentation spaces with rules, evaluation and an institutional pathway to adoption decisions.',peopleLead:'New technology should demonstrate that it helps solve a problem. We support bounded trials to understand its usefulness and the conditions it needs before wider use.',problem:'Meetings between governments and startups do not guarantee solutions. A clear problem definition, testing conditions, evaluation criteria or implementation pathway may be missing. We design these elements so collaboration can progress with explicit responsibilities.',peopleProblem:'Technology must fit the way people live and use services. Trials help reveal its value and limitations, incorporating user experience before expansion.',who:'Governments, universities, businesses and ecosystems seeking to organize GovTech challenges, test solutions or assess experimentation arrangements.',modules:[['Challenge definition','We translate a public need into a challenge with users, testing conditions, intended outcomes and a responsible department.'],['Calls and selection','We design rules, criteria and evaluation mechanisms to connect challenges with external capabilities and select relevant proposals.'],['Pilot and evaluation','We define scope, participants, data, monitoring, indicators and criteria for adoption, adjustment or stopping.'],['Sandbox and adoption pathway','We assess whether a dedicated experimentation environment is needed and which decisions require competent authorities. We design the pathway after the pilot.']],outputs:[['Challenge briefs','Problem, users, testing conditions and agreed objectives.'],['Call model','Rules, selection criteria and evaluation framework.'],['Pilot protocol','Roles, resources, information handling and exit criteria.'],['Adoption recommendation','Evidence, institutional conditions and next decisions.']],stages:[['Define the problem','Agree on the challenge and assess capacity to test and adopt.'],['Connect solutions','Organize stakeholders and a transparent selection process.'],['Experiment','Support a bounded trial with monitoring and evaluation.'],['Decide','Document evidence and conditions to continue, adjust or close.']],metrics:['Solutions meeting challenge criteria','Changes in public problem indicators','Usefulness and experience for users and staff','Operational feasibility of adoption'],exampleTitle:'Testing a citizen support tool',example:'A municipality wants to assess a tool supporting citizen service delivery. The engagement may define eligible queries, information use conditions, human oversight and usefulness criteria. Further use depends on trial evidence and the municipality’s operating capacity.',scope:'A pilot is not a purchase and does not authorize regulatory exceptions. A sandbox requires specific assessment of powers and conditions. Procurement and approvals remain with responsible institutions.',faq:[['Does every pilot need a sandbox?','No. Many trials can operate under existing rules. We assess the need for an instrument according to the challenge.'],['Does ES Digital develop the technology?','Our offer focuses on design, coordination and support. Technology development or supply is explicitly agreed when included in an engagement.']]},
{title:'Innovation districts and territorial development',claim:'A place with purpose, connections and shared projects.',peopleClaim:'More opportunities to work, start businesses and learn near you.',lead:'We design innovation district strategies grounded in actual assets: institutions, talent, businesses, spaces and public capabilities. We connect place-based vision, governance and projects that can be activated in stages.',peopleLead:'We help universities, businesses, governments and communities collaborate locally to open opportunities. The design considers how activities relate to neighbourhood life and existing residents.',problem:'Naming an area an innovation district does not create collaboration or economic activity. Without connected assets, committed institutions and an implementation agenda, the concept may remain a brand. We start with what the place has and what it needs to develop.',peopleProblem:'A district should contribute to those who live and work there. It needs to listen to communities, connect opportunities and consider access, coexistence and local impacts.',who:'Local governments, universities, anchor institutions, developers and place-based partnerships seeking to design or activate an innovation strategy.',modules:[['Place assessment','We map institutions, talent, economic activity, spaces, connectivity and existing projects, identifying opportunities and tensions with local stakeholders.'],['Vision and governance','We build a shared proposition: focus, purpose, founding stakeholders, responsibilities and collaboration mechanisms.'],['Project portfolio','We prioritize applied research, entrepreneurship, training, experimentation and space activation according to feasibility.'],['Phased implementation','We connect initial projects, resources and development conditions, defining how to evaluate progress and local effects.']],outputs:[['Place-based assessment','Assets, stakeholders, gaps, opportunities and boundary criteria.'],['District strategy','Vision, value proposition and governance model.'],['Priority portfolio','Projects with objectives, owners and feasibility conditions.'],['Roadmap','Phases, resources, coordination and a monitoring framework.']],stages:[['Recognize assets','Understand the place with its institutions and communities.'],['Agree on a vision','Identify a shared ambition and concrete commitments.'],['Activate projects','Organize initiatives that can start with existing resources.'],['Consolidate and evaluate','Review collaboration, outcomes and local effects.']],metrics:['Joint projects involving anchors and local actors','Use of innovation spaces and programmes','Training and entrepreneurship opportunities','Local participation and observed territorial effects'],exampleTitle:'Connecting a university and commercial corridor',example:'A place brings together universities, companies and commercial activity, yet its stakeholders work separately. Support may identify assets, agree on a vision and prioritize talent programmes, business challenges and urban projects that activate collaboration.',scope:'The strategy does not replace urban planning or imply building a technology park. Urban studies, architectural design and construction require specific engagements and specialists.',faq:[['Can any place become an innovation district?','Suitability depends on its assets, connections and capacity for commitment. Assessment may recommend other collaboration models.'],['Where do we start?','With a capability assessment and founding coalition, followed by feasible projects and conditions for growth.']]},
{title:'Investment, partnerships and city networks',claim:'Connecting places with resources, knowledge and opportunities.',peopleClaim:'Partners and projects opening opportunities for your community.',lead:'We design investment promotion and facilitation capabilities, strategic partnerships and city collaboration networks. The offer has two complementary pathways: territorial opportunities and cooperation for learning and delivery.',peopleLead:'We connect your community with businesses, universities and other cities. With clear objectives and commitments, these relationships can support projects, learning, jobs and service improvements.',problem:'An investor list or contact network may not generate projects. Structured opportunities, follow-up responsibilities or a shared agenda may be missing. We design functions and processes to give partnerships continuity and purpose.',peopleProblem:'Signing agreements is not enough to deliver community benefits. Partnerships need projects, owners and follow-up to become useful opportunities and services.',who:'Local governments, agencies, universities and organizations seeking to strengthen investment promotion, build partnerships or coordinate city networks.',modules:[['Investment promotion and facilitation','We design the mandate, guidance services, internal coordination and opportunity follow-up, distinguishing promotion, permits and investment decisions.'],['Opportunity portfolio','We identify projects and assets, organize relevant information and prioritize opportunities according to readiness and coordination needs.'],['City networks and cooperation','We design purpose, governance, membership criteria and an agenda of learning, exchange and shared projects.'],['Partnerships and resources','We map partners and collaboration mechanisms, structuring proposals, commitments and follow-up according to priorities and delivery capacity.']],outputs:[['Service model','Functions, audiences, processes and coordination for investment or cooperation.'],['Portfolio and partner map','Prioritized opportunities, available information and relevant stakeholders.'],['Governance and agenda','Responsibilities, participation mechanisms and shared programmes.'],['Monitoring plan','Implementation pathway and indicators of opportunity and partnership progress.']],stages:[['Choose the pathway','Define the focus: territorial investment, cooperation or both.'],['Prepare the offer','Organize capabilities, opportunities and services the institution can provide.'],['Connect partners','Design proposals and agreements with clear objectives and responsibilities.'],['Follow through','Support progress and review which relationships become projects.']],metrics:['Opportunities with information and named owners','Partnerships progressing into concrete initiatives','Active participation and city-to-city learning','Project progress and committed resources'],exampleTitle:'Two pathways for different challenges',example:'A municipality may need to organize its investment promotion function and an opportunity portfolio. A city network may need governance, an agenda and experience transfer mechanisms. Each pathway has its own deliverables and can be commissioned separately.',scope:'Facilitation does not replace permits, procurement or public and private investment decisions. Consulting does not guarantee funding, investment amounts or project approval; it organizes capabilities and conditions to pursue them.',faq:[['Must both pathways be commissioned together?','They can be developed separately. Scope follows the challenge and the organization’s capacity.'],['How do we avoid an events-only network?','Through a work agenda, useful member services, participation commitments and follow-up on projects and learning.']]}
]};

function buildServiceMarkup(index,language,perspective){
 const d=serviceDepth[language][index],t=depthLabels[language],people=perspective==='people';
 const tiles=(items,cls='depth-card')=>items.map((a,i)=>`<article class="${cls}"><span class="num">0${i+1}</span><h3>${a[0]}</h3><p>${a[1]}</p></article>`).join('');
 const related=[(index+1)%6,(index+5)%6];
 return `<section class="depth-hero"><div class="wrap"><a class="back" href="#services">${t.back}</a><div class="eyebrow">${t.label} 0${index+1} / ES DIGITAL</div><div class="depth-hero-grid"><div><div class="service-name">${d.title}</div><h1>${people?d.peopleClaim:d.claim}</h1><p class="lead">${people?d.peopleLead:d.lead}</p><a class="btn" href="#offer">${t.offer} ↓</a></div><aside class="who"><span class="eyebrow">${t.who}</span><p>${d.who}</p><a href="#experience">${t.experience} ↗</a></aside></div></div></section>
 <nav class="depth-nav" aria-label="${t.label}"><div class="wrap"><a href="#overview">${t.overview}</a><a href="#offer">${t.offer}</a><a href="#deliverables">${t.deliver}</a><a href="#working-method">${t.method}</a><a href="#questions">${t.faq}</a></div></nav>
 <section class="section depth-intro" id="overview"><div class="wrap depth-split"><div><div class="eyebrow">01 / ${t.overview}</div><h2>${t.overview}</h2></div><p class="depth-body">${people?d.peopleProblem:d.problem}</p></div></section>
 <section class="section depth-offer" id="offer"><div class="wrap"><div class="eyebrow">02 / ${t.offer}</div><h2>${t.offer}</h2><div class="depth-grid">${tiles(d.modules)}</div></div></section>
 <section class="section dark" id="deliverables"><div class="wrap"><div class="eyebrow">03 / ${t.deliver}</div><h2>${t.deliver}</h2><div class="depth-grid outputs">${tiles(d.outputs)}</div></div></section>
 <section class="section" id="working-method"><div class="wrap"><div class="eyebrow">04 / ${t.method}</div><h2>${t.method}</h2><div class="process">${tiles(d.stages,'depth-step')}</div><div class="depth-example"><div><span class="eyebrow">${t.example}</span><h3>${d.exampleTitle}</h3></div><p>${d.example}</p></div></div></section>
 <section class="section depth-offer" id="value"><div class="wrap depth-split"><div><div class="eyebrow">05 / ${t.results}</div><h2>${t.results}</h2><p class="note">${t.metricNote}</p></div><div><h3 class="metric-title">${t.metrics}</h3><ul class="metric-list">${d.metrics.map(m=>`<li>${m}</li>`).join('')}</ul></div></div></section>
 <section class="section"><div class="wrap"><div class="eyebrow">${t.contract}</div><h2>${t.contract}</h2><p class="intro">${t.contractIntro}</p><div class="formats">${tiles(t.formats)}</div><div class="scope"><h3>${t.scope}</h3><p>${d.scope}</p></div></div></section>
 <section class="section depth-questions" id="questions"><div class="wrap depth-split"><div><div class="eyebrow">${t.faq}</div><h2>${t.faq}</h2></div><div>${d.faq.map(q=>`<details class="faq"><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</div></div></section>
 <section class="section related"><div class="wrap"><h2>${t.related}</h2><div class="related-grid">${related.map(i=>`<a href="#servicio/${serviceSlugs[i]}"><span class="num">0${i+1}</span><h3>${serviceDepth[language][i].title}</h3><span>${t.link}</span></a>`).join('')}</div></div></section>`;
}
function renderServicePage(language,perspective){const i=Number(document.body.dataset.service);document.getElementById('deepContent').innerHTML=buildServiceMarkup(i,language,perspective);document.title=serviceDepth[language][i].title+' · ES Digital';document.querySelector('meta[name="description"]').content=serviceDepth[language][i][perspective==='people'?'peopleLead':'lead'];}


let previousRoute='';
function renderSingleRoute(){
 const slug=location.hash.startsWith('#servicio/')?location.hash.slice(10):'';
 const index=serviceSlugs.indexOf(slug),isService=index>=0;
 document.getElementById('homeContent').hidden=isService;
 document.getElementById('singleServiceView').hidden=!isService;
 if(isService){
  document.getElementById('deepContent').innerHTML=buildServiceMarkup(index,lang,view);
  document.title=serviceDepth[lang][index].title+' · ES Digital';
  document.querySelector('meta[name="description"]').content=serviceDepth[lang][index][view==='people'?'peopleLead':'lead'];
 }
 const changed=previousRoute!==slug;
 if(changed){requestAnimationFrame(()=>{if(isService)window.scrollTo(0,0);else{const target=document.getElementById(location.hash.slice(1));if(target)target.scrollIntoView();else window.scrollTo(0,0)}});}
 previousRoute=slug;
}
window.addEventListener('hashchange',()=>render());

const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const t=text[lang];document.documentElement.lang=lang;document.title=lang==='es'?'ES Digital — Ecosistema y Sociedad Digital':'ES Digital — Public Innovation & Ecosystems';document.querySelector('meta[name="description"]').content=lang==='es'?'Diseño e implementación de servicios públicos, capacidades de innovación y ecosistemas.':'Design and implementation of public services, innovation capabilities and ecosystems.';document.querySelectorAll('[data-i]').forEach(el=>el.innerHTML=(view==='people'&&el.dataset.i==='heroTitle')?t.peopleTitle:(view==='people'&&el.dataset.i==='heroLead')?t.peopleLead:t[el.dataset.i]);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));if(document.getElementById('art')){document.getElementById('art').setAttribute('aria-label',lang==='es'?'Ilustración conceptual de un ecosistema: Estado, empresas, universidades y sociedad civil.':'Conceptual illustration of an ecosystem: government, business, universities and civil society.');document.getElementById('serviceList').innerHTML=t.services.map((s,i)=>`<article class="service"><div class="num">0${i+1} / ES DIGITAL</div><h3>${s[0]}</h3><p class="desc">${s[view==='people'?2:1]}</p><details><summary>${t.deliverables}</summary><ul>${s[3].map(d=>`<li>${d}</li>`).join('')}</ul></details><a class="service-link" href="#servicio/${serviceSlugs[i]}">${lang==='es'?'Explorar servicio':'Explore service'} ↗</a></article>`).join('');document.getElementById('processList').innerHTML=t.steps.map((s,i)=>`<article><span class="number">0${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p></article>`).join('');document.getElementById('caseList').innerHTML=t.cases.map((c,i)=>`<article class="case"><span class="tag">${c[0]}</span><h3>${c[1]}</h3><p class="role">${c[2]}</p><p>${c[3]}</p>${i===1?`<a href="https://patricioovallewood-spec.github.io/subgerencia-innovacion-miraflores/" target="_blank" rel="noopener">${t.caseLink}</a>`:''}</article>`).join('');}if(document.body.dataset.service!==undefined)renderServicePage(lang,view);const sel=document.getElementById('serviceSelect'),selected=sel.selectedIndex;sel.innerHTML=t.services.map((s,i)=>`<option value="${i}">${s[0]}</option>`).join('');if(selected>=0)sel.selectedIndex=selected;if(document.body.dataset.service!==undefined&&!sel.dataset.initialized){sel.selectedIndex=Number(document.body.dataset.service);sel.dataset.initialized='true';}document.getElementById('briefResult').hidden=true;document.getElementById('resultActions').hidden=true;document.getElementById('status').textContent='';renderSingleRoute();try{localStorage.setItem('es-lang',lang);localStorage.setItem('es-view',view)}catch(e){}}

const menu=document.querySelector('.mobile-menu'),navigation=document.getElementById('navigation');menu.addEventListener('click',()=>{const open=navigation.classList.toggle('open');menu.setAttribute('aria-expanded',open)});navigation.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{navigation.classList.remove('open');menu.setAttribute('aria-expanded',false)}));
const dialog=document.getElementById('briefDialog');document.getElementById('openBrief').addEventListener('click',()=>dialog.showModal());document.getElementById('closeBrief').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
let brief='';document.getElementById('briefForm').addEventListener('submit',e=>{e.preventDefault();const t=text[lang],f=new FormData(e.target);brief=`${t.briefHeader}\n\n${t.briefOrg}: ${f.get('org').trim()}\n${t.briefService}: ${t.services[Number(f.get('service'))][0]}\n\n${t.briefChallenge}:\n${f.get('challenge').trim()}`;document.getElementById('briefResult').textContent=brief;document.getElementById('briefResult').hidden=false;document.getElementById('resultActions').hidden=false;document.getElementById('status').textContent=t.ready;});document.getElementById('copyBrief').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(brief);document.getElementById('status').textContent=text[lang].copied}catch(e){document.getElementById('status').textContent=text[lang].copyFail}});document.getElementById('downloadBrief').addEventListener('click',()=>{const u=URL.createObjectURL(new Blob([brief],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='ES-Digital-brief.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});render();
