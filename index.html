 por qué se les invita, cómo se utilizarán sus aportes y qué no se puede prometer. Elige canales accesibles: atención presencial, teléfono, organizaciones locales o redes sociales según el público. Después devuelve los hallazgos y lo que se decidió investigar.", "example": "Una invitación en la oficina convoca a personas que realizaron el trámite. Al cerrar las entrevistas, una ficha explica qué dificultades se detectaron y cuál será el siguiente paso.", "output": "Convocatoria accesible y devolución de hallazgos.", "owner": "Participación ciudadana y comunicaciones", "tool": "comunicacion", "gate": "Las personas conocen el uso de sus aportes y reciben una devolución."}], [{"title": "Acordar dedicación y recursos con las jefaturas", "dimension": "Política e institucional", "how": "Reúne a las jefaturas de las capacidades que necesitas. Solicita dedicación concreta, una persona de enlace y el mecanismo para ajustar prioridades cuando haya conflictos. Distingue recursos confirmados de solicitudes pendientes; comienza con un alcance que puedas sostener sin depender de apoyos informales.", "example": "Tecnología designa un enlace para revisar la viabilidad, jurídica acuerda participar en decisiones relevantes y la dirección permite tiempo de trabajo para un primer desafío.", "output": "Acuerdo de dedicación, responsables y recursos pendientes.", "owner": "Dirección del espacio y jefaturas participantes", "tool": "raci", "gate": "La dedicación y el financiamiento inicial están confirmados para el alcance elegido."}, {"title": "Verificar capacidades y disponibilidad reales", "dimension": "Evidencia", "how": "Lista las tareas del proyecto y las capacidades necesarias para ejecutarlas. Contrasta disponibilidad con carga de trabajo, experiencia y recursos existentes. Pregunta qué puede compartirse y qué debe conseguirse; una nómina amplia de participantes no equivale a capacidad operativa.", "example": "El equipo descubre que cuenta con experiencia en atención, pero no con evaluación de datos. Acuerda apoyo de otra unidad en lugar de iniciar varios pilotos sin esa capacidad.", "output": "Inventario de capacidades, brechas y disponibilidad comprobada.", "owner": "Coordinación y enlaces de las áreas", "tool": "capacidades", "gate": "Cada tarea crítica tiene capacidad disponible o una acción para conseguirla."}, {"title": "Organizar una operación inicial viable", "dimension": "Técnica", "how": "Define una cartera pequeña y distribuye tareas según capacidad real. Estima costos de investigación, pruebas, evaluación y continuidad. Crea un calendario de trabajo y revisa avances con el equipo; no asumas que hace falta una sede propia si puedes usar espacios y capacidades compartidos.", "example": "Un equipo parcial inicia un desafío, usa salas existentes y reserva apoyo de datos para la evaluación. Los otros proyectos esperan hasta confirmar capacidad.", "output": "Plan operativo inicial con tareas, costos y dedicación.", "owner": "Coordinación operativa y presupuesto", "tool": "capacidades", "gate": "El alcance es coherente con tiempo, capacidades y recursos disponibles."}, {"title": "Hacer comprensible la oferta y sus límites", "dimension": "Comunicación", "how": "Publica qué apoyo ofrece el equipo, a quién, cómo solicitarlo y cuánto trabajo puede asumir. Comunica a las jefaturas las necesidades de participación y el estado de solicitudes. Evita una campaña de lanzamiento que prometa una cartera mayor que la capacidad disponible.", "example": "La página interna anuncia acompañamiento para un primer desafío y explica los criterios de selección, el compromiso del área postulante y el canal para consultar.", "output": "Oferta clara, canal de ingreso y mensajes sobre capacidad.", "owner": "Coordinación y comunicaciones internas", "tool": "comunicacion", "gate": "Quienes solicitan apoyo entienden requisitos, alcance y tiempos por acordar."}], [{"title": "Acordar quién decide en cada etapa", "dimension": "Política e institucional", "how": "Convoca al responsable del servicio y a las áreas que autorizan recursos o cambios. Acuerda qué decisiones requieren validación y cómo se revisarán. Define un mecanismo para detener o ajustar proyectos sin que se interprete automáticamente como fracaso.", "example": "Antes de iniciar una prueba, la jefatura acuerda que podrá detenerse si no mejora la experiencia o aparecen riesgos; queda registrada la autoridad que tomará esa decisión.", "output": "Reglas de decisión y responsables por etapa.", "owner": "Coordinación y jefatura del servicio", "tool": "raci", "gate": "Cada etapa tiene una decisión explícita y una persona facultada para tomarla."}, {"title": "Encontrar dónde se traban los proyectos", "dimension": "Evidencia", "how": "Revisa un proyecto reciente y reconstruye sus decisiones, tiempos y entregables. Pregunta al equipo qué información faltó y qué aprobaciones generaron demoras. Distingue problemas del método de restricciones que el equipo no puede resolver solo.", "example": "El prototipo se terminó, pero estuvo semanas esperando saber quién aceptaría la solución. El aprendizaje lleva a incorporar al área de adopción desde el inicio.", "output": "Mapa de bloqueos y mejoras justificadas del proceso.", "owner": "Equipo de proyecto y responsable del servicio", "tool": "recorrido", "gate": "Los cambios propuestos responden a bloqueos observados, no solo a preferencias metodológicas."}, {"title": "Probar un proceso simple en un proyecto", "dimension": "Técnica", "how": "Define etapas desde el desafío hasta la adopción, con un entregable y criterio de avance por etapa. Usa un tablero o registro sencillo para responsables y pendientes. Aplica el proceso a un proyecto real y ajústalo al cierre; no necesitas imponer todas las metodologías a todos los desafíos.", "example": "Un proyecto pasa por problema delimitado, alternativas, prueba y decisión de adopción. Cada revisión verifica un entregable concreto antes de comprometer más recursos.", "output": "Proceso aplicado y registro de decisiones y aprendizajes.", "owner": "Coordinación metodológica y equipo ejecutor", "tool": "priorizacion", "gate": "El equipo puede explicar qué sigue y qué evidencia permite avanzar."}, {"title": "Dar visibilidad a avances, decisiones y bloqueos", "dimension": "Comunicación", "how": "Establece un resumen periódico con estado, siguiente decisión, responsable y apoyo requerido. Usa canales internos donde las jefaturas puedan responder. Comparte aprendizajes de ajustes o detenciones sin ocultar dificultades ni difundir información sensible.", "example": "El resumen del proyecto indica que la siguiente decisión es aprobar acceso a datos y quién debe resolverla; no se limita a informar que se realizó un taller.", "output": "Formato de seguimiento y devolución de aprendizajes.", "owner": "Coordinación del proyecto y comunicaciones internas", "tool": "comunicacion", "gate": "El resumen permite a cada actor identificar qué debe hacer."}], [{"title": "Alinear intereses y compromisos de los aliados", "dimension": "Política e institucional", "how": "Invita a los actores necesarios alrededor de un desafío concreto. Pregunta qué valor obtienen, qué pueden aportar y quién puede comprometer ese aporte. Acuerda reglas de coordinación y examina con las áreas competentes cualquier convenio necesario; no confundas asistencia a una reunión con una alianza activa.", "example": "Municipio, universidad y empresa acuerdan explorar una prueba de eficiencia hídrica: cada uno identifica su contribución, límites y responsable antes de anunciar la colaboración.", "output": "Agenda compartida y compromisos identificados.", "owner": "Articulación del ecosistema y representantes de los aliados", "tool": "actores", "gate": "Hay contribuciones y responsables, además de interés general."}, {"title": "Mapear aportes y actores que faltan", "dimension": "Evidencia", "how": "Registra capacidades, intereses y vínculos existentes según el desafío. Contrasta los aportes potenciales con disponibilidad real. Incluye usuarios y organizaciones del territorio para detectar necesidades no representadas; revisa qué relaciones requieren fortalecerse.", "example": "Hay varios proveedores tecnológicos, pero falta una organización que conozca las dificultades de los usuarios y un equipo que evalúe la prueba. El mapa permite completar esas capacidades.", "output": "Mapa de actores con aportes comprobados y vacíos.", "owner": "Equipo de articulación y responsable del desafío", "tool": "actores", "gate": "Los aliados cubren las capacidades necesarias y se identifican actores ausentes."}, {"title": "Activar un proyecto colaborativo manejable", "dimension": "Técnica", "how": "Selecciona un proyecto con alcance acotado, responsables y recursos acordados. Define hitos, intercambio de información y revisiones de compromisos. Documenta quién realiza cada tarea y cómo se ajustará el trabajo si un aporte no se concreta.", "example": "La universidad evalúa una prueba, el municipio facilita instalaciones y el proveedor aporta el prototipo. Una revisión conjunta verifica avances y pendientes antes de ampliar el proyecto.", "output": "Ficha del proyecto colaborativo y matriz de responsabilidades.", "owner": "Responsable del proyecto y enlaces de aliados", "tool": "raci", "gate": "Cada compromiso tiene tarea, entregable y mecanismo de seguimiento."}, {"title": "Movilizar aliados alrededor de una propuesta concreta", "dimension": "Comunicación", "how": "Construye mensajes diferenciados para empresas, academia, sociedad civil y áreas públicas. Explica el desafío, las contribuciones buscadas y cómo participar. Usa reuniones, redes, prensa o medios masivos cuando correspondan; comunica aportes reales y devuelve resultados a quienes participaron.", "example": "Una convocatoria busca apoyo para evaluar accesibilidad, en vez de invitar genéricamente a “sumarse al ecosistema”. Luego informa qué alianzas se activaron y qué aportó cada una.", "output": "Convocatoria con aportes buscados y plan de devolución.", "owner": "Articulación y comunicaciones", "tool": "comunicacion", "gate": "Los actores saben qué contribución se solicita y cómo ofrecerla."}], [{"title": "Habilitar la prueba y acordar sus decisiones", "dimension": "Política e institucional", "how": "Identifica al responsable del servicio, a quienes autorizan la prueba y al área que podría adoptar la solución. Revisa los resguardos aplicables con los equipos competentes. Acuerda quién puede modificar o detener la prueba y cómo se tratarán incidentes antes de invitar usuarios.", "example": "Una prueba de orientación telefónica cuenta con responsable, guion revisado y un canal para problemas. No se inicia solo con la autorización informal de un integrante del equipo.", "output": "Acuerdo de prueba, responsabilidades y resguardos.", "owner": "Responsable del servicio y áreas competentes", "tool": "raci", "gate": "La prueba tiene autorización y condiciones de operación revisadas."}, {"title": "Definir qué incertidumbre debe resolver el piloto", "dimension": "Evidencia", "how": "Formula una hipótesis y el aprendizaje necesario para decidir. Reúne la situación inicial y elige indicadores de resultado y efectos no deseados. Define cómo interpretarás cambios y qué no podrás atribuir al piloto; el diseño de evaluación debe ser proporcional a su riesgo y alcance.", "example": "La hipótesis es que una orientación previa reduce solicitudes incompletas. Se registran errores antes y durante la prueba y se revisa si cambió el perfil de solicitantes.", "output": "Hipótesis, línea de base y criterios de evaluación.", "owner": "Equipo de evaluación y responsable del servicio", "tool": "indicadores", "gate": "Puedes describir qué resultado permitiría continuar, ajustar o detener."}, {"title": "Diseñar una prueba pequeña y documentada", "dimension": "Técnica", "how": "Completa un protocolo con usuarios, duración por acordar, procedimiento, datos, riesgos y responsables. Prepara el prototipo mínimo necesario para aprender. Ensaya la operación con el personal antes de la prueba y agenda una revisión final que produzca una decisión.", "example": "Se prueba una lista de requisitos en una oficina, con registro de dudas y errores. Si aparecen problemas, el equipo ajusta el material antes de considerar otras oficinas.", "output": "Protocolo y prototipo preparados para una prueba controlada.", "owner": "Equipo ejecutor y operación del servicio", "tool": "piloto", "gate": "El protocolo puede ser ejecutado por el equipo y los criterios de decisión están acordados."}, {"title": "Explicar la prueba y devolver sus aprendizajes", "dimension": "Comunicación", "how": "Describe a usuarios y funcionarios el propósito, alcance, canales de consulta y carácter experimental de la iniciativa. Valida mensajes y condiciones de participación según el contexto. Al finalizar comunica qué se aprendió y qué se decidió, evitando presentar el inicio del piloto como un resultado logrado.", "example": "La invitación dice que se probará una nueva orientación y ofrece un canal para dificultades. El cierre informa si se mantendrá, ajustará o retirará y explica la evidencia utilizada.", "output": "Mensajes de inicio, consulta y cierre del piloto.", "owner": "Responsable del servicio y comunicaciones", "tool": "comunicacion", "gate": "Participantes comprenden la prueba y existe una devolución prevista."}], [{"title": "Acordar quién adoptará y sostendrá la solución", "dimension": "Política e institucional", "how": "Solicita una reunión con la jefatura del servicio y las áreas de presupuesto, tecnología o jurídica que correspondan. Lleva una página con problema, resultados y decisión solicitada. Acuerda quién operará la solución, qué compromisos puede asumir y qué autorizaciones siguen pendientes.", "example": "Tras probar una orientación para permisos, la dirección responsable acuerda quién mantendrá la información y capacitará al personal. El laboratorio acompaña la transferencia, pero no sustituye al dueño del servicio.", "output": "Acuerdo de adopción con responsable y decisiones pendientes.", "owner": "Jefatura del servicio y áreas competentes", "tool": "raci", "gate": "El área receptora acepta el alcance y se identifica la vía institucional de adopción."}, {"title": "Comprobar si la evidencia justifica continuar", "dimension": "Evidencia", "how": "Reúne datos anteriores y posteriores, además de experiencias de usuarios y funcionarios. Revisa qué mejoró, para quién y qué dificultades persisten. Examina cambios en volumen, personal o perfil de usuarios; si la evidencia es insuficiente, acuerda una prueba adicional antes de recomendar ampliación.", "example": "Disminuyen las solicitudes incompletas, pero también cambió el personal. El equipo entrevista usuarios y analiza registros para distinguir explicaciones antes de atribuir la mejora al piloto.", "output": "Ficha de resultados, límites y recomendación de decisión.", "owner": "Equipo de evaluación y responsable del servicio", "tool": "indicadores", "gate": "La decisión se apoya en resultados y límites explícitos, no solo en satisfacción del equipo."}, {"title": "Preparar una incorporación gradual al servicio", "dimension": "Técnica", "how": "Con el área receptora, define procedimiento, capacitación, mantenimiento, costos recurrentes y seguimiento. Revisa dependencias técnicas y la vía de adopción con las áreas competentes. Comienza con un alcance manejable y fija qué condiciones revisar antes de ampliar o replicar.", "example": "La nueva orientación se incorpora primero en una oficina. Se asignan responsables para actualizar materiales y revisar errores; se amplía cuando funciona y hay recursos para sostenerla.", "output": "Plan de adopción con tareas, recursos y criterios de ampliación.", "owner": "Operación del servicio, tecnología y presupuesto", "tool": "adopcion", "gate": "Están acordados operación, mantenimiento y recursos para el alcance inicial."}, {"title": "Comunicar el cambio y facilitar su apropiación", "dimension": "Comunicación", "how": "Explica a funcionarios qué cambia en su trabajo y ofrece instrucciones, formación y un canal de dudas. A usuarios comunica cómo acceder a la mejora, desde cuándo y qué límites tiene. Coordina redes, web, atención presencial y prensa según el público; anuncia resultados únicamente con evidencia disponible.", "example": "El equipo de atención recibe una guía para orientar solicitudes. Los usuarios encuentran la misma información en web y oficina; un mensaje público explica la mejora sin afirmar que se eliminaron todos los errores.", "output": "Plan de transición con mensajes, canales y responsables.", "owner": "Responsable del servicio y comunicaciones", "tool": "comunicacion", "gate": "Personal y usuarios reciben información coherente y saben cómo usar el cambio."}], [{"title": "Acordar qué decisión informará la evaluación", "dimension": "Política e institucional", "how": "Reúne al responsable del servicio y a quienes deciden continuidad o recursos. Define qué quieren saber y qué harán con los resultados. Asegura acceso autorizado a información y una revisión donde puedan decidir; evita producir indicadores que nadie utilizará.", "example": "La dirección acuerda que revisará si una mejora reduce visitas repetidas y mantiene accesibilidad antes de autorizar una ampliación.", "output": "Pregunta de evaluación y decisión asociada.", "owner": "Jefatura del servicio y responsables de evaluación", "tool": "raci", "gate": "Hay una decisión concreta, responsables y acceso a información por confirmar o acordado."}, {"title": "Construir una línea de base y reconocer los límites", "dimension": "Evidencia", "how": "Define resultados para las personas y revisa qué información previa existe. Registra fuentes, calidad, frecuencia y vacíos. Distingue actividades de resultados y de impacto; analiza explicaciones alternativas y solicita apoyo especializado si necesitas inferir efectos causales.", "example": "Contar talleres no indica que mejoró un servicio. El equipo registra visitas repetidas y comprensión de requisitos, e informa que una comparación antes/después por sí sola no demuestra causalidad.", "output": "Línea de base y ficha de indicadores con limitaciones.", "owner": "Evaluación, datos y personal del servicio", "tool": "indicadores", "gate": "Las medidas tienen fuente y definición; las conclusiones respetan el alcance del método."}, {"title": "Organizar un seguimiento que permita aprender", "dimension": "Técnica", "how": "Dibuja cómo la intervención podría producir el resultado esperado e identifica supuestos. Selecciona pocas medidas útiles, define responsables y un registro simple. Agenda revisiones para interpretar datos y experiencia de usuarios y documentar las decisiones tomadas.", "example": "Una orientación más clara debería reducir errores si las personas la reciben y comprenden. El seguimiento verifica ambas condiciones, además de las solicitudes incompletas.", "output": "Teoría de cambio y rutina de revisión de resultados.", "owner": "Equipo de proyecto y evaluación", "tool": "cambio", "gate": "El seguimiento comprueba supuestos y permite modificar el trabajo."}, {"title": "Comunicar resultados sin exagerar sus alcances", "dimension": "Comunicación", "how": "Prepara una síntesis que explique qué se observó, con qué datos, en qué periodo y con qué límites. Adapta el mensaje para autoridades, funcionarios y ciudadanía. Incluye dificultades y próximos pasos; solicita revisión técnica antes de publicar cifras o atribuir impacto.", "example": "Un comunicado informa menos errores en la oficina participante, aclara el alcance de la prueba y evita afirmar una mejora en todo el municipio.", "output": "Síntesis revisada de resultados y límites.", "owner": "Evaluación y comunicaciones", "tool": "comunicacion", "gate": "Las afirmaciones públicas pueden vincularse a una fuente y alcance claros."}], [{"title": "Acordar vocerías y decisiones de comunicación", "dimension": "Política e institucional", "how": "Identifica quién valida mensajes, quién habla en nombre del proyecto y qué áreas deben coordinarse. Acuerda cómo informar dificultades y resolver mensajes contradictorios. Vincula la comunicación con el propósito público y las decisiones del proyecto, no solo con hitos de autoridades.", "example": "La dirección valida cambios del servicio, evaluación revisa cifras y comunicaciones prepara el mensaje. Un canal definido permite explicar una demora sin que cada área publique una versión diferente.", "output": "Vocerías y matriz de validación de mensajes.", "owner": "Autoridad patrocinadora, responsable del servicio y comunicaciones", "tool": "raci", "gate": "Existe una ruta de validación y respuesta para mensajes relevantes."}, {"title": "Conocer públicos y comprobar la comprensión", "dimension": "Evidencia", "how": "Pregunta a usuarios, funcionarios y aliados qué necesitan saber y por qué canales reciben información. Revisa dudas, consultas y barreras de acceso. Prueba un mensaje con personas del público antes de difundirlo y observa si comprenden qué deben hacer; alcance en redes no equivale a comprensión o legitimidad.", "example": "Un mensaje sobre un nuevo trámite recibe muchas vistas, pero las consultas muestran que no se entiende quién puede usarlo. El equipo ajusta requisitos y prueba la explicación con usuarios.", "output": "Mapa de públicos, necesidades informativas y prueba de mensajes.", "owner": "Participación, atención ciudadana y comunicaciones", "tool": "entrevistas", "gate": "El mensaje permite comprender la acción esperada y no depende solo de métricas de difusión."}, {"title": "Preparar un calendario y un sistema de respuesta", "dimension": "Técnica", "how": "Organiza mensajes por público, etapa, canal y responsable. Coordina web, atención, redes y medios según pertinencia, con información consistente. Define quién contesta dudas y cómo se actualizan materiales cuando cambie el proyecto; reserva tiempo para devolución y aprendizaje.", "example": "Antes del cambio se informa al personal, durante el lanzamiento se actualizan web y oficina, y después se revisan dudas para corregir materiales y devolver resultados.", "output": "Calendario con piezas, responsables y canal de respuesta.", "owner": "Comunicaciones y operación del servicio", "tool": "comunicacion", "gate": "Cada pieza tiene responsable, momento, público y una acción esperada."}, {"title": "Dar visibilidad con evidencia y devolver resultados", "dimension": "Comunicación", "how": "Redacta un mensaje que explique problema, avance comprobable y próximo paso. Diferencia lo que necesitan autoridades, personal, usuarios y aliados. Elige prensa, medios masivos, redes o canales locales según a quién buscas llegar. Publica también dificultades y explica qué aportes se incorporaron y cuáles no.", "example": "Una nota de prensa explica la mejora probada y sus límites; una publicación en redes orienta cómo usarla; una devolución a participantes informa qué se cambió gracias a sus aportes.", "output": "Mensajes y devolución respaldados por evidencia.", "owner": "Comunicaciones, responsable del servicio y participación", "tool": "comunicacion", "gate": "El público sabe qué cambió, cómo participar o utilizarlo y dónde consultar."}]], "en": [[{"title": "Agree a mandate and political sponsor", "dimension": "Political and institutional", "how": "Prepare a one-page brief covering the public need, scope and decisions requested. Meet the sponsor and service lead to agree who authorises, who delivers and how blockers will be resolved. Ask for verifiable commitments rather than a general statement of support.", "example": "For business permits, the sponsor authorises cross-department coordination, appoints a lead and agrees where unresolved decisions will be escalated.", "output": "Completed purpose, mandate and sponsorship worksheet, recording decisions, commitments and outstanding issues.", "owner": "Political sponsor and innovation lead", "tool": "mandato", "gate": "Present the worksheet to the sponsor and record agreed commitments."}, {"title": "Ground the mandate in evidence of the problem", "dimension": "Evidence", "how": "Review complaints, waiting times and institutional priorities. Speak with users and frontline staff to check the records. Explain who faces the difficulty and what remains uncertain; other cities having a lab does not by itself justify creating one.", "example": "Records show repeat visits for a permit. The team checks whether confusing requirements explain them before proposing a new structure.", "output": "Completed challenge framing and design questions, recording decisions, commitments and outstanding issues.", "owner": "Political sponsor and innovation lead", "tool": "desafio", "gate": "Explore alternatives without building a particular technology into the question."}, {"title": "Turn the mandate into working rules", "dimension": "Technical", "how": "Use a responsibilities matrix for prioritisation, testing, budget and adoption. Set a coordination routine and a simple decision log. Review formalisation with the relevant department: a matrix cannot override formal powers.", "example": "The lab facilitates design, the service director owns operational decisions, budget reviews resources and legal staff assess the institutional route.", "output": "Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.", "owner": "Political sponsor and innovation lead", "tool": "raci", "gate": "Confirm responsibilities with the named people. The matrix does not replace their formal powers."}, {"title": "Explain the mandate and mobilise internal participation", "dimension": "Communication", "how": "Write a short message explaining why the space exists, what it can do and how departments can request support. Validate it with the sponsor before wider publication. Include a contact channel and a concrete invitation; check whether staff understand their role.", "example": "An internal invitation asks each department to propose a challenge with an owner and evidence. Public communication explains the purpose without promising results that do not yet exist.", "output": "Completed communication and feedback plan, recording decisions, commitments and outstanding issues.", "owner": "Political sponsor and innovation lead", "tool": "comunicacion", "gate": "Provide feedback and check understanding and participation as well as reach."}], [{"title": "Agree access to the service and its staff", "dimension": "Political and institutional", "how": "Agree the research scope with the service lead, including staff time and authorised access to records. Identify who will validate the challenge and what decisions the team may take afterwards. Address relevant safeguards before collecting information.", "example": "The service lead names a contact, allows observation of guidance and agrees to review the problem brief before solution development.", "output": "Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.", "owner": "Service owner and research facilitator", "tool": "raci", "gate": "Confirm responsibilities with the named people. The matrix does not replace their formal powers."}, {"title": "Listen to users and cross-check records", "dimension": "Evidence", "how": "Review complaints, delays and errors. Use exploratory interviews with different profiles, including people facing access barriers. Ask about specific experiences and avoid unnecessary personal identifiers. Expand the research if the first round leaves important differences unexplained.", "example": "Incomplete applications may reflect confusing information for some users and lack of digital access for others. Those causes need different responses.", "output": "Completed exploratory interview guide, recording decisions, commitments and outstanding issues.", "owner": "Service owner and research facilitator", "tool": "entrevistas", "gate": "Include missing profiles and use the findings to build a user journey map."}, {"title": "Frame an actionable challenge before choosing solutions", "dimension": "Technical", "how": "Map service steps with users and staff. Identify where the difficulty occurs and describe who needs what improvement and why. Compare scope, feasibility and the service owner's commitment; avoid treating a platform as the problem itself.", "example": "Replace 'we need an app' with 'how might we help applicants understand requirements before they visit the office?'", "output": "Completed user journey map, recording decisions, commitments and outstanding issues.", "owner": "Service owner and research facilitator", "tool": "recorrido", "gate": "Frame the challenge around obstacles supported by evidence."}, {"title": "Invite participation and return findings", "dimension": "Communication", "how": "Explain why people are invited, how their input will be used and what cannot yet be promised. Choose accessible channels: offices, telephone, community organisations or social media as appropriate. Return findings and explain what the team will investigate next.", "example": "An office invitation recruits recent applicants. A follow-up brief explains the difficulties identified and the next step.", "output": "Completed communication and feedback plan, recording decisions, commitments and outstanding issues.", "owner": "Service owner and research facilitator", "tool": "comunicacion", "gate": "Provide feedback and check understanding and participation as well as reach."}], [{"title": "Agree staff time and resources with department heads", "dimension": "Political and institutional", "how": "Meet the departments whose capabilities are needed. Ask for specific allocated time, a contact and a way to resolve competing priorities. Distinguish confirmed resources from pending requests. Start with a scope that can be sustained without informal favours.", "example": "Technology appoints a feasibility contact, legal staff join relevant decisions and the director allocates staff time to one initial challenge.", "output": "Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.", "owner": "Operations, people and budget teams", "tool": "raci", "gate": "Confirm responsibilities with the named people. The matrix does not replace their formal powers."}, {"title": "Check actual capabilities and availability", "dimension": "Evidence", "how": "List project tasks and required skills. Check capacity against workloads, experience and resources. Identify what can be shared and what must be obtained; a long list of participants is not the same as an operational team.", "example": "The team has frontline expertise but lacks data evaluation skills. It secures support from another department rather than starting several unsupported pilots.", "output": "Completed capabilities and resources matrix, recording decisions, commitments and outstanding issues.", "owner": "Operations, people and budget teams", "tool": "capacidades", "gate": "Reduce the portfolio if critical gaps have neither an owner nor resources."}, {"title": "Organise a viable initial operation", "dimension": "Technical", "how": "Keep the portfolio small and allocate tasks according to actual capacity. Estimate research, testing, evaluation and continuity costs. Create a working schedule and review progress. Shared rooms and expertise may be sufficient without a dedicated building.", "example": "A part-time team starts one challenge, uses existing meeting rooms and secures data support for evaluation. Other projects wait for confirmed capacity.", "output": "Completed capabilities and resources matrix, recording decisions, commitments and outstanding issues.", "owner": "Operations, people and budget teams", "tool": "capacidades", "gate": "Reduce the portfolio if critical gaps have neither an owner nor resources."}, {"title": "Explain the support offer and its limits", "dimension": "Communication", "how": "Publish what support is available, for whom, how to request it and how much work the team can accept. Explain departmental participation needs and the status of requests. Avoid a launch campaign that promises more projects than available capacity permits.", "example": "An internal page offers support for one initial challenge and explains selection criteria, the requesting department's commitment and where to ask questions.", "output": "Completed communication and feedback plan, recording decisions, commitments and outstanding issues.", "owner": "Operations, people and budget teams", "tool": "comunicacion", "gate": "Provide feedback and check understanding and participation as well as reach."}], [{"title": "Agree who decides at each stage", "dimension": "Political and institutional", "how": "Meet the service owner and those who authorise resources or changes. Define which decisions need validation and how they will be reviewed. Agree how a project can be stopped or adjusted without automatically treating learning as failure.", "example": "Before testing, the lead agrees it can stop if user experience does not improve or risks appear, and records who will make that decision.", "output": "Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.", "owner": "Innovation lead and project owners", "tool": "raci", "gate": "Confirm responsibilities with the named people. The matrix does not replace their formal powers."}, {"title": "Identify where projects get stuck", "dimension": "Evidence", "how": "Reconstruct a recent project's decisions, timing and deliverables. Ask what information was missing and which approvals caused delays. Distinguish process weaknesses from restrictions that require action beyond the project team.", "example": "A completed prototype waited weeks because no adoption owner had been identified. The process is changed to involve that department from the start.", "output": "Completed user journey map, recording decisions, commitments and outstanding issues.", "owner": "Innovation lead and project owners", "tool": "recorrido", "gate": "Frame the challenge around obstacles supported by evidence."}, {"title": "Test a simple process on a real project", "dimension": "Technical", "how": "Define stages from problem framing to adoption, each with a deliverable and an advancement criterion. Use a simple board or log for tasks and unresolved issues. Apply the process to one real project and adapt it afterwards instead of imposing every method on every challenge.", "example": "A project moves through problem framing, alternatives, testing and adoption decisions. Each review checks a specific deliverable before committing further resources.", "output": "Completed challenge prioritisation matrix, recording decisions, commitments and outstanding issues.", "owner": "Innovation lead and project owners", "tool": "priorizacion", "gate": "Create challenge worksheets and assign an owner to each selected project."}, {"title": "Make progress, decisions and blockers visible", "dimension": "Communication", "how": "Set a regular update covering status, the next decision, its owner and support required. Use internal channels where decision-makers can respond. Share learning from adjustments or stopped work without concealing problems or disclosing sensitive information.", "example": "The update states that authorised data access is the next decision and identifies who must resolve it, rather than only reporting that a workshop took place.", "output": "Completed communication and feedback plan, recording decisions, commitments and outstanding issues.", "owner": "Innovation lead and project owners", "tool": "comunicacion", "gate": "Provide feedback and check understanding and participation as well as reach."}], [{"title": "Align partners' interests and commitments", "dimension": "Political and institutional", "how": "Bring relevant actors together around a specific challenge. Ask what value they expect, what they can contribute and who may commit that contribution. Agree coordination rules and examine any necessary agreements with competent departments. Attendance is not an active partnership.", "example": "A municipality, university and company explore a water-efficiency test, identifying contributions, limits and owners before announcing collaboration.", "output": "Completed stakeholder and contributions map, recording decisions, commitments and outstanding issues.", "owner": "Ecosystem coordinator and partner contacts", "tool": "actores", "gate": "Agree a shared agenda and review actual contributions."}, {"title": "Map contributions and missing actors", "dimension": "Evidence", "how": "Record capabilities, interests and existing connections in relation to the challenge. Check potential contributions against availability. Include users and local organisations to identify unrepresented needs and relationships that must be strengthened.", "example": "Several technology providers are interested, but user insight and evaluation capacity are missing. The map makes those gaps visible.", "output": "Completed stakeholder and contributions map, recording decisions, commitments and outstanding issues.", "owner": "Ecosystem coordinator and partner contacts", "tool": "actores", "gate": "Agree a shared agenda and review actual contributions."}, {"title": "Activate a manageable collaborative project", "dimension": "Technical", "how": "Select a bounded project with agreed owners and resources. Define milestones, information exchange and commitment reviews. Document who delivers each task and what changes if a contribution does not materialise.", "example": "The university evaluates, the municipality provides access to facilities and the company supplies a prototype. Partners review delivery before considering expansion.", "output": "Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.", "owner": "Ecosystem coordinator and partner contacts", "tool": "raci", "gate": "Confirm responsibilities with the named people. The matrix does not replace their formal powers."}, {"title": "Mobilise partners with a concrete proposition", "dimension": "Communication", "how": "Tailor messages for business, academia, civil society and public departments. Explain the challenge, contributions sought and how to participate. Choose meetings, social media or press according to audience. Communicate actual contributions and return findings to participants.", "example": "A call seeks accessibility-evaluation support rather than asking organisations generically to 'join the ecosystem'. It later explains which partnerships became active.", "output": "Completed communication and feedback plan, recording decisions, commitments and outstanding issues.", "owner": "Ecosystem coordinator and partner contacts", "tool": "comunicacion", "gate": "Provide feedback and check understanding and participation as well as reach."}], [{"title": "Enable the test and agree decision authority", "dimension": "Political and institutional", "how": "Identify the service owner, those authorising the test and the potential adopter. Review applicable safeguards with competent teams. Agree who may change or stop the test and how incidents will be handled before inviting users.", "example": "A telephone-guidance test has a responsible lead, a reviewed script and an issue channel; it is not launched on an informal team member's approval alone.", "output": "Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.", "owner": "Pilot lead, service owner and evaluator", "tool": "raci", "gate": "Confirm responsibilities with the named people. The matrix does not replace their formal powers."}, {"title": "Define the uncertainty the pilot must resolve", "dimension": "Evidence", "how": "Formulate the hypothesis and learning needed for a decision. Gather baseline information and choose outcome and unintended-effect indicators. Define how changes will be interpreted and what cannot be attributed to the pilot; evaluation should match risk and scope.", "example": "The hypothesis is that advance guidance reduces incomplete applications. The team records errors before and during the test and checks whether applicant profiles changed.", "output": "Completed indicators and baseline worksheet, recording decisions, commitments and outstanding issues.", "owner": "Pilot lead, service owner and evaluator", "tool": "indicadores", "gate": "Review indicators at each decision point; avoid measuring activity alone."}, {"title": "Design a small, documented test", "dimension": "Technical", "how": "Prepare a protocol covering users, duration to be agreed, procedure, data, risks and responsibilities. Build the smallest prototype needed to learn. Rehearse with staff and schedule a final review that produces a decision, not just a report.", "example": "A requirements checklist is tested in one office, with doubts and errors recorded. It is adjusted before other offices are considered.", "output": "Completed prototype and experimentation protocol, recording decisions, commitments and outstanding issues.", "owner": "Pilot lead, service owner and evaluator", "tool": "piloto", "gate": "Review evidence and safeguards. A test does not automatically justify expansion."}, {"title": "Explain the test and return its learning", "dimension": "Communication", "how": "Tell users and staff the purpose, scope, consultation channel and experimental nature of the initiative. Review messages and participation conditions in context. At the end, explain findings and the decision; launching a pilot is not itself a successful outcome.", "example": "The invitation explains that new guidance is being tested. The closing message explains whether it will continue, change or stop, and the evidence behind that decision.", "output": "Completed communication and feedback plan, recording decisions, commitments and outstanding issues.", "owner": "Pilot lead, service owner and evaluator", "tool": "comunicacion", "gate": "Provide feedback and check understanding and participation as well as reach."}], [{"title": "Agree who will adopt and sustain the solution", "dimension": "Political and institutional", "how": "Meet the service lead and relevant budget, technology or legal departments. Bring a one-page brief with the problem, findings and requested decision. Agree who will operate the solution, which commitments can be made and which approvals remain outstanding.", "example": "After testing permit guidance, the service director assigns information maintenance and staff training. The lab supports transfer but does not replace the service owner.", "output": "Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.", "owner": "Service owner, operations and budget teams", "tool": "raci", "gate": "Confirm responsibilities with the named people. The matrix does not replace their formal powers."}, {"title": "Check whether evidence justifies continuation", "dimension": "Evidence", "how": "Bring together before-and-after data and user and staff experience. Review what improved, for whom and what remains difficult. Check changes in volume, staffing or user profiles; if evidence is insufficient, agree a further test before recommending expansion.", "example": "Incomplete applications declined, but staffing also changed. Interviews and records help examine alternative explanations before crediting the pilot.", "output": "Completed indicators and baseline worksheet, recording decisions, commitments and outstanding issues.", "owner": "Service owner, operations and budget teams", "tool": "indicadores", "gate": "Review indicators at each decision point; avoid measuring activity alone."}, {"title": "Prepare gradual incorporation into the service", "dimension": "Technical", "how": "Agree procedures, training, maintenance, recurring costs and monitoring with the receiving department. Review technical dependencies and the adoption route with competent teams. Begin with a manageable scope and define what must be checked before expansion or replication.", "example": "New guidance starts in one office. Named staff update materials and review errors; it expands only when it works and resources can sustain it.", "output": "Completed adoption and continuity plan, recording decisions, commitments and outstanding issues.", "owner": "Service owner, operations and budget teams", "tool": "adopcion", "gate": "Confirm resources and the adoption route before committing to expansion dates."}, {"title": "Communicate the change and support uptake", "dimension": "Communication", "how": "Explain to staff what changes in their work, providing instructions, training and a question channel. Tell users how and when to access the improvement and its limits. Coordinate social media, web, offices and press according to audience; only announce evidence-supported results.", "example": "Frontline staff receive a guidance sheet. Website and office information match, and the public message explains the improvement without claiming that all errors have disappeared.", "output": "Completed communication and feedback plan, recording decisions, commitments and outstanding issues.", "owner": "Service owner, operations and budget teams", "tool": "comunicacion", "gate": "Provide feedback and check understanding and participation as well as reach."}], [{"title": "Agree which decision the evaluation will inform", "dimension": "Political and institutional", "how": "Meet the service owner and those deciding continuation or resources. Define what they need to know and what they will do with findings. Secure authorised information access and a decision review. Avoid producing indicators that nobody will use.", "example": "The director agrees to review repeat visits and accessibility before authorising expansion.", "output": "Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.", "owner": "Evaluation, data and service teams", "tool": "raci", "gate": "Confirm responsibilities with the named people. The matrix does not replace their formal powers."}, {"title": "Build a baseline and acknowledge limits", "dimension": "Evidence", "how": "Define outcomes for people and review existing information. Record sources, quality, frequency and gaps. Distinguish activities, outcomes and impact; examine alternative explanations and seek specialist support when causal inference is needed.", "example": "Workshop counts do not show service improvement. The team measures repeat visits and understanding and explains that a before-and-after comparison alone does not establish causality.", "output": "Completed indicators and baseline worksheet, recording decisions, commitments and outstanding issues.", "owner": "Evaluation, data and service teams", "tool": "indicadores", "gate": "Review indicators at each decision point; avoid measuring activity alone."}, {"title": "Organise monitoring that supports learning", "dimension": "Technical", "how": "Explain how the intervention could produce the intended outcome and identify assumptions. Choose a few useful measures, assign owners and use a simple record. Schedule reviews combining data and user experience, documenting resulting decisions.", "example": "Clearer guidance should reduce errors if people receive and understand it. Monitoring checks both assumptions as well as incomplete applications.", "output": "Completed practical theory of change, recording decisions, commitments and outstanding issues.", "owner": "Evaluation, data and service teams", "tool": "cambio", "gate": "Turn outcomes into indicators and evaluate assumptions."}, {"title": "Communicate findings without overstating them", "dimension": "Communication", "how": "Prepare a summary explaining what was observed, with which data, over what period and with which limitations. Tailor messages for authorities, staff and residents. Include difficulties and next steps; request technical review before publishing figures or claiming impact.", "example": "A message reports fewer errors in the participating office, states the test's scope and avoids claiming improvement across the municipality.", "output": "Completed communication and feedback plan, recording decisions, commitments and outstanding issues.", "owner": "Evaluation, data and service teams", "tool": "comunicacion", "gate": "Provide feedback and check understanding and participation as well as reach."}], [{"title": "Agree spokespersons and communication decisions", "dimension": "Political and institutional", "how": "Identify message approvers, spokespersons and departments that must coordinate. Agree how to report difficulties and resolve inconsistent messages. Link communication to public purpose and project decisions rather than political milestones alone.", "example": "The director validates service changes, evaluation reviews figures and communications prepares the message. A clear channel prevents conflicting explanations of a delay.", "output": "Completed responsibilities and decisions matrix, recording decisions, commitments and outstanding issues.", "owner": "Communications, project lead and participation team", "tool": "raci", "gate": "Confirm responsibilities with the named people. The matrix does not replace their formal powers."}, {"title": "Understand audiences and check comprehension", "dimension": "Evidence", "how": "Ask users, staff and partners what they need to know and which channels they use. Review questions and access barriers. Test a message with its intended audience before publication and check whether people understand the expected action; reach is not comprehension or legitimacy.", "example": "A message gets many views but users do not understand eligibility. The team clarifies requirements and tests the explanation with users.", "output": "Completed exploratory interview guide, recording decisions, commitments and outstanding issues.", "owner": "Communications, project lead and participation team", "tool": "entrevistas", "gate": "Include missing profiles and use the findings to build a user journey map."}, {"title": "Prepare a calendar and a response process", "dimension": "Technical", "how": "Organise messages by audience, stage, channel and owner. Coordinate web, frontline information, social media and relevant media with consistent content. Define who answers questions and updates material when the project changes; allow time for feedback and learning.", "example": "Staff are informed before the change, web and office information are updated at launch, and questions inform subsequent corrections.", "output": "Completed communication and feedback plan, recording decisions, commitments and outstanding issues.", "owner": "Communications, project lead and participation team", "tool": "comunicacion", "gate": "Provide feedback and check understanding and participation as well as reach."}, {"title": "Build visibility with evidence and return findings", "dimension": "Communication", "how": "Write messages explaining the problem, a verifiable development and the next step. Distinguish what authorities, staff, users and partners need. Select press, mass media, social media or local channels accordingly. Report difficulties and explain which contributions were incorporated and why.", "example": "A press note explains a tested improvement and its limits, a social post tells people how to use it, and participant feedback explains changes made from their input.", "output": "Completed communication and feedback plan, recording decisions, commitments and outstanding issues.", "owner": "Communications, project lead and participation team", "tool": "comunicacion", "gate": "Provide feedback and check understanding and participation as well as reach."}]]}, "anchors": {"es": [["No hay respaldo ni mandato acordado.", "Hay respaldo verbal, sin responsabilidades ni recursos acordados.", "Hay patrocinador y mandato; faltan decisiones o recursos por cerrar.", "Mandato, responsables y recursos funcionan en proyectos reales.", "Además, la gobernanza se revisa y tiene mecanismos de continuidad."], ["Los desafíos se eligen sin evidencia.", "Hay intuiciones o registros aislados, sin escuchar a usuarios.", "Hay un problema delimitado y una primera escucha de usuarios.", "Se combinan datos, usuarios y análisis de causas para priorizar.", "El proceso se aplica regularmente y se revisa su calidad."], ["No hay personas ni recursos asignados.", "Hay apoyos informales o dedicación ocasional.", "Hay responsable y dedicación; faltan capacidades o recursos.", "Hay capacidades y recursos suficientes para la cartera actual.", "Se planifican continuidad, reemplazos y fortalecimiento de capacidades."], ["No existe un proceso de trabajo.", "Se trabaja de forma ocasional, sin criterios compartidos.", "Hay etapas y plan inicial, todavía aplicados de forma irregular.", "Se usan etapas, responsables y criterios para continuar o detener.", "El proceso se mejora con aprendizajes documentados de proyectos."], ["No se han identificado aliados.", "Hay contactos, pero sin contribuciones concretas.", "Hay aliados con contribuciones para un primer proyecto.", "Existe agenda compartida, responsables y seguimiento de compromisos.", "La colaboración se sostiene y se revisan aportes y resultados."], ["No se han diseñado ni realizado pruebas.", "Hay ideas de pruebas, sin hipótesis ni protocolo.", "Se realiza una prueba con hipótesis, usuarios y alcance definidos.", "Las pruebas incluyen riesgos, datos y criterios previos de decisión.", "Se documentan aprendizajes y se usan para continuar, ajustar o detener."], ["No se ha definido quién adoptaría las soluciones.", "Hay intención de adoptar, sin responsable ni vía acordada.", "Hay área responsable y plan inicial de adopción.", "Una solución se incorporó a la operación con recursos y mantenimiento.", "La adopción se sostiene y la ampliación o réplica se evalúa con evidencia."], ["No se han definido resultados ni indicadores.", "Se cuentan actividades, sin línea de base ni resultados para usuarios.", "Hay resultados esperados e indicadores con una primera línea de base.", "Se revisan resultados con fuentes, responsables y límites de atribución.", "La evidencia se usa regularmente para decidir y revisar efectos no deseados."], ["No se planifica la comunicación.", "Se difunden actividades, sin públicos ni mensajes definidos.", "Hay públicos, mensajes, canales y responsables definidos.", "Se comunica evidencia y se devuelve a participantes lo aprendido.", "Se revisa comprensión y apropiación; se comunican también límites y dificultades."]], "en": [["No support or agreed mandate.", "Verbal support, without agreed responsibilities or resources.", "A sponsor and mandate exist; decisions or resources remain outstanding.", "Mandate, owners and resources work in real projects.", "Governance is reviewed and has continuity mechanisms."], ["Challenges are selected without evidence.", "Isolated ideas or records, without listening to users.", "A bounded problem and initial user research exist.", "Data, user insight and cause analysis inform prioritisation.", "The process is applied regularly and its quality reviewed."], ["No people or resources assigned.", "Informal support or occasional staff time.", "A lead and allocated time exist; skills or resources remain missing.", "Capabilities and resources support the current portfolio.", "Continuity, replacements and capability development are planned."], ["No working process exists.", "Occasional work without shared criteria.", "Initial stages and a plan exist but are applied inconsistently.", "Stages, owners and criteria to continue or stop are used.", "Documented project learning improves the process."], ["No partners identified.", "Contacts exist without concrete contributions.", "Partners contr
